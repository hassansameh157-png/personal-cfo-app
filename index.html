<title>Personal CFO</title>
<!-- Real bug, not a Chrome setting: this tag was missing this whole time.
     Without it, any real top-level mobile browser tab (GitHub Pages, the
     installed home-screen shortcut) falls back to rendering at a ~980px
     desktop-style layout viewport and zooming out to fit -- which is
     exactly the "sidebar/desktop layout on a phone" the user hit. It never
     showed up inside the claude.ai Artifact preview because that iframe's
     size is driven by the parent page's own responsive layout, not by this
     document's (previously absent) viewport meta tag. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Home-screen install: real, fetchable manifest.json/icons/sw.js, since
     GitHub Pages serves actual files (Chrome's WebAPK-minting install path
     fetches those itself and won't trust a data: URI manifest -- that's
     the artifact target's approach instead, see personal_cfo_app_final.html,
     because none of this can work inside the sandboxed claude.ai Artifact
     iframe regardless of format: the browser only ever reads install
     metadata from the top-level page, never a nested iframe's).
     theme-color/manifest.json's background_color+theme_color were still
     #0a303e, the pre-Neon-Aurora navy -- stale since that reskin shipped,
     so the OS-generated splash screen (built from exactly those colors
     plus the icon) didn't match the app it was about to open into. Now
     #06060a, the current dark theme's actual base color. -->
<meta name="theme-color" content="#06060a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Personal CFO">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }
</script>

<style>:root{
  /* Light theme gets the same glass *family* (translucent surfaces, soft
     blur -- see the shared backdrop-filter rules below) calibrated down
     from Neon Aurora's dark-only glow: a faint aurora wash instead of
     saturated orbs, near-white glass instead of near-black, no glow filter
     (glass on white doesn't read as "neon," just hazy -- --glow-1 is empty
     here on purpose, see the nav-icon rules). --c-accent-fill keeps its
     original validated teal rather than picking up dark mode's new violet
     -- the two no longer have to match (see the note lower down, where
     this value is set, for why); each was checked against white button
     text independently. */
  --c-bg:
    radial-gradient(560px 420px at 4% -10%, rgba(139,92,246,.05), transparent 60%),
    radial-gradient(520px 400px at 100% 12%, rgba(34,211,238,.05), transparent 55%),
    #f3f2f2;
  --c-surface:rgba(255,255,255,.72); --c-surface-2:rgba(248,244,244,.72); --c-surface-3:rgba(234,231,231,.72);
  --glow-1:none;
  /* P1 fix: was #7d7979, which measures 3.55–3.94:1 on white/bg — fails
     WCAG AA (4.5:1) for the small caption/label text it's used on
     everywhere ("AVAILABLE", "I OWE", dates). #5a5656 keeps the same warm
     neutral hue but clears AA with margin (7.2:1 on white, 6.5:1 on bg). */
  --c-text:#201e1d; --c-text-soft:#605d5d; --c-text-faint:#5a5656;
  --c-line:color-mix(in srgb, #201e1d 14%, transparent);
  --c-accent:#0088b0; --c-accent-700:#006786; --c-accent-800:#004961;
  /* Fixed the same in every theme, on purpose -- see .hero-card below: it's
     always a dark glass panel with light text regardless of the page's own
     theme, same reasoning as the credit-card tile's own fixed-dark
     treatment. Was a solid navy; now translucent so the aurora wash shows
     through it in dark mode -- but only just: real bug caught in review at
     a lower alpha (.55), this composited over light mode's near-white
     --c-bg to a medium grey instead of staying dark, breaking the light-
     cream hero text's contrast. .92 keeps just enough translucency for the
     glass blur to register while staying dark under any --c-bg. */
  --c-accent-900:rgba(18,12,36,.92);
  /* P1 fix: solid-fill interactive elements (primary button, active nav,
     selected pill) use this instead of --c-accent directly — white text on
     #0088b0 measures 4.08:1 and fails AA for normal-size text; on #006786
     it's 6.4:1. Was fixed across both themes (same value, dark enough to
     hold up on either background) until the Neon Aurora pass gave dark its
     own violet #7c3aed here instead (white text on it is ~5.9:1, still
     clears AA) -- light keeps this original teal, unchanged and still
     independently valid on its own. See the note where dark redefines it
     for why the two are no longer required to match. */
  --c-accent-fill:#006786;
  /* --c-accent2-100/--c-neg-bg: were an opaque #fff1f4 (identical value,
     both this pale pink). Now translucent -- same visible tint composited
     over --c-bg, but real bug caught in review: .due-banner and .pos-tile
     (both use one of these as their own background, not --c-surface) sat
     in the shared backdrop-filter list below while opaque, so their blur
     had nothing translucent to blur -- pure wasted compositing, the exact
     per-element cost that list otherwise takes care to avoid. Translucent
     now, the blur actually does something, in light mode same as dark. */
  --c-accent2:#d6006c; --c-accent2-700:#aa0b56; --c-accent2-100:rgba(170,11,86,.07);
  --c-pos:#006786; --c-pos-bg:#e9f8ff; --c-neg:#aa0b56; --c-neg-bg:rgba(170,11,86,.07);
  /* New severity tier -- "this is coming due, not late yet" -- distinct
     from --c-neg ("this is actually overdue/over"). Approved from the
     Next Wave preview: the Needs Attention list and the credit-card
     statement badge (.cc-stmt, already gold-vs-red before this) both used
     to fold every non-neutral alert into the same red regardless of
     whether it was truly overdue or just a heads-up. Text-safe on its own
     (~4.9:1 on light --c-bg); the actual border/glow usage below is what
     it's really for. --glow-neg/-warn: empty in light, same reasoning as
     --glow-1 above -- these are box-shadow glows, not the drop-shadow
     filter --glow-1 is, so they get their own tokens rather than reusing
     it, but the "no glow on white glass" rule is identical. */
  --c-warn:#a15c00;
  --glow-neg:none; --glow-neg-strong:none; --glow-warn:none; --glow-pos:none;
  /* Categorical palette for category bars (Dashboard/Reports) and budget
     rows -- 8 fixed slots, assigned by CATEGORY_COLOR_ORDER (engine.js),
     never by amount/rank. UNCHANGED from before the Neon Aurora glass pass,
     and re-validated (dataviz-skill validator) against what these bars
     actually render over now -- --c-surface-3 (translucent, the glass
     pass) composited over --c-bg's own faint aurora tint, ~#ede9ea, not
     flat #ffffff: still all pass -- lightness band, chroma floor, worst
     adjacent CVD ΔE 9.1, worst adjacent normal-vision ΔE 19.6, same
     numbers as the original #ffffff validation (the light aurora wash is
     faint enough, 0.05 alpha, not to move them). Re-run the validator
     against the current --c-surface-3 composite before changing any of
     these 8 hex values or their order. */
  --cat-1:#2a78d6; --cat-2:#eb6834; --cat-3:#1baf7a; --cat-4:#eda100;
  --cat-5:#e87ba4; --cat-6:#008300; --cat-7:#4a3aa7; --cat-8:#e34948;
  --cat-neutral:#8f97a6;
  /* --font-head: headline numbers + real headings only (hero balance, stat
     tiles, card names/amounts, dialog/section/tab titles) -- kept serif on
     purpose, that's identity, not a legibility problem, and it reads fine
     at the sizes it's used at. --font-body: everything else -- labels,
     captions, list rows, buttons, table cells. Was Source Serif 4
     throughout; serif blurs at the 9-13px this runs at on a phone, so this
     is now a plain, high-legibility pairing instead (Latin falls through
     to Inter, Arabic to Noto Sans Arabic, same per-character fallback
     mechanism --font-head already relied on for its own Arabic step). */
  --font-head:'Source Serif 4', Georgia, 'Noto Serif Arabic', serif;
  --font-body:'Inter', 'Noto Sans Arabic', system-ui, sans-serif;
  --radius:10px; --shadow: 0 1px 2px rgba(32,30,29,.06), 0 6px 20px -10px rgba(32,30,29,.22);
}
/* ---- Neon Aurora (dark theme) ------------------------------------------
   Approved from the dashboard-style preview (Frosted Glass / Dimensional
   Steel / Neon Aurora) -- Neon Aurora picked, applied system-wide: every
   surface that already reads off --c-surface/--c-surface-2/--c-surface-3
   becomes translucent glass (see the new backdrop-filter rules below,
   applied once to the shared classes rather than per page), --c-bg carries
   the ambient violet/cyan/pink aurora wash every glass panel blurs, and
   --shadow gets a violet glow to match. --c-accent-900 (the hero card's
   old *solid* fill) is retired in favor of glass everywhere -- see
   .hero-card below, now translucent over this same aurora instead of a
   flat navy block. --glow-* are new: per-surface drop-shadow glow amounts,
   used by the vivid nav icons (.nav-ico, further down) -- the one place
   that reads it today; a future glowing accent badge can reuse the same
   token rather than inventing its own dark-only drop-shadow. */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --c-bg:
      radial-gradient(640px 480px at 6% -8%, rgba(139,92,246,.20), transparent 60%),
      radial-gradient(600px 460px at 104% 14%, rgba(34,211,238,.16), transparent 55%),
      radial-gradient(560px 480px at 12% 104%, rgba(244,114,182,.13), transparent 58%),
      #06060a;
    --c-surface:rgba(24,23,38,.6); --c-surface-2:rgba(32,31,50,.55); --c-surface-3:rgba(41,40,62,.55);
    --c-text:#f3f1fb; --c-text-soft:#bab6d6; --c-text-faint:#8f8bb0;
    --c-line:rgba(165,180,255,.22);
    --c-accent:#67e8f9; --c-accent-700:#a5f3fc; --c-accent-800:#cffafe; --c-accent-900:rgba(18,12,36,.92);
    --c-accent-fill:#7c3aed;
    --c-accent2:#f472b6; --c-accent2-700:#f9a8d4; --c-accent2-100:rgba(244,114,182,.16);
    --c-pos:#4ee9c2; --c-pos-bg:rgba(78,233,194,.14); --c-neg:#ff7fa1; --c-neg-bg:rgba(255,127,161,.14);
    --c-warn:#ffc86b;
    --glow-neg:0 0 0 1px rgba(255,127,161,.35),0 4px 16px -6px rgba(255,127,161,.5);
    --glow-neg-strong:0 0 0 1px rgba(255,127,161,.6),0 6px 22px -4px rgba(255,127,161,.75);
    --glow-warn:0 0 0 1px rgba(255,200,107,.3),0 4px 16px -6px rgba(255,200,107,.45);
    --glow-pos:0 0 0 1px rgba(78,233,194,.32),0 4px 16px -6px rgba(78,233,194,.45);
    /* Same 8 hues, UNCHANGED from the pre-glass palette -- re-validated
       (dataviz-skill validator) rather than assumed, against this surface's
       real composite (--c-surface-3 over the aurora --c-bg, ~#1f1a30):
       lightness band, chroma floor and contrast all still pass, worst
       adjacent CVD ΔE 8.4, worst adjacent normal-vision ΔE 19.3 -- all
       clear the same floor as the original #202324 validation. (A first
       attempt at "brighter, more neon" replacements failed the dark
       lightness band outright -- OKLCH L 0.69-0.77 against a 0.48-0.67
       ceiling -- so the original values turned out to already be correct
       for this surface too, not just close enough.) Re-run the validator
       against the current --c-surface-3 composite before changing any of
       these 8 values or their order. */
    --cat-1:#3987e5; --cat-2:#d95926; --cat-3:#199e70; --cat-4:#c98500;
    --cat-5:#d55181; --cat-6:#008300; --cat-7:#9085e9; --cat-8:#e66767;
    --cat-neutral:#7c8494;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 22px 46px -20px rgba(139,92,246,.4);
    --glow-1:drop-shadow(0 0 8px currentColor);
  }
}
:root[data-theme="dark"]{
  --c-bg:
    radial-gradient(640px 480px at 6% -8%, rgba(139,92,246,.20), transparent 60%),
    radial-gradient(600px 460px at 104% 14%, rgba(34,211,238,.16), transparent 55%),
    radial-gradient(560px 480px at 12% 104%, rgba(244,114,182,.13), transparent 58%),
    #06060a;
  --c-surface:rgba(24,23,38,.6); --c-surface-2:rgba(32,31,50,.55); --c-surface-3:rgba(41,40,62,.55);
  --c-text:#f3f1fb; --c-text-soft:#bab6d6; --c-text-faint:#8f8bb0;
  --c-line:rgba(165,180,255,.22);
  --c-accent:#67e8f9; --c-accent-700:#a5f3fc; --c-accent-800:#cffafe; --c-accent-900:rgba(18,12,36,.92);
  --cat-1:#3987e5; --cat-2:#d95926; --cat-3:#199e70; --cat-4:#c98500;
  --cat-5:#d55181; --cat-6:#008300; --cat-7:#9085e9; --cat-8:#e66767;
  --cat-neutral:#7c8494;
  --c-accent-fill:#7c3aed;
  --c-accent2:#f472b6; --c-accent2-700:#f9a8d4; --c-accent2-100:rgba(244,114,182,.16);
  --c-pos:#4ee9c2; --c-pos-bg:rgba(78,233,194,.14); --c-neg:#ff7fa1; --c-neg-bg:rgba(255,127,161,.14);
  --c-warn:#ffc86b;
  --glow-neg:0 0 0 1px rgba(255,127,161,.35),0 4px 16px -6px rgba(255,127,161,.5);
  --glow-neg-strong:0 0 0 1px rgba(255,127,161,.6),0 6px 22px -4px rgba(255,127,161,.75);
  --glow-warn:0 0 0 1px rgba(255,200,107,.3),0 4px 16px -6px rgba(255,200,107,.45);
  --glow-pos:0 0 0 1px rgba(78,233,194,.32),0 4px 16px -6px rgba(78,233,194,.45);
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 22px 46px -20px rgba(139,92,246,.4);
  --glow-1:drop-shadow(0 0 8px currentColor);
}

*{box-sizing:border-box}
body{margin:0;background:var(--c-bg);color:var(--c-text);font-family:var(--font-body)}
/* #root sits directly inside body and covers it edge to edge (min-height:
   100vh) -- while --c-bg was a flat color, painting it again here was
   effectively free; now that it's a 2-3 layer radial-gradient stack (the
   Neon Aurora aurora wash), that's real duplicated gradient compute for a
   layer nothing ever shows through to see. body's own paint stays (an iOS
   overscroll-bounce can reveal it past #root's edge), just not repeated
   here. */
#root{font-family:var(--font-body);color:var(--c-text);min-height:100vh}
.shell{display:flex;flex-direction:column;min-height:100vh;padding-bottom:70px}
.main-col{flex:1;min-width:0}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-head);font-weight:600;margin:0;text-wrap:balance}
.muted{color:var(--c-text-soft)}
/* Approved from the Shape Showcase preview -- was a single <p class=muted>
   line, same weight whether it meant "nothing to worry about" or "you
   haven't set this up yet" (see UI.emptyState). Dashed border reads as
   "optional/not-yet-filled" rather than a real content card, same
   language the card customizer's own optional fields already lean on. */
.empty-state{text-align:center;padding:26px 20px;border-radius:14px;border:1.5px dashed var(--c-line);background:var(--c-surface)}
.empty-glyph{width:40px;height:40px;margin:0 auto 10px;border-radius:11px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--c-accent-fill) 16%,transparent);color:var(--c-accent-fill)}
.empty-title{font-family:var(--font-head);font-size:15px;margin-bottom:3px}
.empty-body{font-size:13px;color:var(--c-text-soft)}
.small{font-size:14px}
.tone-pos{color:var(--c-pos)}
.tone-neg{color:var(--c-neg)}
.tone-neu{color:var(--c-text)}
.muted-amt{color:var(--c-text-faint)}
:focus-visible{outline:2px solid var(--c-accent);outline-offset:2px}

/* ---- glass ---------------------------------------------------------------
   One shared blur rule for every panel-sized surface built on --c-surface/
   --c-surface-2/--c-surface-3 (all translucent now, in both themes -- see
   the token blocks up top) -- this is what actually turns "translucent"
   into "glass": blurring whatever sits behind each panel (the aurora wash
   in dark mode, the page underneath in light) instead of just showing a
   flat tint. One rule, not repeated per class, so a future surface-using
   class joins the same treatment by joining this selector list.
   Two kinds of surface are deliberately left out of it, not by oversight:
   1) Anything that can render in real quantity -- .pill/.tag/tag-chips,
      .card-row (Transactions renders up to txVisible, 25, growing every
      "Load more" click and never shrinking back down -- a long session's
      list can genuinely reach the hundreds), and .btn/.btn-secondary
      (small, and frequently several per screen in a btn-row). Backdrop-
      filter on that many elements is real compositing cost for no visible
      gain over the translucent tint they already get from --c-surface-2
      alone.
   2) Anything that only ever renders INSIDE a surface this list already
      blurs -- .input inside .dialog, .sheet-item inside .sheet, .metric-
      tile inside .metrics-row, .seg inside .topbar (which blurs itself
      directly, just below). Real bug caught in review: an earlier pass
      blurred both the container and its own children, so the child's
      backdrop-filter was re-blurring an already-blurred surface -- a
      second compositing layer with no additional visible effect, pure
      GPU cost. The outer surface's blur already covers everything drawn
      on top of it.
   .primary-nav and .metrics-row get a lighter blur(8px) below, not this
   rule's 16px -- both are sticky/fixed full-width bars that repaint on
   every scroll tick (flagged in review as the two most likely to cost
   real scroll-jank on lower-end mobile at the heavier radius), same
   intensity .topbar already uses for the identical reason. */
.pos-tile, .stat-box, .dialog, .sheet,
.lock-card, .alert-card,
.due-banner{
  backdrop-filter:blur(16px) saturate(140%);
  -webkit-backdrop-filter:blur(16px) saturate(140%);
}
.primary-nav, .metrics-row{
  backdrop-filter:blur(8px) saturate(140%);
  -webkit-backdrop-filter:blur(8px) saturate(140%);
}

/* ---- topbar ---- */
/* Was color-mix(in srgb, var(--c-bg) 90%, transparent) -- valid only while
   --c-bg was a plain color. --c-bg is now a background-image list (the
   aurora gradients), which color-mix() can't take a <color> from, so this
   uses --c-surface directly instead -- already the right translucent glass
   tint, and consistent with every other blurred panel. */
.topbar{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--c-line);
  position:sticky;top:0;z-index:30;background:var(--c-surface);backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px}
.brand-mark{width:30px;height:30px;border-radius:999px;background:var(--c-accent-fill);color:#fff;
  display:grid;place-items:center;font-family:var(--font-head);font-size:15px;flex:none}
.brand-name{font-family:var(--font-head);font-size:16.5px;line-height:1.1}
.brand-sub{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--c-text-faint)}
.topbar-tools{display:flex;align-items:center;gap:8px;margin-inline-start:auto;flex-wrap:wrap}

.seg{display:flex;border:1px solid var(--c-line);border-radius:999px;padding:2px;background:var(--c-surface-2)}
.seg-opt{position:relative;padding:5px 14px;border-radius:999px;font-size:13.5px;cursor:pointer;display:flex;align-items:center;min-height:44px;min-width:44px;justify-content:center}
.seg-opt input{position:absolute;opacity:0}
/* Same bevel language as .btn-primary's Deep Press, lighter touch -- just
   the inset highlight/shade, no drop shadow or gradient -- since these are
   small, sometimes-repeated controls (a period toggle, a filter pill), not
   the one big CTA, same "smaller control gets the lighter version" split
   the chart bars draw between .chart-bar and .bar-fill. */
.seg-opt:has(input:checked), .pill.on{
  box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 -4px 8px -3px rgba(0,0,0,.35) inset}
.seg-opt:has(input:checked){background:var(--c-accent-fill);color:#fff}

.btn{border:1px solid var(--c-line);border-radius:999px;padding:8px 15px;background:var(--c-surface-2);
  cursor:pointer;font-size:14.5px;min-height:44px;white-space:nowrap}
.btn.small{min-height:44px;padding:7px 13px;font-size:14px}
.btn.block{width:100%;margin-top:10px}
/* "Deep Press" -- approved from the Next Wave preview, same bevel language
   as the credit-card tiles' Holo Shine (bright top inset, dark bottom
   inset) so the app's one truly solid-fill, most-tapped control (+ Expense,
   every dialog's Save, Pay/Collect, Unlock -- all share .btn-primary) reads
   as a raised, pressable object instead of a flat tinted rectangle. The
   outer drop shadow is un-gated by theme (present, just softer, in light
   too) -- it's a plain shadow, not a colored glow, same "shadow exists
   everywhere, glow is dark-only" split as --shadow vs --glow-1 elsewhere.
   :active flattens the bevel and nudges the button down 1px -- the actual
   "being pressed" feedback, not just decoration. */
.btn-primary{background:linear-gradient(180deg,color-mix(in srgb,var(--c-accent-fill) 88%,white 12%),var(--c-accent-fill));
  border-color:var(--c-accent-fill);color:#fff;font-weight:600;
  box-shadow:0 1px 0 rgba(255,255,255,.45) inset,0 -5px 10px -4px rgba(0,0,0,.4) inset,
    0 8px 18px -9px color-mix(in srgb,var(--c-accent-fill) 65%,transparent)}
.btn-primary:active{transform:translateY(1px);
  box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 -2px 6px -3px rgba(0,0,0,.35) inset}
.btn-secondary{background:var(--c-surface-2)}
.btn-ghost{background:transparent}
.btn-danger{background:var(--c-neg-bg);border-color:var(--c-neg);color:var(--c-neg)}
.btn-row{display:flex;gap:8px}
.btn-row.wrap{flex-wrap:wrap}
.link-btn{background:none;border:0;color:var(--c-accent-700);cursor:pointer;padding:12px 0;font-size:14.5px;min-height:44px;display:inline-flex;align-items:center}
.link-btn:disabled{color:var(--c-text-faint);cursor:default}
/* Every Delete action in this app goes through the browser's own native
   confirm() -- that dialog is chrome the OS renders, entirely outside this
   page's DOM/CSS, so it can't be given a "danger" look no matter what's
   tried here. This styles the trigger instead: a Delete link-btn reads red
   at rest and gets a warning glow on hover/focus, so the "this is
   destructive" cue lands before the (unstyleable) confirm prompt even
   opens, rather than only after. */
.link-btn.danger{color:var(--c-neg)}
.link-btn.danger:hover, .link-btn.danger:focus-visible{box-shadow:var(--glow-neg);border-radius:6px}

/* ---- metrics row (single instance, header context) ---- */
.metrics-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding:10px 16px;background:var(--c-surface-2);border-bottom:1px solid var(--c-line)}
.metric-tile{padding:7px 9px;border-radius:8px;background:var(--c-surface)}
.metric-label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--c-text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric-value{font-family:var(--font-head);font-size:16px;margin-top:1px;font-variant-numeric:tabular-nums}
@media (max-width:640px){
  .metrics-row{grid-template-columns:repeat(3,minmax(0,1fr))}
  .metric-tile:nth-child(4),.metric-tile:nth-child(5){display:none}
}

/* ---- page / tab header ---- */
.page{padding:18px 16px 90px;max-width:960px;margin:0 auto}
.tab-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.tab-title{font-size:24px}
.tab-sub{font-size:14px;color:var(--c-text-faint);margin-top:2px}
.section-title{font-size:18px;margin:22px 0 10px}
.section-title:first-child{margin-top:0}
.section-head{display:flex;justify-content:space-between;align-items:baseline}
.dash-section{margin-bottom:6px}

/* amount strings: <bdi dir="ltr"> already forces LTR run order (the actual
   P1 fix); this class just keeps them tidy inline and tabular. */
.amt-bidi{unicode-bidi:isolate;font-variant-numeric:tabular-nums}

.due-banner{background:var(--c-neg-bg);border:1px solid var(--c-line);border-radius:10px;padding:14px 16px;margin-bottom:18px}

/* ---- hero ---- */
/* Always a dark glass panel with light text, whatever theme the rest of the
   page is in (--c-accent-900 is the same fixed translucent value in every
   theme block -- see its definition up top) -- same "fixed regardless of
   theme" reasoning the credit-card tile already used, just glass now
   instead of a flat navy fill, so the page's own aurora wash shows through
   it blurred. */
.hero-card{background:var(--c-accent-900);color:#f5efe8;border-radius:var(--radius);padding:22px 22px 20px;
  box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%)}
/* "You can spend today" -- its own tinted banner inside the hero card, same
   technique as the credit-card tile's .cc-stmt badge: fixed colors, not the
   theme's --c-pos/--c-neg, so it reads reliably against this card's always-
   dark background (--c-accent-900 is the same value in every theme block).
   Mint while there's room; a warning amber once today's own obligations
   would already eat into what's on hand (spendToday < 0). */
.spend-today{margin-top:14px;padding:10px 14px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:rgba(112,224,180,.16);border:1px solid rgba(112,224,180,.4)}
.spend-today.tight{background:rgba(255,166,110,.2);border-color:rgba(255,166,110,.5)}
.spend-today-label{font-size:13px}
.spend-today-value{font-family:var(--font-head);font-size:20px;font-weight:600;white-space:nowrap}

/* ---- credit card tile ---- */
/* No bank logos/wordmarks drawn here (trademarked) — just the account's
   own color (and, for the 3 non-default patterns, a second color) in a
   card-shaped layout -- see UI.cardBackground(). Picking your bank's
   color in Edit is what makes it "look like" the real card.
   "Holo Shine" -- the approved depth treatment from the card-tile preview:
   a bright top / dark bottom bevel (the box-shadow stack) makes the card
   read as a thick, embossed object rather than a flat rectangle, and a
   slow iridescent sheen sweeps across it like a real card's security
   strip. color is no longer hardcoded #fff -- UI.cardTextColor(a) sets it
   per account (inline style, same place background is set), so .cc-name/
   .link-btn below inherit it instead of forcing white regardless. */
/* Flip (approved from the "same approach" list): .credit-card-tile is now
   just the perspective container/grid item -- it carries no background,
   border or shadow of its own any more, all of that moved to .cc-face
   (both front and back need their own independent copy, since either can
   be the one actually facing the viewer). .cc-flip is the element that
   actually rotates; .cc-face-front stays in normal flow (position:
   relative) so its natural content height sizes the whole tile, same as
   before this existed -- .cc-face-back is position:absolute;inset:0 over
   it, sized by the front's box rather than its own (shorter) content, so
   flipping never changes the tile's height mid-animation. */
.credit-card-tile{perspective:1400px}
.cc-flip{position:relative;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,.2,.2,1)}
.cc-flip.flipped{transform:rotateY(180deg)}
@media (prefers-reduced-motion: reduce){ .cc-flip{transition:none} }
/* position:relative -- without an explicit position, the front face (only
   .cc-face-back sets one, to position:absolute) is static, so its own
   ::after (the holo-sweep sheen, position:absolute) skips straight past
   it to .cc-flip as its containing block instead -- which has no
   border-radius/overflow of its own, letting the sheen's sharp corners
   paint outside the card's actual rounded corners. This makes ::after
   contained and clipped by the face's own rounded box on both faces
   (.cc-face-back's own position:absolute below still wins for it, same
   specificity but declared later in the cascade). */
.cc-face{position:relative;border-radius:16px;padding:18px 18px 14px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border:1.5px solid rgba(255,255,255,.28);
  box-shadow:
    0 1.5px 0 rgba(255,255,255,.4) inset,
    0 -10px 18px -6px rgba(0,0,0,.5) inset,
    0 16px 34px -14px rgba(0,0,0,.6)}
.cc-face-back{position:absolute;inset:0;transform:rotateY(180deg);display:flex;flex-direction:column}
.cc-face::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(100deg, transparent 30%, rgba(255,255,255,.35) 46%, rgba(180,220,255,.25) 50%, rgba(255,200,240,.22) 54%, transparent 68%);
  mix-blend-mode:overlay;animation:holoSweep 5s ease-in-out infinite}
@keyframes holoSweep{ 0%,100%{transform:translateX(-18%)} 50%{transform:translateX(18%)} }
@media (prefers-reduced-motion: reduce){ .cc-face::after{animation:none} }
.cc-flip-btn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:999px;
  width:28px;height:28px;display:grid;place-items:center;color:inherit;cursor:pointer;flex:none}
.cc-back-title{font-family:var(--font-head);font-size:14.5px}
.cc-back-list{display:flex;flex-direction:column;gap:8px;flex:1;overflow-y:auto;margin-top:10px}
.cc-back-row{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.cc-back-row-sub{opacity:.75;font-size:11.5px;margin-top:1px}
.cc-back-empty{font-size:13px;opacity:.75}
.cc-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cc-bank{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.cc-chip{width:30px;height:22px;border-radius:5px;background:linear-gradient(155deg,#fff4d6,#d9b658 45%,#8f6f2e);
  box-shadow:0 1px 0 rgba(255,255,255,.6) inset}
/* Balance-type tiles (wallet/cash/electronic card) get a plain translucent
   mark instead of the chip — a chip specifically reads as "real EMV card",
   which none of these are. */
.cc-mark{width:22px;height:22px;border-radius:999px;background:rgba(255,255,255,.28);border:1.5px solid rgba(255,255,255,.5)}
.balance-tile .cc-row{margin-top:18px}
.cc-name{display:block;font-family:var(--font-head);font-size:18px;color:inherit;margin-top:14px;padding:0 !important;min-height:0 !important}
.cc-row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:16px}
.cc-label{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.cc-amt{font-family:var(--font-head);font-size:21px;margin-top:2px}
.cc-sub{font-size:14.5px;margin-top:2px}
/* A statement due, right on the card face -- its own tinted badge instead
   of another plain cc-row, so it reads as something to act on instead of
   blending into Outstanding/Available/Limit. Gold echoes the card's own
   chip color (a real card's statement is due soon, not urgent yet); red
   takes over once it's actually overdue. Both colors are fixed regardless
   of the card's own chosen color, so they stay legible against any of them. */
/* Approved from the Next Wave preview: the gold/red split above already
   existed, this just adds the same glow language the cards/buttons got --
   a static amber glow while it's still just "due soon", a red glow that
   gently pulses once it's actually overdue (pulse is the one difference
   from the plain glow -- reserved for genuinely late, not every badge).
   --glow-warn/--glow-neg are empty in light (see where they're defined),
   so this is a dark-mode-only addition, same as the rest of the glow
   family -- the gold/red background above already carries the badge in
   light regardless. */
.cc-stmt{margin-top:10px;padding:7px 10px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;
  background:rgba(233,211,138,.22);border:1px solid rgba(233,211,138,.45);box-shadow:var(--glow-warn)}
.cc-stmt.overdue{background:rgba(255,110,110,.22);border-color:rgba(255,130,130,.5);
  box-shadow:var(--glow-neg);animation:pulseGlowNeg 2.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){ .cc-stmt.overdue{animation:none} }
.cc-stmt .cc-label{opacity:.9}
.cc-stmt-amt{font-weight:700;font-size:14.5px;white-space:nowrap}
.credit-card-tile .link-btn{color:inherit;opacity:.85}
.credit-card-tile .link-btn:hover{opacity:1}

/* ---- app lock screen ---- */
.lock-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--c-bg)}
.lock-card{width:100%;max-width:320px;text-align:center;background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--radius);box-shadow:var(--shadow);padding:32px 24px}
/* Was just colored text -- everything else on this screen already picked
   up the system automatically (.lock-card was already in the shared
   backdrop-filter list from the original Neon Aurora pass, so the aurora
   wash already shows through it; .btn-primary already has Deep Press;
   .lock-input already gets the new focus ring, same as any other
   .input). A real badge now, same shape/bevel language as .brand-mark
   (the small topbar version of this) scaled up, not just recolored text. */
.lock-mark{width:56px;height:56px;margin:0 auto 14px;border-radius:16px;display:grid;place-items:center;
  font-family:var(--font-head);font-size:24px;color:#fff;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c-accent-fill) 88%,white 12%),var(--c-accent-fill));
  box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 -6px 12px -4px rgba(0,0,0,.4) inset,
    0 10px 22px -12px color-mix(in srgb,var(--c-accent-fill) 60%,transparent)}
.lock-title{font-family:var(--font-head);font-size:22px;margin:0 0 2px}
.lock-input{text-align:center;font-size:24px;letter-spacing:10px;margin-top:14px}
.hero-card.alt{background:var(--c-surface);color:var(--c-text);border:1px solid var(--c-line)}
.hero-label{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.hero-value{font-family:var(--font-head);font-size:clamp(38px,10vw,52px);line-height:1.05;letter-spacing:-.01em;margin-top:4px;font-variant-numeric:tabular-nums}
.hero-note{font-size:13.5px;opacity:.75;max-width:44ch;margin-top:6px}
.hero-sub-row{display:flex;gap:22px;margin-top:14px;padding-top:12px;border-top:1px solid color-mix(in srgb, currentColor 20%, transparent);flex-wrap:wrap}
.hero-sub-label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.65}
.hero-sub-value{font-family:var(--font-head);font-size:21px;margin-top:2px;font-variant-numeric:tabular-nums}
.sparkline{vertical-align:middle;margin-inline-start:6px;opacity:.85}
/* Wraps the sparkline so it's tappable to expand the full trend below --
   reset to plain inline content, no button chrome, since it must sit
   inline with the net worth figure exactly like the bare <svg> used to. */
.spark-trigger{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer;vertical-align:middle}
/* Collapsed by default -- UI.toggleNwTrend() adds/removes .show. Pre-rendered
   every Dashboard render (see renderDashboard()), so this is pure CSS, no
   JS-driven height measurement needed. */
.nw-trend-expand{display:none}
.nw-trend-expand.show{display:block}

/* ---- alerts (needs attention) ---- */
.alert-list{display:flex;flex-direction:column;gap:8px}
/* Every Needs Attention card used to get the same red left border
   regardless of what it actually was -- a genuinely overdue payment read
   identically to a 90%-of-budget nudge or a "here's your largest
   receivable" FYI. Each alert pushed in UI.renderDashboard() now carries
   its own sev: "neg" (already late/over -- pulses, see pulseGlowNeg), "warn"
   (heads-up before it's late/over) or "info" (not urgency at all, e.g.
   "largest open receivable"), rendered as a sev-{X} class this picks the
   border/glow from; the base rule below is the info look, so an untagged
   sev still renders as a plain card instead of alarming red by default. */
.alert-card{background:var(--c-surface);border:1px solid var(--c-line);border-inline-start:3px solid var(--c-line);border-radius:8px;padding:12px 14px}
.alert-card.sev-neg{border-inline-start-color:var(--c-neg);box-shadow:var(--glow-neg);animation:pulseGlowNeg 2.6s ease-in-out infinite}
.alert-card.sev-warn{border-inline-start-color:var(--c-warn);box-shadow:var(--glow-warn)}
@media (prefers-reduced-motion: reduce){ .alert-card.sev-neg{animation:none} }
@keyframes pulseGlowNeg{0%,100%{box-shadow:var(--glow-neg)}50%{box-shadow:var(--glow-neg-strong)}}
.alert-title{font-weight:600;font-size:15px}
.alert-body{font-size:14px;color:var(--c-text-soft);margin-top:2px}
.alert-cta{margin-top:6px;background:none;border:0;color:var(--c-accent-700);font-size:14px;font-weight:600;cursor:pointer;padding:0;min-height:44px;display:inline-flex;align-items:center}

/* ---- tiles / stats ---- */
.tile-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile-grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:560px){ .tile-grid.four{grid-template-columns:repeat(2,minmax(0,1fr))} }
.pos-tile{padding:10px 11px;border-radius:8px;background:var(--c-surface)}
.pos-tile.alt{background:var(--c-accent2-100)}
.pos-label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--c-text-faint);min-height:22px;line-height:1.25}
.pos-value{font-family:var(--font-head);font-size:19px;margin-top:2px;font-variant-numeric:tabular-nums}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat-box{padding:12px;border-radius:8px;background:var(--c-surface)}

/* ---- bars ---- */
.bar-list{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:96px 1fr auto;gap:9px;align-items:center;font-size:14.5px}
button.bar-row{width:100%;border:0;background:none;padding:6px 0;min-height:44px;font:inherit;text-align:inherit;cursor:pointer;color:inherit;font-family:inherit}
.bar-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--c-text-soft)}
.bar-track{height:7px;border-radius:999px;background:var(--c-surface-3);overflow:hidden}
.bar-track.thin{height:5px;margin-top:8px}
/* Every .bar-fill's actual color is set inline (category hex, an
   account's own chosen color, pos/neg) so this can't hue-match a glow the
   way barChart()'s color-mix() trick does without touching every one of
   the several call sites that set it -- an inset top-edge sheen instead,
   same "glossy" language, works identically regardless of the color
   underneath and needs no per-caller change. */
.bar-fill{height:100%;border-radius:999px;background:var(--c-accent);box-shadow:0 1px 0 rgba(255,255,255,.4) inset}
.bar-fill.neg-fill{background:var(--c-neg)}
.bar-fill.pos-fill{background:var(--c-pos)}
.bar-fill.warn-fill{background:var(--c-warn)}
.bar-val{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13.5px}

/* Overall monthly expense budget (Settings) -- one cap across every
   expense, shown right in "This month" next to the per-category bars
   below it. Plain by default; .near/.over add the same severity-glow
   language (border + box-shadow token) the Needs Attention alerts and
   .cc-stmt already use, so a user who's about to blow their whole
   month's budget gets the same visual weight as any other real alert. */
.overall-budget{margin:14px 0 4px;padding:10px 12px;border-radius:10px;border:1px solid var(--c-line)}
.overall-budget-row{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:8px;font-variant-numeric:tabular-nums}
.overall-budget.near{border-color:var(--c-warn);box-shadow:var(--glow-warn)}
.overall-budget.over{border-color:var(--c-neg);box-shadow:var(--glow-neg)}
.overall-budget-proj{margin-top:8px;font-size:12.5px;color:var(--c-text-faint)}
.overall-budget-proj.warn{color:var(--c-warn)}

/* ---- events ---- */
.event-list{display:flex;flex-direction:column;gap:2px}
.event-row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--c-line);font-size:14.5px}
.event-dot{width:7px;height:7px;border-radius:999px;flex:none}
.event-dot.pos{background:var(--c-pos)}
.event-dot.neg{background:var(--c-neg)}
.event-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.event-when{color:var(--c-text-faint);font-size:13px;white-space:nowrap}
.event-amt{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;white-space:nowrap}

/* ---- filters ---- */
.filter-row{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:8px;margin-bottom:14px}
@media (max-width:640px){ .filter-row{grid-template-columns:1fr 1fr} }
.input{border:1px solid var(--c-line);border-radius:8px;padding:9px 11px;background:var(--c-surface);min-height:44px;width:100%}
/* Every .input (text/number/date/select) relied on the browser's own
   default focus ring -- functional, but the one interactive state in the
   whole system with no piece of this design language on it at all. Not
   gated to dark: a focus ring is an accessibility signal, not a
   decorative glow, so it stays identically legible in both themes,
   same distinction --shadow (universal) vs --glow-* (dark-only) already
   draws elsewhere. :focus-visible so a plain mouse click into a field
   doesn't ring it any more insistently than the browser default already
   would -- keyboard/programmatic focus is what this is really for. */
.input:focus-visible{outline:none;border-color:var(--c-accent-fill);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--c-accent-fill) 22%,transparent)}

/* ---- tables (desktop) / cards (mobile) — fix #2 ---- */
.desktop-only{display:block}
.mobile-only{display:none}
@media (max-width:780px){
  .desktop-only{display:none}
  .mobile-only{display:block}
}
.table-wrap{overflow-x:auto;border:1px solid var(--c-line);border-radius:var(--radius)}
/* Every scrollable container (the desktop table, the category pill row,
   dialogs and the More sheet once their content outgrows max-height)
   still drew the OS's own default scrollbar -- the one piece of chrome
   left that never picked up --c-line. Thin and line-colored in both
   engines; a scrollbar is UI chrome, not a glow candidate, so this is
   unconditional like the focus ring above, not gated to dark. */
.table-wrap, .cat-pill-row, .dialog, .sheet{scrollbar-width:thin;scrollbar-color:var(--c-line) transparent}
.table-wrap::-webkit-scrollbar, .cat-pill-row::-webkit-scrollbar, .dialog::-webkit-scrollbar, .sheet::-webkit-scrollbar{width:8px;height:8px}
.table-wrap::-webkit-scrollbar-track, .cat-pill-row::-webkit-scrollbar-track, .dialog::-webkit-scrollbar-track, .sheet::-webkit-scrollbar-track{background:transparent}
.table-wrap::-webkit-scrollbar-thumb, .cat-pill-row::-webkit-scrollbar-thumb, .dialog::-webkit-scrollbar-thumb, .sheet::-webkit-scrollbar-thumb{background:var(--c-line);border-radius:999px}
.table{width:100%;border-collapse:collapse;font-size:14.5px}
.table th{text-align:start;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--c-text-faint);padding:10px 12px;border-bottom:1px solid var(--c-line);white-space:nowrap}
.table td{padding:9px 12px;border-bottom:1px solid var(--c-line);white-space:nowrap}
.table td.num, .table th.num{text-align:end;font-variant-numeric:tabular-nums;font-weight:600}
.tag{display:inline-flex;font-size:11.5px;padding:2px 9px;border-radius:999px}
.tag-pos{background:var(--c-pos-bg);color:var(--c-pos)}
.tag-neg{background:var(--c-neg-bg);color:var(--c-neg)}
.tag-neu{background:var(--c-surface-3);color:var(--c-text-soft)}

.card-list{display:flex;flex-direction:column;gap:8px}
.card-row{border:1px solid var(--c-line);border-radius:10px;padding:12px 14px;background:var(--c-surface)}
.card-row.voided{opacity:.5}
.card-row-top{display:flex;align-items:flex-start;gap:10px}
.card-row-top>div:first-child{flex:1;min-width:0}
.card-row-title{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis}
.card-row-sub{font-size:13px;color:var(--c-text-faint);margin-top:1px}
.card-row-amt{font-variant-numeric:tabular-nums;font-weight:600;font-size:16.5px;white-space:nowrap}
.card-row-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;color:var(--c-text-soft);margin-top:8px}
.acc-swatch{width:11px;height:11px;border-radius:999px;flex:none;margin-top:3px}
.acc-sub{font-size:13px;color:var(--c-text-faint);margin-top:6px}
/* Person avatar/color — same idea as an account's color+card-face swatch,
   just a circle with an initial instead of a card gradient (a person isn't
   a physical card). .person-id wraps the avatar + name/sub as a single
   flex unit so it still lands as .card-row-top's first (flex:1) child. */
.person-id{display:flex;align-items:center;gap:10px;min-width:0}
/* Same bevel language as the card tiles' Holo Shine, lighter touch (no
   backdrop-filter/animated sheen -- a People list can run to dozens of
   rows, same "small/repeated element gets the light version" split
   .bar-fill draws against .chart-bar). color:#fff dropped in favor of
   inherit -- personAvatar() now always sets a real per-person inline
   color (cardTextColor()), which wins over either value regardless
   (inline beats an external rule with no !important either way), but
   inherit here is honest about the fact that this class no longer picks
   the color at all, instead of leaving a value that reads as live but
   is actually always overridden. */

// Logic is preserved as-is; only the class wrapper and I/O layer are new.

      data: null, txVisible: 25, moreOpen: false, arabicNumerals: false, personDetailId: null, whatIf: [], payoffOrder: "largest",

    try { return !!localStorage.getItem("pcfo.pinhash.v1"); } catch (e) { return false; }
  }

  // e.g. the app served over plain, non-localhost HTTP, which isn't a

  async hashPin(pin) {

  deleteTx(id) {
    const data = JSON.parse(JSON.stringify(this.state.data));
    const t = data.tx.find(x => x.id === id);
    if (!this.txEditable(t)) return;
    data.tx = data.tx.filter(x => x.id !== id);
    this.persist(data, "Deleted " + (t.desc || t.type) + " " + this.fmt(t.amount || 0));
  }
  postRecurring(r) {
    const data = JSON.parse(JSON.stringify(this.state.data));
    data.tx.push({ id: this.uid("t"), date: this.today(), type: r.type, amount: r.amount, accountId: r.accountId, category: r.category, personId: null, desc: r.name + " (recurring)", void: false, created: new Date().toISOString(), recurringId: r.id });
    this.persist(data, "Posted recurring " + r.name);
  }
}

if (typeof module !== "undefined") module.exports = { Engine };

<script>/* Personal CFO — presentation layer (rebuilt).
   Fixes the 5 agreed P0 mobile issues only:
   1) primary nav (5 fixed tabs) + a "More" sheet, instead of a 12-item
      horizontally-scrolling strip with no affordance
   2) responsive card rows instead of a table with a second horizontal
      scrollbar, on every data-heavy tab
   3) no manifest/service-worker registration that silently fails
   4) Transactions is paginated (25 at a time) instead of rendering ~180
      rows into the DOM at once
   5) Dashboard shows the 5 headline numbers once, and "Needs attention"
      is promoted right under the hero instead of ~3 screens down
   Everything else (business logic, labels, even known P1 quirks like the
   Installments KPI only counting money owed *to* the user) is preserved
   as-is on purpose — those are separate, already-scoped follow-up items. */

function esc(s) {
  return String(s === undefined || s === null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function svgIcon(d, size) {
  size = size || 16;
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + d + '"></path></svg>';
}
// Curated preset swatches for every color field (account/card color, its
// secondary color, a person's avatar color) -- approved from the card
// customizer preview. Chosen to look good as a card face specifically
// (rich/saturated, not pastel), spread across the same aurora-adjacent
// hue family the rest of the Neon Aurora system already uses. Purely a
// shortcut in front of the plain native color input, which stays and
// still works exactly as before for any color outside this list.
// Three reused empty-state icon shapes (see UI.emptyState) -- not a
// bespoke icon per call site, so a future new empty state just picks
// whichever of these three actually describes it instead of inventing a
// fourth. CHECK: a genuinely good state, nothing to act on. PLUS: "add
// one to get started". SEARCH: "your filter/search matched nothing".
const ICON_CHECK = "M20 6 9 17l-5-5";
const ICON_PLUS = "M12 5v14M5 12h14";
const ICON_SEARCH = "M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM21 21l-4.3-4.3";

const COLOR_PALETTE = [
  "#0088b0", "#1d4ed8", "#2563eb", "#0ea5e9", "#0d9488", "#10b981", "#16a34a", "#65a30d",
  "#7c3aed", "#8b5cf6", "#a855f7", "#6d28d9", "#db2777", "#ec4899", "#be185d", "#e11d48",
  "#dc2626", "#f43f5e", "#d97706", "#f59e0b", "#ca8a04", "#334155", "#1e293b", "#475569"
];

const UI = {
  app: null,
  init(engine) {
    this.app = engine;
    this.app.load();
    this.app.state.locked = this.app.hasPin();
    window.addEventListener("resize", () => {});
    this.render();
    this.maybeNotify();
  },
  // One-shot, on open only (not on every render) — a foreground summary
  // notification of how many things need attention, gated on the user
  // having opted in from Settings and actually granted permission. Skipped
  // while locked; unlockC() calls this again once the PIN is entered.
  maybeNotify() {
    try {
      const app = this.app;
      if (app.state.locked || !app.notifEnabled() || !("Notification" in window) || Notification.permission !== "granted") return;
      const D = app.derive();
      const n = app.attentionCount(D);
      if (n > 0) new Notification(app.T[app.state.lang].brand, { body: n + " " + app.L("item(s) need attention.", "بند محتاج انتباه.") });
    } catch (e) {}
  },
  updateBadge(n) {
    try {
      if (!("setAppBadge" in navigator)) return;
      if (n > 0) navigator.setAppBadge(n); else navigator.clearAppBadge();
    } catch (e) {}
  },

  // ---- generic actions ---------------------------------------------------
  setPage(p) { this.app.state.page = p; this.app.state.moreOpen = false; this.app.state.txVisible = 25; this.render(); window.scrollTo({ top: 0 }); },
  // A person's own page: every loan and installment plan tied to them (both
  // directions) in one place, instead of scattered across Receivables &
  // Payables and Installments — the gap that made juggling several loans
  // with the same person (e.g. a normal loan plus money held in trust) hard
  // to see at a glance.
  viewPerson(id) { this.app.state.personDetailId = id; this.app.state.page = "person_detail"; this.app.state.moreOpen = false; this.render(); window.scrollTo({ top: 0 }); },
  // Tapping an account/card jumps straight to its own transactions —
  // Transactions' account filter already matches accountId, fromId and
  // toId (a transfer either side), so this is the same filter a person
  // could set by hand from the dropdown there, just one tap instead of two.
  viewAccountTx(id) { this.app.state.filt.account = id; this.setPage("transactions"); },
  // Same idea for a category/source bar (Dashboard's This month, Reports'
  // by-category and by-source breakdowns) — search already matches
  // category as one of the fields it checks (see renderTransactions), so
  // this reuses that instead of adding a dedicated category filter.
  viewCategoryTx(name) { this.app.state.filt.q = name; this.setPage("transactions"); },
  toggleMore() { this.app.state.moreOpen = !this.app.state.moreOpen; this.render(); },
  setLang(l) { this.app.state.lang = l; this.render(); },
  togglePrivacy() { this.app.state.privacy = !this.app.state.privacy; this.render(); },
  toggleArabicNumerals() { this.app.state.arabicNumerals = !this.app.state.arabicNumerals; this.render(); },
  setPayoffOrder(v) { this.app.state.payoffOrder = v; this.render(); },
  setPayoffCalc(field, v) { this.app.state.payoffCalc[field] = v; this.render(true); },
  // Picking a Relation resets Color to that type's default (the field's
  // hint says so) -- same "pick a default, override after" pattern as the
  // account color field, just wired live since relation/color live in the
  // same modal here (an account's type isn't editable after creation, so
  // it never needed this). Deliberately NOT a full render() -- like
  // suggestCategoryFromDesc, this modal's fields only sync into state.form
  // on submit (see submitModal's FormData read), so a render() here would
  // silently wipe out whatever the user already typed into Name/Phone/Notes
  // and hadn't submitted yet. Setting the color input's value directly
  // avoids that; submit() still picks it up correctly either way.
  setPersonRelation(v) {
    const rt = this.app.relationTypes().find(r => r.v === v);
    if (!rt) return;
    const el = document.getElementById("f_color");
    if (el) el.value = rt.color;
  },
  // A preset swatch button click -- same "set the real input's value
  // directly, no render()" reasoning as setPersonRelation just above, so
  // it can't wipe out unsaved text elsewhere in the same modal. fieldKey
  // is which color field the swatch belongs to (a modal with a secondary
  // color has two independent rows, each wired to its own input).
  setColorField(fieldKey, hex) {
    const el = document.getElementById("f_" + fieldKey);
    if (el) el.value = hex;
    if (fieldKey === "color") this.syncColor2Default(hex);
    else if (fieldKey === "color2") this._color2Touched = true;
  },
  // While color2 is still just the auto-darkened placeholder Engine.open()
  // invented (never a real choice -- see _color2Seeded there), keep it
  // tracking live edits to the primary Color field/swatches, so picking a
  // two-color pattern without ever touching Secondary color still pairs it
  // with a shade of whatever color ended up primary, not a stale one from
  // whatever the primary color was when the form first opened. The moment
  // the user touches color2 themselves (here or via its own swatches),
  // _color2Touched latches true and this stops overwriting their choice.
  syncColor2Default(hex) {
    if (this._color2Touched) return;
    const el = document.getElementById("f_color2");
    if (el) el.value = this.app.darkenHex(hex);
  },
  // A category pill click -- same direct-set, no-render() reasoning as
  // setColorField, so it can't wipe out unsaved text elsewhere in the
  // modal (an amount already typed in, a description mid-edit).
  setCategoryField(name) {
    const el = document.getElementById("f_category");
    if (el) el.value = name;
  },
  // Card flip -- direct DOM class toggle, no render(): a flip is a
  // transient view of the same tile, not a data change, so it doesn't
  // need to survive (or trigger) a re-render, same reasoning
  // setColorField/syncColor2Default already establish for this kind of
  // state elsewhere. #ccflip-<id> is unique to this specific tile.
  flipCardC(id) {
    const el = document.getElementById("ccflip-" + id);
    if (!el) return;
    // Recorded BEFORE toggling inert below: making the just-clicked
    // button's face inert force-blurs it straight to <body>, so this has
    // to be captured while it's still the real activeElement.
    const cameFromFlipBtn = el.contains(document.activeElement) && document.activeElement.classList.contains("cc-flip-btn");
    const flipped = el.classList.toggle("flipped");
    // Keep the face that's rotated out of view out of the tab order/a11y
    // tree too, not just visually hidden -- see the `inert` comment on
    // .cc-face-back's markup.
    const front = el.querySelector(".cc-face-front"), back = el.querySelector(".cc-face-back");
    if (front) front.toggleAttribute("inert", flipped);
    if (back) back.toggleAttribute("inert", !flipped);
    // Recent activity is built the first time a tile actually flips open,
    // not for every account on every render() -- see ccBackRowsHtml().
    if (flipped && back) {
      const list = back.querySelector(".cc-back-list");
      if (list && !list.innerHTML) list.innerHTML = this.ccBackRowsHtml(el.dataset.accId);
    }
    // Move focus on to the newly visible face's own flip button, so a
    // keyboard user's next Tab continues from there instead of from the
    // top of the page (where the forced blur above would otherwise leave
    // it). Gated on the flip button actually having had focus, not just
    // unconditional, so this can never steal focus from something
    // unrelated elsewhere on the page.
    if (cameFromFlipBtn) {
      const newFace = flipped ? back : front;
      const newBtn = newFace && newFace.querySelector(".cc-flip-btn");
      if (newBtn) newBtn.focus();
    }
  },
  // Chart bar tap -> a small floating tooltip. #chartTooltip lives outside
  // #root (same reasoning as #flashStack) so positioning it doesn't get
  // wiped by an unrelated render(); it's just simplest to reuse that
  // established pattern here too, even though a bar tap itself never
  // triggers a render(). Auto-hides itself; a second tap elsewhere (or a
  // real render(), e.g. switching tabs) also clears it via chartTooltipHideT.
  showChartTooltip(evt, text) {
    const el = document.getElementById("chartTooltip");
    if (!el) return;
    const bar = evt.currentTarget;
    const r = bar.getBoundingClientRect();
    el.textContent = text;
    el.classList.add("show");
    // Position centered above the tapped bar, clamped to the viewport so it
    // never clips off-screen for bars near the left/right edge. Also clamped
    // to never rise above the chart's own container (.chart-cols) -- a tall
    // bar's top can sit just a few px below the section heading above the
    // chart, which would otherwise put the tooltip right over that text;
    // pinning it to the container top instead means it overlaps at most the
    // chart's own bars, never unrelated content above the chart.
    el.style.left = "0px";
    el.style.top = "0px";
    const tw = el.offsetWidth, th = el.offsetHeight;
    let left = r.left + r.width / 2 - tw / 2;
    left = Math.max(8, Math.min(left, window.innerWidth - tw - 8));
    const container = bar.closest(".chart-cols");
    const containerTop = container ? container.getBoundingClientRect().top : r.top;
    const top = Math.max(8, containerTop + 2, r.top - th - 10);
    el.style.left = left + "px";
    el.style.top = top + "px";
    if (this._chartTooltipHideT) clearTimeout(this._chartTooltipHideT);
    this._chartTooltipHideT = setTimeout(() => el.classList.remove("show"), 2500);
    evt.stopPropagation();
  },
  // Net worth sparkline tap -> expand/collapse the full 6-month trend chart
  // inline. renderDashboard() leaves #nwTrendExpand empty; the 6-derive()
  // trend series (nwTrendMonths(), shared with Reports) is only actually
  // built the first time this expands, and injected straight in via
  // innerHTML -- no render() call, same direct-DOM reasoning as
  // flipCardC, just building real markup instead of toggling a class on
  // markup that was already there. Collapsing is a plain classList
  // toggle; a render() in between (e.g. a save while the panel is open)
  // resets #nwTrendExpand to empty/collapsed, so a re-expand after that
  // rebuilds it fresh rather than trusting stale cached HTML.
  toggleNwTrend(evt) {
    if (evt) evt.stopPropagation();
    const el = document.getElementById("nwTrendExpand");
    if (!el) return;
    if (!el.classList.contains("show") && !el.innerHTML) {
      const app = this.app, t = app.T[app.state.lang];
      el.innerHTML = '<h2 class="section-title">' + esc(t.netWorthTrend) + "</h2>" +
        this.barChart(this.nwTrendMonths(), (i) => i.value >= 0 ? "var(--c-pos)" : "var(--c-neg)");
    }

    if (evt && evt.currentTarget) evt.currentTarget.setAttribute("aria-expanded", nowShown ? "true" : "false");
  },
  // Reorder accounts -- swap one step up/down within their own visual
  // section (see Engine.moveAccount).
  moveAccountC(id, dir) { this.app.moveAccount(id, dir); this.render(); },
  openModal(kind, pre) {
    this.app.open(kind, pre);
    // A real saved color2 (not just our placeholder) must never be
    // silently overwritten by a later primary-color edit -- see
    // syncColor2Default -- so start "touched" whenever it wasn't freshly
    // seeded this open (including forms with no color2 field at all,
    // where _color2Seeded is undefined and this is simply inert).
    this._color2Touched = !this.app.state.form._color2Seeded;
    this.render();
  },
  closeModal() { this.app.state.modal = null; this.app.state.err = ""; this.render(); },
  submitModal() {
    const modalEl = document.getElementById("modalForm");
    if (modalEl) {
      const fd = new FormData(modalEl);

    this.render();
    if (ok) this.flash();
  },
  // #flashStack lives outside #root in the static page shell (see
  // index.html/personal_cfo_app_final.html), not inside anything render()
  // ever regenerates -- render() replaces #root's whole innerHTML on every
  // call, so a flash pill living inside that tree would vanish the instant
  // any other action re-rendered before its own 1.8s was up, which is the

  // Each pill manages its own lifecycle via its own setTimeout, so several
  // queued in a row (a quick run of edits/deletes) stack and fade
  // independently instead of one replacing the last.
  flash() {
    const stack = document.getElementById("flashStack");
    if (!stack) return;
    const pill = document.createElement("div");

    pill.setAttribute("role", "status");
    pill.setAttribute("aria-live", "polite");
    pill.innerHTML = svgIcon("M20 6 9 17l-5-5", 15) + esc(this.app.state.saved);
    stack.appendChild(pill);

      pill.classList.add("flash-pill-exit");

    }, 1800);
  },
  loadMoreTx() { this.app.state.txVisible += 25; this.render(true); },
  setFilter(k, v) { this.app.state.filt[k] = v; this.app.state.txVisible = 25; this.render(true); },
  reverseTx(id) { this.app.reverse(id); this.render(); },
  // Opens the same add-modal a plain entry was created from (income,
  // expense, transfer, a loan or a payment against it, an installment or a
  // gam3ya installment), pre-filled from the transaction itself — submit()
  // recognizes the carried-over `id` and updates that row in place instead
  // of posting a new one.
  openTxEdit(id) {
    const t = this.app.state.data.tx.find(x => x.id === id);
    if (!this.app.txEditable(t)) return;
    this.openModal(this.app.txEditKind(t), Object.assign({}, t));
  },
  addWhatIfC() {
    const app = this.app, title = document.getElementById("wiTitle").value;
    const amount = app.n(document.getElementById("wiAmount").value);
    const kind = document.getElementById("wiKind").value;
    const date = document.getElementById("wiDate").value;
    if (!amount) return;
    app.addWhatIf(title, kind === "expense" ? -Math.abs(amount) : Math.abs(amount), date);
    this.render();
  },
  removeWhatIf(id) { this.app.removeWhatIf(id); this.render(); },
  clearWhatIfC() { this.app.state.whatIf = []; this.render(); },
  suggestCategoryFromDesc(desc) {
    const app = this.app, kind = app.state.modal;
    const cat = app.suggestCategory(desc, kind);
    if (!cat) return;
    const sel = document.getElementById("f_category");
    if (!sel) return;

    // category itself — deleteCategory() has no in-use guard, unlike
    // deletePlan/deleteInvestment/deleteGroup. Setting a value with no
    // matching <option> would silently blank the field instead of leaving
    // the user's own selection alone.
    const stillExists = Array.prototype.some.call(sel.options, (o) => o.value === cat);
    if (stillExists && sel.value !== cat) sel.value = cat;
  },

  duplicateTxC(id) {
    const t = this.app.state.data.tx.find((x) => x.id === id);
    if (!this.app.txEditable(t)) return;

    this.openModal(this.app.txEditKind(t), pre);
  },
  deleteTxC(id) {
    const app = this.app, t = app.state.data.tx.find(x => x.id === id);
    if (app.txEditable(t) && confirm(app.L("Delete this transaction? This cannot be undone.", "مسح الحركة دي؟ الإجراء ده لا يمكن التراجع عنه."))) { app.deleteTx(id); this.render(); }
  },
  deleteAccountC(id) {
    const a = this.app.state.data.accounts.find(x => x.id === id); if (!a) return;
    if (this.app.accountCanDelete(id) && confirm(this.app.L("Delete ") + a.name + "?")) { this.app.deleteAccount(id); this.render(); }
  },
  deletePersonC(id) {
    if (!this.app.personHasRecords(id) && confirm(this.app.L("Delete ") + this.app.personName(id) + "?")) { this.app.deletePerson(id); this.render(); }
  },
  deletePlanC(id) {
    const plan = this.app.state.data.plans.find(p => p.id === id); if (!plan) return;
    if (this.app.planCanDelete(id) && confirm(this.app.L("Delete ") + plan.title + "?")) { this.app.deletePlan(id); this.render(); }
  },
  deleteInvestmentC(id) {
    const iv = this.app.state.data.investments.find(i => i.id === id); if (!iv) return;
    if (this.app.investmentCanDelete(id) && confirm(this.app.L("Delete ") + iv.name + "?")) { this.app.deleteInvestment(id); this.render(); }
  },
  deleteCardStatementC(id) {
    const s = (this.app.state.data.cardStatements || []).find(x => x.id === id); if (!s) return;
    if (this.app.cardStatementCanDelete(id) && confirm(this.app.L("Delete ") + (s.period || s.due || "") + "?")) { this.app.deleteCardStatement(id); this.render(); }
  },
  deleteGroupC(id) {
    const g = (this.app.state.data.groups || []).find(x => x.id === id); if (!g) return;
    if (this.app.groupCanDelete(id) && confirm(this.app.L("Delete ") + g.name + "?")) { this.app.deleteGroup(id); this.render(); }
  },
  deleteSavingsGoalC(id) {
    const g = (this.app.state.data.savingsGoals || []).find(x => x.id === id); if (!g) return;
    if (confirm(this.app.L("Delete ") + g.name + "?")) { this.app.deleteSavingsGoal(id); this.render(); }
  },
  setBudgetC() {
    const cat = document.getElementById("budgetCat").value;
    const amt = document.getElementById("budgetAmt").value;
    if (!cat || this.app.n(amt) <= 0) return;
    this.app.setBudget(cat, amt);
    this.render();
  },
  clearBudgetC(cat) { this.app.setBudget(cat, 0); this.render(); },
  setOverallBudgetC() {
    const amt = document.getElementById("overallBudgetAmt").value;
    if (this.app.n(amt) <= 0) return;
    this.app.setOverallBudget(amt);
    this.render();
  },
  clearOverallBudgetC() { this.app.setOverallBudget(0); this.render(); },
  addCategoryC(kind) {
    const input = document.getElementById(kind === "income" ? "newIncomeCat" : "newExpenseCat");

  },
  deleteCategoryC(kind, name) {
    if (confirm(this.app.L("Delete ") + name + "?")) { this.app.deleteCategory(kind, name); this.render(); }
  },
  postRecurringC(id) {
    const r = this.app.state.data.recurring.find(x => x.id === id); if (!r) return;

  },
  setHorizon(h) { this.app.state.horizon = Number(h); this.render(); },
  togglePlanRows(id) { this.app.state.openPlan = this.app.state.openPlan === id ? null : id; this.render(true); },
  exportJson() {
    const d = this.app.state.data;
    this.app.download("personal-cfo-backup.json", JSON.stringify(d, null, 2), "application/json");
  },
  restoreJsonFile(input) {
    const file = input.files && input.files[0]; if (!file) return;
    if (!confirm(this.app.L("Restore from this backup? This replaces everything currently stored.", "الاستعادة من النسخة دي؟ هيستبدل كل البيانات المحفوظة حالياً."))) { input.value = ""; return; }
    const reader = new FileReader();
    reader.onload = () => {
      const res = this.app.restoreFromJson(String(reader.result));
      if (!res.ok) alert(res.error); else this.render();
      input.value = "";
    };
    reader.onerror = () => { alert(this.app.L("Couldn't read that file.", "معرفتش أقرأ الملف ده.")); input.value = ""; };
    reader.readAsText(file);
  },
  exportCsv() {
    const d = this.app.state.data;
    const rows = [["date", "type", "amount", "account", "person", "category", "desc"]].concat(
      d.tx.map(t => [t.date, t.type, t.amount, this.app.accName(t.accountId), this.app.personName(t.personId), t.category || "", (t.desc || "").replace(/"/g, "'")])
    );
    const csv = rows.map(r => r.map(c => '"' + String(c) + '"').join(",")).join("\n");
    this.app.download("personal-cfo-transactions.csv", csv, "text/csv");
  },
  reseed() { if (confirm(this.app.L("Reload demo data? This replaces everything currently stored.", "تحميل البيانات التجريبية؟ ده هيستبدل كل البيانات المحفوظة حالياً."))) { this.app.persist(this.app.seed(), "Demo data reloaded"); this.render(); } },
  wipe() {
    if (confirm(this.app.L("Erase all data? This cannot be undone.", "حذف كل البيانات؟ الإجراء ده لا يمكن التراجع عنه."))) {
      const empty = { accounts: [], people: [], tx: [], plans: [], groups: [], cardStatements: [], savingsGoals: [], investments: [], recurring: [], audit: [{ at: new Date().toISOString().slice(0, 16).replace("T", " "), what: "Wiped all data" }] };
      this.app.persist(empty, null); this.render();
    }
  },

  // ---- render: full pass, with focus-preservation for text inputs ------
  render(skipFocusRestore) {
    const active = document.activeElement;
    const savedId = active && active.id ? active.id : null;
    const savedSel = (savedId && active.selectionStart != null) ? [active.selectionStart, active.selectionEnd] : null;

    const root = document.getElementById("root");
    // A chart tap positions #chartTooltip against the bar's coordinates at
    // that instant; any render() past that point (a save, a tab switch, a
    // filter change) can move or remove that bar entirely, so the tooltip
    // must not survive it -- unlike #flashStack, which deliberately lives
    // outside render()'s reach so ITS content survives. Cancel the pending
    // auto-hide too so it can't later fire against a reused id.
    const tipEl = document.getElementById("chartTooltip");
    if (tipEl) tipEl.classList.remove("show");
    if (this._chartTooltipHideT) { clearTimeout(this._chartTooltipHideT); this._chartTooltipHideT = null; }
    const S = this.app.state, t = this.app.T[S.lang];
    const dir = S.lang === "ar" ? "rtl" : "ltr";
    document.documentElement.setAttribute("dir", dir);
    document.documentElement.setAttribute("lang", S.lang);

    if (!S.data) { root.innerHTML = "<p>Loading…</p>"; return; }
    const D = this.app.derive();
    // attentionCount() re-scans the transaction list (month spend, 3-month
    // unusual-spending comparison) — too expensive to redo on every
    // render(), which fires on things with no bearing on it (a keystroke in
    // the transaction search, opening a modal, switching tabs). persist()
    // always hands state.data a new object, so caching against that
    // reference means this only recomputes when the data actually changed.
    if (this._badgeDataRef !== S.data) {
      this._badgeDataRef = S.data;
      this._badgeCount = this.app.attentionCount(D);
    }
    this.updateBadge(this._badgeCount);

    if (S.locked) {
      root.innerHTML = this.renderLockScreen(t);
      const el = document.getElementById("lockPin");
      if (el) el.focus();
      return;
    }

    root.innerHTML =
      '<div class="shell">' +
        this.renderPrimaryNav(t) +
        '<div class="main-col">' +
          this.renderTopbar(D, t) +
          this.renderMetricsRow(D, t) +
          '<main class="page">' + this.renderPage(D, t) + "</main>" +
        "</div>" +
      "</div>" +
      this.renderMoreSheet(t) +
      this.renderModal(t);
      // #flashStack is NOT rendered here on purpose -- see UI.flash()'s
      // comment: it lives outside #root in the static page shell so it
      // survives every render() call instead of being wiped by it.

    if (savedId && !skipFocusRestore) {
      const el = document.getElementById(savedId);
      if (el) { el.focus(); if (savedSel) { try { el.setSelectionRange(savedSel[0], savedSel[1]); } catch (e) {} } }
    } else if (savedId && skipFocusRestore) {
      const el = document.getElementById(savedId);
      if (el) { el.focus(); if (savedSel) { try { el.setSelectionRange(savedSel[0], savedSel[1]); } catch (e) {} } }
    }
  },

  // ---- chrome --------------------------------------------------------------
  renderTopbar(D, t) {
    const S = this.app.state;
    const langs = ["en", "ar"].map(c => '<label class="seg-opt"><input type="radio" name="lang" ' + (S.lang === c ? "checked" : "") + ' onchange="UI.setLang(\'' + c + '\')"><span>' + (c === "en" ? "EN" : "ع") + "</span></label>").join("");
    return '<header class="topbar">' +
      '<div class="brand"><span class="brand-mark">₤</span><div><div class="brand-name">' + esc(t.brand) + '</div><div class="brand-sub">' + esc(t.brandSub) + "</div></div></div>" +
      '<div class="topbar-tools">' +
        '<div class="seg">' + langs + "</div>" +
        '<button class="btn btn-ghost" aria-pressed="' + (S.privacy ? "true" : "false") + '" onclick="UI.togglePrivacy()">' + esc(S.privacy ? t.privacyOff : t.privacy) + "</button>" +
        '<button class="btn btn-primary" onclick="UI.openModal(\'expense\')">' + esc(t.aExpense) + "</button>" +
      "</div>" +
    "</header>";
  },
  renderMetricsRow(D, t) {
    const S = this.app.state;
    const items = [
      [t.available, this.app.fmt(D.available), "pos"],
      [t.netWorth, this.app.fmt(D.netWorth), "neu"],
      [t.receivables, this.app.fmt(D.recvTotal), "pos"],
      [t.payables, this.app.fmt(D.payTotal), "neg"],
      [t.investmentsShort, this.app.fmt(D.invValue), "neu"]
    ];
    return '<div class="metrics-row">' + items.map(([l, v, tone]) =>
      '<div class="metric-tile"><div class="metric-label">' + esc(l) + '</div><div class="metric-value tone-' + tone + '">' + v + "</div></div>"
    ).join("") + "</div>";
  },
  renderPrimaryNav(t) {
    const S = this.app.state;
    // person_detail is reached only from the People tab (there's no nav
    // entry of its own) — it counts as "People" here so the nav doesn't
    // wrongly light up "More" while looking at one person's page.
    const effectivePage = S.page === "person_detail" ? "people" : S.page;
    const items = this.app.PRIMARY.map(id => {
      const path = this.app.NAV.find(n => n[0] === id)[1];
      const on = effectivePage === id;
      return '<button class="navbtn' + (on ? " on" : "") + '" aria-current="' + (on ? "page" : "false") + '" onclick="UI.setPage(\'' + id + '\')"><span class="nav-ico nav-ico-' + id + '">' + svgIcon(path, 20) + '</span><span>' + esc(t[id]) + "</span></button>";
    }).join("");
    const moreOn = !this.app.PRIMARY.includes(effectivePage);
    return '<nav class="primary-nav" aria-label="' + esc(t.primaryNav) + '">' + items +
      '<button class="navbtn' + (moreOn ? " on" : "") + '" aria-current="' + (moreOn ? "page" : "false") + '" aria-expanded="' + (S.moreOpen ? "true" : "false") + '" onclick="UI.toggleMore()"><span class="nav-ico nav-ico-more">' + svgIcon("M5 12h.01M12 12h.01M19 12h.01", 20) + '</span><span>' + esc(t.more) + "</span></button>" +
    "</nav>";
  },
  renderMoreSheet(t) {
    const S = this.app.state;
    if (!S.moreOpen) return "";
    const rest = this.app.NAV.filter(([id]) => !this.app.PRIMARY.includes(id));
    return '<div class="sheet-backdrop" onclick="UI.toggleMore()"></div>' +
      '<div class="sheet" role="dialog" aria-label="' + esc(t.more) + '">' +
        '<div class="sheet-handle"></div>' +
        '<div class="sheet-title">' + esc(t.more) + "</div>" +
        '<div class="sheet-grid">' + rest.map(([id, path]) =>
          '<button class="sheet-item' + (S.page === id ? " on" : "") + '" aria-current="' + (S.page === id ? "page" : "false") + '" onclick="UI.setPage(\'' + id + '\')"><span class="nav-ico nav-ico-' + id + '">' + svgIcon(path, 22) + '</span><span>' + esc(t[id]) + "</span></button>"
        ).join("") + "</div>" +
      "</div>";
  },

  renderPage(D, t) {
    const S = this.app.state;
    switch (S.page) {
      case "dashboard": return this.renderDashboard(D, t);
      case "accounts": return this.renderAccounts(D, t);
      case "transactions": return this.renderTransactions(D, t);
      case "people": return this.renderPeople(D, t);
      case "person_detail": return this.renderPersonDetail(D, t);
      case "installments": return this.renderInstallments(D, t);
      case "statements": return this.renderCardStatements(D, t);
      case "goals": return this.renderSavingsGoals(D, t);
      case "groups": return this.renderGroups(D, t);
      case "ledgers": return this.renderLedgers(D, t);
      case "investments": return this.renderInvestments(D, t);
      case "recurring": return this.renderRecurring(D, t);
      case "forecast": return this.renderForecast(D, t);
      case "reports": return this.renderReports(D, t);
      case "cashflow": return this.renderCashFlow(D, t);
      case "settings": return this.renderSettings(D, t);
      default: return "";
    }
  },

  // Shared empty-state card -- approved from the Shape Showcase preview.
  // A plain "<p class=muted>" reads the same weight whether it means
  // "nothing to worry about" (Needs Attention) or "you haven't set this
  // up yet" (no custom categories); this gives each its own icon and a
  // second line saying what to do next (or that there's nothing to do).
  // `icon` is one of the three reused shapes below, not a bespoke one per
  // call site -- CHECK for a genuinely good state (nothing to act on,
  // everything settled), PLUS for "add one to get started", SEARCH for
  // "your filter/search matched nothing". Kept to the sections that are
  // really their own empty moment, not every plain muted-text hint in
  // the app (an explanatory note isn't an empty state).
  emptyState(icon, title, body) {
    return '<div class="empty-state"><div class="empty-glyph">' + svgIcon(icon, 20) + '</div>' +
      '<div class="empty-title">' + esc(title) + "</div>" +
      (body ? '<div class="empty-body">' + esc(body) + "</div>" : "") +
    "</div>";
  },

  // Soft, hashed tint for free-form tags -- unlike categories, tags aren't
  // a fixed list, so they don't get a "slot" from the validated palette
  // (app.categoryColor); a low-saturation tint derived from the tag's own
  // text is enough to tell tags apart at a glance without ever reading as
  // a category color. Only the hue is computed here -- lightness/saturation
  // live in the .tag-chip CSS rule (app.css) so a dark-mode override can
  // step them down the same way every other chip/status color in this app
  // already does, instead of a fixed pastel chip fighting the dark palette.
  tagStyle(tag) {
    // A simple "multiply-then-mod" rolling hash (h = h*31+c, modded on every
    // step) clusters short lowercase words hard: common tags like "trip",
    // "food", "gift", "travel", "car" all landed within a ~90deg band and
    // rendered as the same shade of pink. DJB2-with-XOR, modding only once
    // at the end, spreads the same words across the full hue circle.
    let h = 5381;
    for (let i = 0; i < tag.length; i++) h = ((h * 33) ^ tag.charCodeAt(i)) >>> 0;
    return "--tag-h:" + (h % 360);
  },

  // "in 3d" / "today" / "5d overdue" -- a due date on its own (used for
