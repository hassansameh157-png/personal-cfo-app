<title>Personal CFO</title>
<!-- Real bug, not a Chrome setting: this tag was missing this whole time.
     Without it, any real top-level mobile browser tab (GitHub Pages, the
     installed home-screen shortcut) falls back to rendering at a ~980px
     desktop-style layout viewport and zooming out to fit -- which is
     exactly the "sidebar/desktop layout on a phone" the user hit. It never
     showed up inside the claude.ai Artifact preview because that iframe's
     size is driven by the parent page's own responsive layout, not by this
     document's (previously absent) viewport meta tag. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">

<!-- Home-screen install. This replaces the original export's broken PWA
     attempt (manifest.json/sw.js/icons that 404'd and a service-worker
     registration that failed outright on file://). <meta name="theme-color" content="#0a303e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Personal CFO">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="manifest" href="manifest.json"> is filled
     in per build target: on GitHub Pages, real fetchable files (manifest,
     icons, sw.js) — Chrome's WebAPK-minting install path fetches those
     itself and won't trust data: URIs, which is why a data: URI manifest
     alone still shows the "shortcut, browser badge" outcome instead of a
     real installed app. Inside the claude.ai Artifact preview, none of this
     can work regardless of format — that page runs in a sandboxed iframe,
     and the browser only ever reads install metadata from the top-level
     claude.ai page, never a nested iframe's. -->
<meta name="theme-color" content="#0a303e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Personal CFO">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }
</script>

<style>
:root{
  --c-bg:#f3f2f2; --c-surface:#ffffff; --c-surface-2:#f8f4f4; --c-surface-3:#eae7e7;
  /* P1 fix: was #7d7979, which measures 3.55–3.94:1 on white/bg — fails
     WCAG AA (4.5:1) for the small caption/label text it's used on
     everywhere ("AVAILABLE", "I OWE", dates). #5a5656 keeps the same warm
     neutral hue but clears AA with margin (7.2:1 on white, 6.5:1 on bg). */
  --c-text:#201e1d; --c-text-soft:#605d5d; --c-text-faint:#5a5656;
  --c-line:color-mix(in srgb, #201e1d 14%, transparent);
  --c-accent:#0088b0; --c-accent-700:#006786; --c-accent-800:#004961; --c-accent-900:#0a303e;
  /* P1 fix: solid-fill interactive elements (primary button, active nav,
     selected pill) use this instead of --c-accent directly — white text on
     #0088b0 measures 4.08:1 and fails AA for normal-size text; on #006786
     it's 6.4:1. Fixed across both themes since it's dark enough to hold up
     on either background. */
  --c-accent-fill:#006786;
  --c-accent2:#d6006c; --c-accent2-700:#aa0b56; --c-accent2-100:#fff1f4;
  --c-pos:#006786; --c-pos-bg:#e9f8ff; --c-neg:#aa0b56; --c-neg-bg:#fff1f4;
  --font-head:'Source Serif 4', Georgia, 'Noto Serif Arabic', serif;
  --font-body:'Source Serif 4', Georgia, 'Noto Serif Arabic', system-ui, sans-serif;
  --radius:10px; --shadow: 0 1px 2px rgba(32,30,29,.06), 0 6px 20px -10px rgba(32,30,29,.22);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --c-bg:#17191a; --c-surface:#202324; --c-surface-2:#262a2b; --c-surface-3:#2e3233;
    --c-text:#efeeec; --c-text-soft:#b7b3b0; --c-text-faint:#9a9694;
    --c-line:color-mix(in srgb, #efeeec 16%, transparent);
    --c-accent:#39b6db; --c-accent-700:#7fd0ea; --c-accent-800:#a8def0; --c-accent-900:#0a303e;
    --c-accent-fill:#006786;
    --c-accent2:#ff6fa8; --c-accent2-700:#ff9ac1; --c-accent2-100:#3a1523;
    --c-pos:#5fd0ee; --c-pos-bg:#12303a; --c-neg:#ff9ac1; --c-neg-bg:#3a1523;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px -10px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --c-bg:#17191a; --c-surface:#202324; --c-surface-2:#262a2b; --c-surface-3:#2e3233;
  --c-text:#efeeec; --c-text-soft:#b7b3b0; --c-text-faint:#9a9694;
  --c-line:color-mix(in srgb, #efeeec 16%, transparent);
  --c-accent:#39b6db; --c-accent-700:#7fd0ea; --c-accent-800:#a8def0; --c-accent-900:#0a303e;
  --c-accent-fill:#006786;
  --c-accent2:#ff6fa8; --c-accent2-700:#ff9ac1; --c-accent2-100:#3a1523;
  --c-pos:#5fd0ee; --c-pos-bg:#12303a; --c-neg:#ff9ac1; --c-neg-bg:#3a1523;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px -10px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
body{margin:0;background:var(--c-bg);color:var(--c-text);font-family:var(--font-body)}
#root{font-family:var(--font-body);color:var(--c-text);background:var(--c-bg);min-height:100vh}
.shell{display:flex;flex-direction:column;min-height:100vh;padding-bottom:70px}
.main-col{flex:1;min-width:0}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-head);font-weight:600;margin:0;text-wrap:balance}
.muted{color:var(--c-text-soft)}
.small{font-size:12.5px}
.tone-pos{color:var(--c-pos)}
.tone-neg{color:var(--c-neg)}
.tone-neu{color:var(--c-text)}
.muted-amt{color:var(--c-text-faint)}
:focus-visible{outline:2px solid var(--c-accent);outline-offset:2px}

/* ---- topbar ---- */
.topbar{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--c-line);
  position:sticky;top:0;z-index:30;background:color-mix(in srgb, var(--c-bg) 90%, transparent);backdrop-filter:blur(8px);
  flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px}
.brand-mark{width:30px;height:30px;border-radius:999px;background:var(--c-accent-fill);color:#fff;
  display:grid;place-items:center;font-family:var(--font-head);font-size:15px;flex:none}
.brand-name{font-family:var(--font-head);font-size:15.5px;line-height:1.1}
.brand-sub{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--c-text-faint)}
.topbar-tools{display:flex;align-items:center;gap:8px;margin-inline-start:auto;flex-wrap:wrap}

.seg{display:flex;border:1px solid var(--c-line);border-radius:999px;padding:2px;background:var(--c-surface-2)}
.seg-opt{position:relative;padding:5px 14px;border-radius:999px;font-size:12px;cursor:pointer;display:flex;align-items:center;min-height:44px;min-width:44px;justify-content:center}
.seg-opt input{position:absolute;opacity:0}
.seg-opt:has(input:checked){background:var(--c-accent-fill);color:#fff}

.btn{border:1px solid var(--c-line);border-radius:999px;padding:8px 15px;background:var(--c-surface-2);
  cursor:pointer;font-size:13px;min-height:44px;white-space:nowrap}
.btn.small{min-height:44px;padding:7px 13px;font-size:12.5px}
.btn.block{width:100%;margin-top:10px}
.btn-primary{background:var(--c-accent-fill);border-color:var(--c-accent-fill);color:#fff;font-weight:600}
.btn-secondary{background:var(--c-surface-2)}
.btn-ghost{background:transparent}
.btn-danger{background:var(--c-neg-bg);border-color:var(--c-neg);color:var(--c-neg)}
.btn-row{display:flex;gap:8px}
.btn-row.wrap{flex-wrap:wrap}
.link-btn{background:none;border:0;color:var(--c-accent-700);cursor:pointer;padding:12px 0;font-size:13px;min-height:44px;display:inline-flex;align-items:center}
.link-btn:disabled{color:var(--c-text-faint);cursor:default}

/* ---- metrics row (single instance, header context) ---- */
.metrics-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding:10px 16px;background:var(--c-surface-2);border-bottom:1px solid var(--c-line)}
.metric-tile{padding:7px 9px;border-radius:8px;background:var(--c-surface)}
.metric-label{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--c-text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric-value{font-family:var(--font-head);font-size:14.5px;margin-top:1px;font-variant-numeric:tabular-nums}
@media (max-width:640px){
  .metrics-row{grid-template-columns:repeat(3,minmax(0,1fr))}
  .metric-tile:nth-child(4),.metric-tile:nth-child(5){display:none}
}

/* ---- page / tab header ---- */
.page{padding:18px 16px 90px;max-width:960px;margin:0 auto}
.tab-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.tab-title{font-size:22px}
.tab-sub{font-size:12.5px;color:var(--c-text-faint);margin-top:2px}
.section-title{font-size:16px;margin:22px 0 10px}
.section-title:first-child{margin-top:0}
.section-head{display:flex;justify-content:space-between;align-items:baseline}
.dash-section{margin-bottom:6px}

/* amount strings: <bdi dir="ltr"> already forces LTR run order (the actual
   P1 fix); this class just keeps them tidy inline and tabular. */
.amt-bidi{unicode-bidi:isolate;font-variant-numeric:tabular-nums}

.due-banner{background:var(--c-neg-bg);border:1px solid var(--c-line);border-radius:10px;padding:14px 16px;margin-bottom:18px}

/* ---- hero ---- */
.hero-card{background:var(--c-accent-900);color:#f5efe8;border-radius:var(--radius);padding:22px 22px 20px;box-shadow:var(--shadow)}

/* ---- app lock screen ---- */
.lock-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--c-bg)}
.lock-card{width:100%;max-width:320px;text-align:center;background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--radius);box-shadow:var(--shadow);padding:32px 24px}
.lock-mark{font-family:var(--font-head);font-size:28px;color:var(--c-accent);margin-bottom:6px}
.lock-title{font-family:var(--font-head);font-size:20px;margin:0 0 2px}
.lock-input{text-align:center;font-size:22px;letter-spacing:10px;margin-top:14px}
.hero-card.alt{background:var(--c-surface);color:var(--c-text);border:1px solid var(--c-line)}
.hero-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.hero-value{font-family:var(--font-head);font-size:clamp(34px,9vw,46px);line-height:1.05;letter-spacing:-.01em;margin-top:4px;font-variant-numeric:tabular-nums}
.hero-note{font-size:12px;opacity:.75;max-width:44ch;margin-top:6px}
.hero-sub-row{display:flex;gap:22px;margin-top:14px;padding-top:12px;border-top:1px solid color-mix(in srgb, currentColor 20%, transparent);flex-wrap:wrap}
.hero-sub-label{font-size:9px;letter-spacing:.08em;text-transform:uppercase;opacity:.65}
.hero-sub-value{font-family:var(--font-head);font-size:19px;margin-top:2px;font-variant-numeric:tabular-nums}

/* ---- alerts (needs attention) ---- */
.alert-list{display:flex;flex-direction:column;gap:8px}
.alert-card{background:var(--c-surface);border:1px solid var(--c-line);border-inline-start:3px solid var(--c-neg);border-radius:8px;padding:12px 14px}
.alert-title{font-weight:600;font-size:13.5px}
.alert-body{font-size:12.5px;color:var(--c-text-soft);margin-top:2px}
.alert-cta{margin-top:6px;background:none;border:0;color:var(--c-accent-700);font-size:12.5px;font-weight:600;cursor:pointer;padding:0;min-height:44px;display:inline-flex;align-items:center}

/* ---- tiles / stats ---- */
.tile-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile-grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:560px){ .tile-grid.four{grid-template-columns:repeat(2,minmax(0,1fr))} }
.pos-tile{padding:10px 11px;border-radius:8px;background:var(--c-surface)}
.pos-tile.alt{background:var(--c-accent2-100)}
.pos-label{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--c-text-faint);min-height:22px;line-height:1.25}
.pos-value{font-family:var(--font-head);font-size:16.5px;margin-top:2px;font-variant-numeric:tabular-nums}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat-box{padding:12px;border-radius:8px;background:var(--c-surface)}

/* ---- bars ---- */
.bar-list{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:88px 1fr auto;gap:9px;align-items:center;font-size:12.5px}
.bar-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--c-text-soft)}
.bar-track{height:7px;border-radius:999px;background:var(--c-surface-3);overflow:hidden}
.bar-track.thin{height:5px;margin-top:8px}
.bar-fill{height:100%;border-radius:999px;background:var(--c-accent)}
.bar-fill.neg-fill{background:var(--c-neg)}
.bar-fill.pos-fill{background:var(--c-pos)}
.bar-val{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12px}

/* ---- events ---- */
.event-list{display:flex;flex-direction:column;gap:2px}
.event-row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--c-line);font-size:13px}
.event-dot{width:7px;height:7px;border-radius:999px;flex:none}
.event-dot.pos{background:var(--c-pos)}
.event-dot.neg{background:var(--c-neg)}
.event-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.event-when{color:var(--c-text-faint);font-size:11.5px;white-space:nowrap}
.event-amt{font-variant-numeric:tabular-nums;font-weight:600;font-size:12.5px;white-space:nowrap}

/* ---- filters ---- */
.filter-row{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:8px;margin-bottom:14px}
@media (max-width:640px){ .filter-row{grid-template-columns:1fr 1fr} }
.input{border:1px solid var(--c-line);border-radius:8px;padding:9px 11px;background:var(--c-surface);min-height:44px;width:100%}

/* ---- tables (desktop) / cards (mobile) — fix #2 ---- */
.desktop-only{display:block}
.mobile-only{display:none}
@media (max-width:780px){
  .desktop-only{display:none}
  .mobile-only{display:block}
}
.table-wrap{overflow-x:auto;border:1px solid var(--c-line);border-radius:var(--radius)}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{text-align:start;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--c-text-faint);padding:10px 12px;border-bottom:1px solid var(--c-line);white-space:nowrap}
.table td{padding:9px 12px;border-bottom:1px solid var(--c-line);white-space:nowrap}
.table td.num, .table th.num{text-align:end;font-variant-numeric:tabular-nums;font-weight:600}
.tag{display:inline-flex;font-size:10px;padding:2px 9px;border-radius:999px}
.tag-pos{background:var(--c-pos-bg);color:var(--c-pos)}
.tag-neg{background:var(--c-neg-bg);color:var(--c-neg)}
.tag-neu{background:var(--c-surface-3);color:var(--c-text-soft)}

.card-list{display:flex;flex-direction:column;gap:8px}
.card-row{border:1px solid var(--c-line);border-radius:10px;padding:12px 14px;background:var(--c-surface)}
.card-row.voided{opacity:.5}
.card-row-top{display:flex;align-items:flex-start;gap:10px}
.card-row-top>div:first-child{flex:1;min-width:0}
.card-row-title{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis}
.card-row-sub{font-size:11.5px;color:var(--c-text-faint);margin-top:1px}
.card-row-amt{font-variant-numeric:tabular-nums;font-weight:600;font-size:14.5px;white-space:nowrap}
.card-row-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--c-text-soft);margin-top:8px}
.acc-swatch{width:11px;height:11px;border-radius:999px;flex:none;margin-top:3px}
.acc-sub{font-size:11.5px;color:var(--c-text-faint);margin-top:6px}

.sched-list{display:flex;flex-direction:column;gap:4px;margin-top:8px;padding-top:8px;border-top:1px solid var(--c-line)}
.sched-row{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;gap:8px}
.sched-row span{white-space:nowrap}
.sched-row.status-overdue .sched-status{color:var(--c-neg)}
.sched-row.status-paid .sched-status{color:var(--c-pos)}
.sched-row.mine{font-weight:600}

.pill-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.pill{border:1px solid var(--c-line);background:var(--c-surface);border-radius:999px;padding:7px 14px;font-size:12.5px;cursor:pointer;min-height:44px}
.pill.on{background:var(--c-accent-fill);border-color:var(--c-accent-fill);color:#fff}
.proj-bar{height:8px;border-radius:999px;background:var(--c-surface-3);overflow:hidden;margin-top:14px}
.proj-fill{height:100%}

.chart-cols{display:flex;align-items:flex-end;gap:10px;height:120px;padding:0 4px 4px}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.chart-bar{width:70%;border-radius:6px 6px 0 0;min-height:4px}
.chart-label{font-size:10.5px;color:var(--c-text-faint);margin-top:6px}

.rules-list{display:flex;flex-direction:column;gap:10px}
.rule-row{padding:10px 0;border-bottom:1px solid var(--c-line)}
.rule-k{font-weight:600;font-size:13px}
.rule-v{font-size:12.5px;color:var(--c-text-soft);margin-top:2px}
.audit-list{display:flex;flex-direction:column;gap:2px;font-size:12.5px}
.audit-row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--c-line);color:var(--c-text-soft)}

/* ---- primary nav — fix #1: 5 fixed tabs + More sheet ---- */
.primary-nav{position:fixed;inset-inline:0;bottom:0;z-index:40;display:flex;background:var(--c-surface);
  border-top:1px solid var(--c-line);box-shadow:0 -4px 16px rgba(0,0,0,.06);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;
  padding:7px 2px;border-radius:10px;color:var(--c-text-soft);min-height:52px;cursor:pointer}
.navbtn span{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.navbtn.on{color:var(--c-accent-fill)}
@media (min-width:900px) and (pointer:fine){
  .shell{flex-direction:row;padding-bottom:0}
  .primary-nav{position:sticky;top:0;inset-inline:auto;bottom:auto;flex-direction:column;width:196px;flex:none;height:100vh;
    border-top:0;border-inline-end:1px solid var(--c-line);box-shadow:none;padding:14px 8px;gap:2px}
  .navbtn{flex:none;flex-direction:row;justify-content:flex-start;padding:9px 12px;gap:10px;min-height:44px}
  .navbtn span{font-size:13px}
  .navbtn.on{background:var(--c-accent-fill);color:#fff}
  .main-col .topbar,.main-col .metrics-row{position:sticky;top:0;z-index:30}
  .main-col .metrics-row{top:57px}
  .page{padding-bottom:40px}
}

/* ---- More sheet ---- */
.sheet-backdrop{position:fixed;inset:0;background:rgba(20,18,17,.4);z-index:45}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:46;background:var(--c-surface);border-radius:16px 16px 0 0;
  padding:10px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.2);max-height:70vh;overflow:auto}
.sheet-handle{width:36px;height:4px;border-radius:999px;background:var(--c-line);margin:0 auto 12px}
.sheet-title{font-family:var(--font-head);font-size:15px;margin-bottom:12px}
.sheet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sheet-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:12px;
  border:1px solid var(--c-line);background:var(--c-surface-2);color:var(--c-text-soft);cursor:pointer;min-height:76px}
.sheet-item.on{color:var(--c-accent-fill);border-color:var(--c-accent-fill)}
.sheet-item span{font-size:11px;text-align:center}
@media (min-width:900px) and (pointer:fine){
  .sheet{inset-inline:auto;bottom:auto;top:60px;inset-inline-start:210px;width:280px;border-radius:12px;max-height:80vh}
}

/* ---- modal ---- */
