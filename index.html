*{box-sizing:border-box}
body{margin:0;background:var(--c-bg);color:var(--c-text);font-family:var(--font-body)}
/* #root sits directly inside body and covers it edge to edge (min-height:
   100vh) -- while --c-bg was a flat color, painting it again here was
   effectively free; now that it's a 2-3 layer radial-gradient stack (the
   Neon Aurora aurora wash), that's real duplicated gradient compute for a
   layer nothing ever shows through to see. body's own paint stays (an iOS
   overscroll-bounce can reveal it past #root's edge), just not repeated
   here. */
#root{font-family:var(--font-body);color:var(--c-text);min-height:100vh}
.shell{display:flex;flex-direction:column;min-height:100vh;padding-bottom:70px}
.main-col{flex:1;min-width:0}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-head);font-weight:600;margin:0;text-wrap:balance}
.muted{color:var(--c-text-soft)}
/* Approved from the Shape Showcase preview -- was a single <p class=muted>
   line, same weight whether it meant "nothing to worry about" or "you
   haven't set this up yet" (see UI.emptyState). Dashed border reads as
   "optional/not-yet-filled" rather than a real content card, same
   language the card customizer's own optional fields already lean on. */
.empty-state{text-align:center;padding:26px 20px;border-radius:14px;border:1.5px dashed var(--c-line);background:var(--c-surface)}
.empty-glyph{width:40px;height:40px;margin:0 auto 10px;border-radius:11px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--c-accent-fill) 16%,transparent);color:var(--c-accent-fill)}
.empty-title{font-family:var(--font-head);font-size:15px;margin-bottom:3px}
.empty-body{font-size:13px;color:var(--c-text-soft)}
.small{font-size:14px}
.tone-pos{color:var(--c-pos)}
.tone-neg{color:var(--c-neg)}
.tone-neu{color:var(--c-text)}
.muted-amt{color:var(--c-text-faint)}
:focus-visible{outline:2px solid var(--c-accent);outline-offset:2px}

/* ---- glass ---------------------------------------------------------------
   One shared blur rule for every panel-sized surface built on --c-surface/
   --c-surface-2/--c-surface-3 (all translucent now, in both themes -- see
   the token blocks up top) -- this is what actually turns "translucent"
   into "glass": blurring whatever sits behind each panel (the aurora wash
   in dark mode, the page underneath in light) instead of just showing a
   flat tint. One rule, not repeated per class, so a future surface-using
   class joins the same treatment by joining this selector list.
   Two kinds of surface are deliberately left out of it, not by oversight:
   1) Anything that can render in real quantity -- .pill/.tag/tag-chips,
      .card-row (Transactions renders up to txVisible, 25, growing every
      "Load more" click and never shrinking back down -- a long session's
      list can genuinely reach the hundreds), and .btn/.btn-secondary
      (small, and frequently several per screen in a btn-row). Backdrop-
      filter on that many elements is real compositing cost for no visible
      gain over the translucent tint they already get from --c-surface-2
      alone.
   2) Anything that only ever renders INSIDE a surface this list already
      blurs -- .input inside .dialog, .sheet-item inside .sheet, .metric-
      tile inside .metrics-row, .seg inside .topbar (which blurs itself
      directly, just below). Real bug caught in review: an earlier pass
      blurred both the container and its own children, so the child's
      backdrop-filter was re-blurring an already-blurred surface -- a
      second compositing layer with no additional visible effect, pure
      GPU cost. The outer surface's blur already covers everything drawn
      on top of it.
   .primary-nav and .metrics-row get a lighter blur(8px) below, not this
   rule's 16px -- both are sticky/fixed full-width bars that repaint on
   every scroll tick (flagged in review as the two most likely to cost
   real scroll-jank on lower-end mobile at the heavier radius), same
   intensity .topbar already uses for the identical reason. */
.pos-tile, .stat-box, .dialog, .sheet,
.lock-card, .alert-card,
.due-banner{
  backdrop-filter:blur(16px) saturate(140%);
  -webkit-backdrop-filter:blur(16px) saturate(140%);
}
.primary-nav, .metrics-row{
  backdrop-filter:blur(8px) saturate(140%);
  -webkit-backdrop-filter:blur(8px) saturate(140%);
}

/* ---- topbar ---- */
/* Was color-mix(in srgb, var(--c-bg) 90%, transparent) -- valid only while
   --c-bg was a plain color. --c-bg is now a background-image list (the
   aurora gradients), which color-mix() can't take a <color> from, so this
   uses --c-surface directly instead -- already the right translucent glass
   tint, and consistent with every other blurred panel. */
.topbar{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--c-line);
  position:sticky;top:0;z-index:30;background:var(--c-surface);backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px}
.brand-mark{width:30px;height:30px;border-radius:999px;background:var(--c-accent-fill);color:#fff;
  display:grid;place-items:center;font-family:var(--font-head);font-size:15px;flex:none}
.brand-name{font-family:var(--font-head);font-size:16.5px;line-height:1.1}
.brand-sub{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--c-text-faint)}
.topbar-tools{display:flex;align-items:center;gap:8px;margin-inline-start:auto;flex-wrap:wrap}

.seg{display:flex;border:1px solid var(--c-line);border-radius:999px;padding:2px;background:var(--c-surface-2)}
.seg-opt{position:relative;padding:5px 14px;border-radius:999px;font-size:13.5px;cursor:pointer;display:flex;align-items:center;min-height:44px;min-width:44px;justify-content:center}
.seg-opt input{position:absolute;opacity:0}
/* Same bevel language as .btn-primary's Deep Press, lighter touch -- just
   the inset highlight/shade, no drop shadow or gradient -- since these are
   small, sometimes-repeated controls (a period toggle, a filter pill), not
   the one big CTA, same "smaller control gets the lighter version" split
   the chart bars draw between .chart-bar and .bar-fill. */
.seg-opt:has(input:checked), .pill.on{
  box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 -4px 8px -3px rgba(0,0,0,.35) inset}
.seg-opt:has(input:checked){background:var(--c-accent-fill);color:#fff}

.btn{border:1px solid var(--c-line);border-radius:999px;padding:8px 15px;background:var(--c-surface-2);
  cursor:pointer;font-size:14.5px;min-height:44px;white-space:nowrap}
.btn.small{min-height:44px;padding:7px 13px;font-size:14px}
.btn.block{width:100%;margin-top:10px}
/* "Deep Press" -- approved from the Next Wave preview, same bevel language
   as the credit-card tiles' Holo Shine (bright top inset, dark bottom
   inset) so the app's one truly solid-fill, most-tapped control (+ Expense,
   every dialog's Save, Pay/Collect, Unlock -- all share .btn-primary) reads
   as a raised, pressable object instead of a flat tinted rectangle. The
   outer drop shadow is un-gated by theme (present, just softer, in light
   too) -- it's a plain shadow, not a colored glow, same "shadow exists
   everywhere, glow is dark-only" split as --shadow vs --glow-1 elsewhere.
   :active flattens the bevel and nudges the button down 1px -- the actual
   "being pressed" feedback, not just decoration. */
.btn-primary{background:linear-gradient(180deg,color-mix(in srgb,var(--c-accent-fill) 88%,white 12%),var(--c-accent-fill));
  border-color:var(--c-accent-fill);color:#fff;font-weight:600;
  box-shadow:0 1px 0 rgba(255,255,255,.45) inset,0 -5px 10px -4px rgba(0,0,0,.4) inset,
    0 8px 18px -9px color-mix(in srgb,var(--c-accent-fill) 65%,transparent)}
.btn-primary:active{transform:translateY(1px);
  box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 -2px 6px -3px rgba(0,0,0,.35) inset}
.btn-secondary{background:var(--c-surface-2)}
.btn-ghost{background:transparent}
.btn-danger{background:var(--c-neg-bg);border-color:var(--c-neg);color:var(--c-neg)}
.btn-row{display:flex;gap:8px}
.btn-row.wrap{flex-wrap:wrap}
.link-btn{background:none;border:0;color:var(--c-accent-700);cursor:pointer;padding:12px 0;font-size:14.5px;min-height:44px;display:inline-flex;align-items:center}
.link-btn:disabled{color:var(--c-text-faint);cursor:default}
/* Every Delete action in this app goes through the browser's own native
   confirm() -- that dialog is chrome the OS renders, entirely outside this
   page's DOM/CSS, so it can't be given a "danger" look no matter what's
   tried here. This styles the trigger instead: a Delete link-btn reads red
   at rest and gets a warning glow on hover/focus, so the "this is
   destructive" cue lands before the (unstyleable) confirm prompt even
   opens, rather than only after. */
.link-btn.danger{color:var(--c-neg)}
.link-btn.danger:hover, .link-btn.danger:focus-visible{box-shadow:var(--glow-neg);border-radius:6px}
/* 31 (Transactions Recut): the "..." trigger UI.txRowActions() renders
   now, in place of the four permanent link-buttons it used to always
   show -- muted like a plain affordance (not var(--c-accent-700), which
   reads as "this IS the action" the way Edit/Delete used to) since
   opening the sheet isn't itself the destination, and padded on both
   sides (unlike .link-btn's own padding:12px 0) so the tap target is
   more than just the three dots' own width. */
.tx-more-btn{color:var(--c-text-faint);padding-inline:10px}
/* 36 (Accounts Recut): same "..." trigger pattern as .tx-more-btn above,
   opening UI.renderAcctActionSheet() instead -- on a plain .card-row
   (the "other" account rows) this reads exactly like it. On a colored
   .credit-card-tile it already inherits currentColor via that tile's own
   ".credit-card-tile .link-btn{color:inherit}" rule further down, since
   it still carries the shared .link-btn class too. */
.acct-more-btn{color:var(--c-text-faint);padding-inline:10px}
/* 41 (People Recut): same "..." trigger pattern as .tx-more-btn/
   .acct-more-btn above, opening UI.renderPersonActionSheet() instead. */
.person-more-btn{color:var(--c-text-faint);padding-inline:10px}
/* Savings Groups Recut: same "..." trigger pattern, opening
   UI.renderGroupActionSheet() instead. */
.group-more-btn{color:var(--c-text-faint);padding-inline:10px}
/* Card statements: same "..." trigger pattern, opening
   UI.renderStmtActionSheet() instead. */
.stmt-more-btn{color:var(--c-text-faint);padding-inline:10px}
/* Investments: same "..." trigger pattern, opening
   UI.renderInvestActionSheet() instead. */
.invest-more-btn{color:var(--c-text-faint);padding-inline:10px}
/* 46 (People Recut): tel:/wa.me links next to a phone number (People
   list, Person Detail) -- small enough to sit inline right after the
   phone text itself, not a full button. */
.phone-link{display:inline-flex;vertical-align:middle;margin-inline-start:6px;color:var(--c-accent-fill)}
.phone-link:hover{opacity:.75}

/* ---- metrics row (single instance, header context) ---- */
.metrics-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding:10px 16px;background:var(--c-surface-2);border-bottom:1px solid var(--c-line)}
.metric-tile{padding:7px 9px;border-radius:8px;background:var(--c-surface)}
.metric-label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--c-text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric-value{font-family:var(--font-head);font-size:16px;margin-top:1px;font-variant-numeric:tabular-nums}
/* .scoped: the per-account/per-category bar (UI.renderMetricsRow) --
   always exactly as many columns as it actually has tiles (2-4, via
   --n set inline per row), at every width. The plain 5-tile global bar
   below it still trims down to its own fixed 3-of-5 on narrow screens,
   but that nth-child rule must NOT also reach a .scoped row: a real bug
   caught before shipping -- a credit card's scoped row has exactly 4
   tiles (Outstanding/Available/Limit/Statement due), and the plain
   ":nth-child(4)" rule would silently hide "Statement due" on mobile,
   the one place this whole feature was built for. */
.metrics-row.scoped{grid-template-columns:repeat(var(--n,3),minmax(0,1fr))}
@media (max-width:640px){
  .metrics-row{grid-template-columns:repeat(3,minmax(0,1fr))}
  .metrics-row:not(.scoped) .metric-tile:nth-child(4),.metrics-row:not(.scoped) .metric-tile:nth-child(5){display:none}
}

/* ---- page / tab header ---- */
.page{padding:18px 16px 90px;max-width:960px;margin:0 auto}
/* .page-enter: added only on a real page switch (UI.render() compares the
   page id against what it last painted -- see its own comment), never on
   every render(), so a keystroke in the transaction search or opening a
   modal doesn't replay it. A light slide-up + fade, not a full-screen
   transform -- the topbar/metrics-row/nav above and below the <main> stay
   put, only the page content itself animates in. */
.page-enter{animation:pageEnter .22s ease}
@keyframes pageEnter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){ .page-enter{animation:none} }
.tab-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.tab-title{font-size:24px}
.tab-sub{font-size:14px;color:var(--c-text-faint);margin-top:2px}
.section-title{font-size:18px;margin:22px 0 10px}
.section-title:first-child{margin-top:0}
.section-head{display:flex;justify-content:space-between;align-items:baseline}
/* "Ledger" redesign (Reports): a one-line callout, e.g. "Rent leads at
   34%", nested INSIDE the same <h2 class="section-title"> as its own last
   child (never a sibling wrapper div around the h2) -- real regression
   caught by the full suite: check_batch16.js finds the by-source bar-list
   via the h2's own xpath following-sibling::div[1], which a new wrapper
   would have broken. .has-note only applies to a heading that actually
   carries one, so every OTHER .section-title in the app (still just plain
   block text) is completely unaffected. font-weight:400 so the note reads
   as an annotation, not a second bold heading fighting the real one. */
.section-title.has-note{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.section-note{font-size:11px;font-weight:400;color:var(--c-text-faint);white-space:nowrap}
.dash-section{margin-bottom:6px}

/* amount strings: <bdi dir="ltr"> already forces LTR run order (the actual
   P1 fix); this class just keeps them tidy inline and tabular. */
.amt-bidi{unicode-bidi:isolate;font-variant-numeric:tabular-nums}

.due-banner{background:var(--c-neg-bg);border:1px solid var(--c-line);border-radius:10px;padding:14px 16px;margin-bottom:18px}

/* ---- hero ---- */
/* Always a dark glass panel with light text, whatever theme the rest of the
   page is in (--c-accent-900 is the same fixed translucent value in every
   theme block -- see its definition up top) -- same "fixed regardless of
   theme" reasoning the credit-card tile already used, just glass now
   instead of a flat navy fill, so the page's own aurora wash shows through
   it blurred. */
/* 25 (Dashboard Recut): --c-accent-900 alone is .92 opaque, so the aurora
   bleed the comment above promises is real but faint -- on a light-theme
   page whose own --c-bg wash is itself only .05 alpha, barely anything of
   it survives through backdrop-filter. These three radial gradients paint
   the SAME hue family (violet/cyan/pink) directly onto the card, at a
   strength that reads on either theme's --c-bg behind it, instead of
   relying on how much of the page happens to bleed through -- the "always
   dark" identity (--c-accent-900 last, still the base fill) is unchanged,
   this only gives that base more of the depth the rest of Neon Aurora
   already has. */
.hero-card{background:
    radial-gradient(220px 170px at 102% -18%, rgba(103,232,249,.22), transparent 62%),
    radial-gradient(200px 190px at -12% 118%, rgba(244,114,182,.18), transparent 62%),
    radial-gradient(280px 210px at 58% -30%, rgba(139,92,246,.24), transparent 66%),
    var(--c-accent-900);
  color:#f5efe8;border-radius:var(--radius);padding:22px 22px 20px;
  box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%)}
/* "You can spend today" -- its own tinted banner inside the hero card, same
   technique as the credit-card tile's .cc-stmt badge: fixed colors, not the
   theme's --c-pos/--c-neg, so it reads reliably against this card's always-
   dark background (--c-accent-900 is the same value in every theme block).
   Mint while there's room; a warning amber once today's own obligations
   would already eat into what's on hand (spendToday < 0). */
.spend-today{margin-top:14px;padding:10px 14px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:rgba(112,224,180,.16);border:1px solid rgba(112,224,180,.4)}
.spend-today.tight{background:rgba(255,166,110,.2);border-color:rgba(255,166,110,.5)}
.spend-today-label{font-size:13px}
.spend-today-value{font-family:var(--font-head);font-size:20px;font-weight:600;white-space:nowrap}

/* ---- credit card tile ---- */
/* No bank logos/wordmarks drawn here (trademarked) — just the account's
   own color (and, for the 3 non-default patterns, a second color) in a
   card-shaped layout -- see UI.cardBackground(). Picking your bank's
   color in Edit is what makes it "look like" the real card.
   "Holo Shine" -- the approved depth treatment from the card-tile preview:
   a bright top / dark bottom bevel (the box-shadow stack) makes the card
   read as a thick, embossed object rather than a flat rectangle, and a
   slow iridescent sheen sweeps across it like a real card's security
   strip. color is no longer hardcoded #fff -- UI.cardTextColor(a) sets it
   per account (inline style, same place background is set), so .cc-name/
   .link-btn below inherit it instead of forcing white regardless. */
/* Flip (approved from the "same approach" list): .credit-card-tile is now
   just the perspective container/grid item -- it carries no background,
   border or shadow of its own any more, all of that moved to .cc-face
   (both front and back need their own independent copy, since either can
   be the one actually facing the viewer). .cc-flip is the element that
   actually rotates; .cc-face-front stays in normal flow (position:
   relative) so its natural content height sizes the whole tile, same as
   before this existed -- .cc-face-back is position:absolute;inset:0 over
   it, sized by the front's box rather than its own (shorter) content, so
   flipping never changes the tile's height mid-animation. */
.credit-card-tile{perspective:1400px}
.cc-flip{position:relative;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,.2,.2,1)}
.cc-flip.flipped{transform:rotateY(180deg)}
@media (prefers-reduced-motion: reduce){ .cc-flip{transition:none} }
/* position:relative -- without an explicit position, the front face (only
   .cc-face-back sets one, to position:absolute) is static, so its own
   ::after (the holo-sweep sheen, position:absolute) skips straight past
   it to .cc-flip as its containing block instead -- which has no
   border-radius/overflow of its own, letting the sheen's sharp corners
   paint outside the card's actual rounded corners. This makes ::after
   contained and clipped by the face's own rounded box on both faces
   (.cc-face-back's own position:absolute below still wins for it, same
   specificity but declared later in the cascade). */
.cc-face{position:relative;border-radius:16px;padding:18px 18px 14px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border:1.5px solid rgba(255,255,255,.28);
  box-shadow:
    0 1.5px 0 rgba(255,255,255,.4) inset,
    0 -10px 18px -6px rgba(0,0,0,.5) inset,
    0 16px 34px -14px rgba(0,0,0,.6)}
.cc-face-back{position:absolute;inset:0;transform:rotateY(180deg);display:flex;flex-direction:column}
.cc-face::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(100deg, transparent 30%, rgba(255,255,255,.35) 46%, rgba(180,220,255,.25) 50%, rgba(255,200,240,.22) 54%, transparent 68%);
  mix-blend-mode:overlay;animation:holoSweep 5s ease-in-out infinite}
@keyframes holoSweep{ 0%,100%{transform:translateX(-18%)} 50%{transform:translateX(18%)} }
@media (prefers-reduced-motion: reduce){ .cc-face::after{animation:none} }
.cc-flip-btn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:999px;
  width:28px;height:28px;display:grid;place-items:center;color:inherit;cursor:pointer;flex:none}
.cc-back-title{font-family:var(--font-head);font-size:14.5px}
.cc-back-list{display:flex;flex-direction:column;gap:8px;flex:1;overflow-y:auto;margin-top:10px}
.cc-back-row{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.cc-back-row-sub{opacity:.75;font-size:11.5px;margin-top:1px}
.cc-back-empty{font-size:13px;opacity:.75}
.cc-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cc-bank{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.cc-chip{width:30px;height:22px;border-radius:5px;background:linear-gradient(155deg,#fff4d6,#d9b658 45%,#8f6f2e);
  box-shadow:0 1px 0 rgba(255,255,255,.6) inset}
/* Balance-type tiles (wallet/cash/electronic card) get a plain translucent
   mark instead of the chip — a chip specifically reads as "real EMV card",
   which none of these are. 37 (Accounts Recut): the mark itself now holds
   a real per-type icon (see UI.renderAccounts()'s own typeIcon map) rather
   than sitting empty. */
.cc-mark{width:22px;height:22px;border-radius:999px;background:rgba(255,255,255,.28);border:1.5px solid rgba(255,255,255,.5);
  display:flex;align-items:center;justify-content:center}
.cc-mark svg{width:13px;height:13px}
.balance-tile .cc-row{margin-top:18px}
.cc-name{display:block;font-family:var(--font-head);font-size:18px;color:inherit;margin-top:14px;padding:0 !important;min-height:0 !important}
.cc-row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:16px}
.cc-label{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.cc-amt{font-family:var(--font-head);font-size:21px;margin-top:2px}
.cc-sub{font-size:14.5px;margin-top:2px}
/* A statement due, right on the card face -- its own tinted badge instead
   of another plain cc-row, so it reads as something to act on instead of
   blending into Outstanding/Available/Limit. Gold echoes the card's own
   chip color (a real card's statement is due soon, not urgent yet); red
   takes over once it's actually overdue. Both colors are fixed regardless
   of the card's own chosen color, so they stay legible against any of them. */
/* Approved from the Next Wave preview: the gold/red split above already
   existed, this just adds the same glow language the cards/buttons got --
   a static amber glow while it's still just "due soon", a red glow that
   gently pulses once it's actually overdue (pulse is the one difference
   from the plain glow -- reserved for genuinely late, not every badge).
   --glow-warn/--glow-neg are empty in light (see where they're defined),
   so this is a dark-mode-only addition, same as the rest of the glow
   family -- the gold/red background above already carries the badge in
   light regardless. */
.cc-stmt{margin-top:10px;padding:7px 10px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;
  background:rgba(233,211,138,.22);border:1px solid rgba(233,211,138,.45);box-shadow:var(--glow-warn)}
.cc-stmt.overdue{background:rgba(255,110,110,.22);border-color:rgba(255,130,130,.5);
  box-shadow:var(--glow-neg);animation:pulseGlowNeg 2.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){ .cc-stmt.overdue{animation:none} }
.cc-stmt .cc-label{opacity:.9}
.cc-stmt-amt{font-weight:700;font-size:14.5px;white-space:nowrap}
/* Thin Outstanding/Limit usage bar, credit-card tiles only (see the
   comment where usageBar is built in renderAccounts()). Fixed track/fill
   colors regardless of the card's own chosen background -- same reasoning
   as .cc-stmt's fixed gold/red above: a color derived from the card's own
   (arbitrary, user-picked) background couldn't guarantee staying visible
   against it. */
.cc-usage{margin-top:10px;height:5px;border-radius:999px;background:rgba(255,255,255,.22);overflow:hidden}
.cc-usage-fill{height:100%;border-radius:999px;transition:width .3s ease}
@media (prefers-reduced-motion: reduce){ .cc-usage-fill{transition:none} }
.credit-card-tile .link-btn{color:inherit;opacity:.85}
.credit-card-tile .link-btn:hover{opacity:1}

/* ---- app lock screen ---- */
.lock-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--c-bg)}
.lock-card{width:100%;max-width:320px;text-align:center;background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--radius);box-shadow:var(--shadow);padding:32px 24px}
/* Was just colored text -- everything else on this screen already picked
   up the system automatically (.lock-card was already in the shared
   backdrop-filter list from the original Neon Aurora pass, so the aurora
   wash already shows through it; .btn-primary already has Deep Press;
   .lock-input already gets the new focus ring, same as any other
   .input). A real badge now, same shape/bevel language as .brand-mark
   (the small topbar version of this) scaled up, not just recolored text. */
.lock-mark{width:56px;height:56px;margin:0 auto 14px;border-radius:16px;display:grid;place-items:center;
  font-family:var(--font-head);font-size:24px;color:#fff;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c-accent-fill) 88%,white 12%),var(--c-accent-fill));
  box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 -6px 12px -4px rgba(0,0,0,.4) inset,
    0 10px 22px -12px color-mix(in srgb,var(--c-accent-fill) 60%,transparent)}
.lock-title{font-family:var(--font-head);font-size:22px;margin:0 0 2px}
.lock-input{text-align:center;font-size:24px;letter-spacing:10px;margin-top:14px}
.hero-card.alt{background:var(--c-surface);color:var(--c-text);border:1px solid var(--c-line)}
.hero-label{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
/* 27 (Dashboard Recut): a size+weight bump for the one number every
   .hero-card exists to lead with (Dashboard's Available balance, Forecast's
   projected balance, a Person's net position...) -- previously the same
   visual weight as the sub-values sitting right underneath it in
   .hero-sub-row, so nothing in the layout itself said "this is the number
   that matters most here." font-weight:600 needs no new font-weight load:
   Source Serif 4 400/600/700 are already pulled in by the page's own
   <link>. */
.hero-value{font-family:var(--font-head);font-weight:600;font-size:clamp(40px,10.5vw,56px);line-height:1.05;letter-spacing:-.01em;margin-top:4px;font-variant-numeric:tabular-nums}
.hero-note{font-size:13.5px;opacity:.75;max-width:44ch;margin-top:6px}
.hero-sub-row{display:flex;gap:22px;margin-top:14px;padding-top:12px;border-top:1px solid color-mix(in srgb, currentColor 20%, transparent);flex-wrap:wrap}
.hero-sub-label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.65}
.hero-sub-value{font-family:var(--font-head);font-size:21px;margin-top:2px;font-variant-numeric:tabular-nums}
.sparkline{vertical-align:middle;margin-inline-start:6px;opacity:.85}
/* Wraps the sparkline so it's tappable to expand the full trend below --
   reset to plain inline content, no button chrome, since it must sit
   inline with the net worth figure exactly like the bare <svg> used to. */
.spark-trigger{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer;vertical-align:middle}
/* Collapsed by default -- UI.toggleNwTrend() adds/removes .show. Pre-rendered
   every Dashboard render (see renderDashboard()), so this is pure CSS, no
   JS-driven height measurement needed. */
.nw-trend-expand{display:none}
.nw-trend-expand.show{display:block}

/* ---- Signal redesign: chart-forward hero trend + delta chip ---- */
/* A pill next to the headline value, up/down colored the same tone-pos/
   tone-neg convention as everywhere else -- unlike hero-sub-row's own
   values (which read that tone off a currentColor border and stay
   unstyled by tone-pos/neg on purpose, see the comment above hero-sub-row
   in ui.js), this chip carries its own solid tinted background so it
   reads correctly regardless of which surface it sits on. */
.delta-chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 10px 4px 8px;
  font-size:12px;font-weight:600;margin-top:8px}
.delta-chip svg{width:11px;height:11px}
.delta-chip.tone-pos{background:rgba(112,224,180,.18);color:#8ff0c8}
.delta-chip.tone-neg{background:rgba(255,138,138,.18);color:#ffb0b0}
/* Bleeds to the card's own edges (negative margin matching .hero-card's
   own padding) so the chart reads as one continuous surface with the card
   itself, the same "breaks out of the padding" treatment .spend-today
   already uses one section down. */
.hero-chart-wrap{margin:14px -22px -2px;height:88px}
.hero-trend-wrap{width:100%;height:100%}
.hero-trend{width:100%;height:100%;display:block}

/* ---- alerts (needs attention) ---- */
.alert-list{display:flex;flex-direction:column;gap:8px}
/* Every Needs Attention card used to get the same red left border
   regardless of what it actually was -- a genuinely overdue payment read
   identically to a 90%-of-budget nudge or a "here's your largest
   receivable" FYI. Each alert pushed in UI.renderDashboard() now carries
   its own sev: "neg" (already late/over -- pulses, see pulseGlowNeg), "warn"
   (heads-up before it's late/over) or "info" (not urgency at all, e.g.
   "largest open receivable"), rendered as a sev-{X} class this picks the
   border/glow from; the base rule below is the info look, so an untagged
   sev still renders as a plain card instead of alarming red by default. */
.alert-card{background:var(--c-surface);border:1px solid var(--c-line);border-inline-start:3px solid var(--c-line);border-radius:8px;padding:12px 14px}
.alert-card.sev-neg{border-inline-start-color:var(--c-neg);box-shadow:var(--glow-neg);animation:pulseGlowNeg 2.6s ease-in-out infinite}
.alert-card.sev-warn{border-inline-start-color:var(--c-warn);box-shadow:var(--glow-warn)}
@media (prefers-reduced-motion: reduce){ .alert-card.sev-neg{animation:none} }
@keyframes pulseGlowNeg{0%,100%{box-shadow:var(--glow-neg)}50%{box-shadow:var(--glow-neg-strong)}}
.alert-title{font-weight:600;font-size:15px}
.alert-body{font-size:14px;color:var(--c-text-soft);margin-top:2px}
.alert-cta{margin-top:6px;background:none;border:0;color:var(--c-accent-700);font-size:14px;font-weight:600;cursor:pointer;padding:0;min-height:44px;display:inline-flex;align-items:center}

/* ---- tiles / stats ---- */
.tile-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile-grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:560px){ .tile-grid.four{grid-template-columns:repeat(2,minmax(0,1fr))} }
.pos-tile{padding:10px 11px;border-radius:8px;background:var(--c-surface)}
.pos-tile.alt{background:var(--c-accent2-100)}
/* 28 (Dashboard Recut): "Where my money is" tiles that represent a real
   money bucket (Cash/Bank/Wallets/Cards/Invested/Owed to me) -- --tile-tint
   etc. are set inline per tile (UI.renderDashboard's positionTiles), one
   color-mix'd against --c-surface/transparent so it stays legible over
   either theme's own surface rather than a flat hardcoded hex. */
.pos-tile.tinted{background:var(--tile-tint,var(--c-surface))}
.tile-ico{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  background:var(--tile-ico-bg,var(--c-surface-3));color:var(--tile-ico-fg,var(--c-text-faint));margin-bottom:4px}
.tile-ico svg{width:13px;height:13px}
.pos-label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--c-text-faint);min-height:22px;line-height:1.25}
.pos-value{font-family:var(--font-head);font-size:19px;margin-top:2px;font-variant-numeric:tabular-nums}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat-box{padding:12px;border-radius:8px;background:var(--c-surface)}

/* ---- Signal redesign: "where my money is" as a proportional composition,
   ahead of (not instead of) the exact-figure tile grid right below it ---- */
.stack-card{background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px}
.stack-total{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.stack-total-label{font-size:11.5px;color:var(--c-text-faint)}
.stack-total-value{font-family:var(--font-head);font-size:18px;font-variant-numeric:tabular-nums}
.stack-bar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--c-surface-3)}
.stack-seg{height:100%}
.stack-seg:not(:last-child){border-inline-end:2px solid var(--c-surface)}
.stack-legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:12px}
.legend-row{display:flex;align-items:center;gap:7px;min-width:0}
.legend-dot{width:8px;height:8px;border-radius:2px;flex:none}
.legend-name{font-size:12px;color:var(--c-text-soft);flex:1;min-width:0}
.legend-val{font-size:12px;font-weight:600;font-family:var(--font-head);font-variant-numeric:tabular-nums}

/* ---- Signal redesign: diverging income/expense bar under "This month"'s
   own stat boxes -- same two numbers, given a proportional shape too ---- */
.diverge{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--c-surface-3);margin-bottom:12px}
.div-in{background:linear-gradient(90deg,color-mix(in srgb,var(--c-pos) 85%,white),var(--c-pos))}
.div-out{background:linear-gradient(90deg,color-mix(in srgb,var(--c-neg) 85%,white),var(--c-neg))}

/* ---- "Ledger" redesign (Reports): the period's own in/out as one
   self-contained card -- same panel treatment .stack-card already
   established, .diverge/.div-in/.div-out above reused as-is. ---- */
.flow-card{background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
.flow-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.flow-label{font-size:11.5px;color:var(--c-text-faint)}
.flow-net{font-family:var(--font-head);font-size:18px;font-variant-numeric:tabular-nums}
.flow-legend{display:flex;justify-content:space-between;font-size:12px}

/* ---- bars ---- */
.bar-list{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:112px 1fr auto;gap:9px;align-items:center;font-size:14.5px}
button.bar-row{width:100%;border:0;background:none;padding:6px 0;min-height:44px;font:inherit;text-align:inherit;cursor:pointer;color:inherit;font-family:inherit}
/* A real icon per category (categoryIcon()) reads at a glance where the
   color-only bar-fill needed a legend to decode -- min-width:0 on both the
   flex container and the text span is what lets text-overflow:ellipsis
   still work one level deeper than before (a flex item's default min-width
   is auto, i.e. "never shrink below content", which would otherwise push
   the icon out of the already-tight 112px column instead of truncating). */
.bar-name{display:flex;align-items:center;gap:5px;min-width:0;color:var(--c-text-soft)}
.bar-name-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.bar-track{height:7px;border-radius:999px;background:var(--c-surface-3);overflow:hidden}
.bar-track.thin{height:5px;margin-top:8px}
/* Every .bar-fill's actual color is set inline (category hex, an
   account's own chosen color, pos/neg) so this can't hue-match a glow the
   way barChart()'s color-mix() trick does without touching every one of
   the several call sites that set it -- an inset top-edge sheen instead,
   same "glossy" language, works identically regardless of the color
   underneath and needs no per-caller change. */
.bar-fill{height:100%;border-radius:999px;background:var(--c-accent);box-shadow:0 1px 0 rgba(255,255,255,.4) inset}
.bar-fill.neg-fill{background:var(--c-neg)}
.bar-fill.pos-fill{background:var(--c-pos)}
.bar-fill.warn-fill{background:var(--c-warn)}
.bar-val{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13.5px}
/* "Ledger" redesign (Reports): this row's share of the list's whole total,
   right after the amount -- explicit color (not inherited) so it doesn't
   also turn tone-neg when .bar-val does for an over-budget row. */
.bar-pct{font-size:10.5px;color:var(--c-text-faint);font-weight:400;margin-inline-start:4px}

/* Overall monthly expense budget (Settings) -- one cap across every
   expense, shown right in "This month" next to the per-category bars
   below it. Plain by default; .near/.over add the same severity-glow
   language (border + box-shadow token) the Needs Attention alerts and
   .cc-stmt already use, so a user who's about to blow their whole
   month's budget gets the same visual weight as any other real alert. */
.overall-budget{margin:14px 0 4px;padding:10px 12px;border-radius:10px;border:1px solid var(--c-line)}
.overall-budget-main{display:flex;align-items:center;gap:14px}
.overall-budget-info{flex:1;min-width:0}
/* Stacked, not the plain label/value side-by-side row this used to be --
   now that it shares its line with the ring (.overall-budget-main), the
   old side-by-side layout squeezed both spans onto too little width and
   the label wrapped mid-word into the amount. */
.overall-budget-row{display:flex;flex-direction:column;gap:2px;font-size:13.5px;color:var(--c-text-soft)}
.overall-budget-amt{font-size:15.5px;font-weight:700;color:var(--c-text);font-variant-numeric:tabular-nums}
.overall-budget.near{border-color:var(--c-warn);box-shadow:var(--glow-warn)}
.overall-budget.over{border-color:var(--c-neg);box-shadow:var(--glow-neg)}
.overall-budget-proj{margin-top:8px;font-size:12.5px;color:var(--c-text-faint)}
.overall-budget-proj.warn{color:var(--c-warn)}
/* The ring itself (ringChart()) is just the two SVG circles -- the % label
   is real HTML overlaid on top via this wrapper, absolutely centering it
   without needing to hand-manage SVG text metrics/baseline at every size
   this might ever render at. */
.ring-wrap{position:relative;flex:none;width:84px;height:84px;display:flex;align-items:center;justify-content:center}
.ring-wrap svg{position:absolute;inset:0}
.ring-label{position:relative;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}

/* ---- events ---- */
.event-list{display:flex;flex-direction:column;gap:2px}
.event-row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--c-line);font-size:14.5px}
.event-dot{width:7px;height:7px;border-radius:999px;flex:none}
.event-dot.pos{background:var(--c-pos)}
.event-dot.neg{background:var(--c-neg)}
.event-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.event-when{color:var(--c-text-faint);font-size:13px;white-space:nowrap}
.event-amt{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;white-space:nowrap}

/* ---- filters ---- */
/* 32 (Transactions Recut): search is its own always-visible row -- the one
   filter reached for without first deciding to "go filter something", so
   it never hides behind the toggle below the way the 4 structural
   dropdowns do. .filters-toggle sits right next to it, not on its own
   line, so reaching either costs the same one glance. */
.tx-search-row{display:flex;gap:8px;margin-bottom:12px}
.tx-search-row .input{flex:1;min-width:0}
.filters-toggle{flex:none;position:relative}
.filter-count{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;
  border-radius:999px;background:var(--c-accent-fill);color:#fff;font-size:10.5px;font-weight:700;
  padding:0 4px;margin-inline-start:4px;vertical-align:middle}
/* The 4 structural dropdowns (type/account/period/category) -- collapsed
   behind .filters-toggle by default (see UI.toggleTxFilters()) -- on
   mobile's narrower 2-col grid these used to sit open, taking 2 full rows
   before a single real transaction was visible. .filters-toggle is itself
   .mobile-only, and this override forces the row back open on desktop
   regardless of the collapsed class, since all 4 already fit in one row
   there and this was never the problem being fixed. */
.filter-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
@media (max-width:640px){ .filter-row{grid-template-columns:1fr 1fr} }
.filter-row.collapsed{display:none}
@media (min-width:781px){ .filter-row.collapsed{display:grid} }
/* "Group similar" checkbox (mobile-only, see UI.toggleGroupTx()) and the
   collapsible group row it turns on. */
.group-tx-toggle{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--c-text-soft);margin:-4px 0 14px;cursor:pointer}
.group-tx-toggle input{width:18px;height:18px;accent-color:var(--c-accent-fill);cursor:pointer}
.tx-group{margin-bottom:8px}
.tx-group-head{display:block;width:100%;text-align:inherit;font:inherit;color:inherit;
  background:var(--c-surface);border:1px solid var(--c-line);border-radius:10px;padding:12px 14px;cursor:pointer;position:relative}
.tx-group-head[aria-expanded="true"]{border-color:var(--c-accent-fill)}
.tx-group-toggle{position:absolute;inset-inline-end:12px;top:12px;font-size:11px;color:var(--c-text-faint)}
.tx-group-members{margin-top:8px;padding-inline-start:14px;border-inline-start:2px solid var(--c-line);
  display:flex;flex-direction:column;gap:8px}
/* Account timeline (UI.renderAccountTimeline) -- one colored dot per
   transaction on a continuous vertical rail, a fast visual read of an
   account's recent trend. The rail is the <ul>'s own inline-start border,
   not a separate absolutely-positioned line -- each <li> just needs to
   punch a dot through it at the right height. Every offset here is
   logical (inline-start), not a physical left/right -- a real bug caught
   in review: a first pass mixed a physical `padding: 0 0 0 15px` with the
   logical border, so in RTL (Arabic) the border flips to the right but
   the padding stayed pinned left, leaving no gutter on the side the rail
   and dots had actually moved to. */
.acc-timeline-wrap{margin-bottom:18px}
.acc-timeline{list-style:none;margin:10px 0 0;padding-inline-start:15px;border-inline-start:2px solid var(--c-line)}
.acc-timeline-item{position:relative;display:flex;align-items:flex-start;gap:10px;padding:9px 0;margin-inline-start:-17px;padding-inline-start:17px}
.acc-timeline-dot{position:absolute;inset-inline-start:11px;top:14px;width:10px;height:10px;border-radius:50%;
  border:2px solid var(--c-surface-2);flex:none}
.acc-timeline-body{flex:1;min-width:0}
.acc-timeline-desc{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-timeline-meta{font-size:12px;color:var(--c-text-faint);margin-top:1px}
.acc-timeline-amt{font-variant-numeric:tabular-nums;font-weight:600;font-size:13.5px;white-space:nowrap;flex:none}
.acc-timeline-more{font-size:12.5px;color:var(--c-text-faint);padding-top:4px;padding-inline-start:32px}
/* To-do list (UI.renderTodos) -- checking a row off is a plain state
   toggle, not a destructive action, so the checkbox+title share one
   clickable <label> (like .group-tx-toggle above) rather than needing a
   separate button. .todo-done fades and strikes through only the title
   -- the due-date/notes/meta lines stay legible so a glance can still
   confirm what was finished and when it was due, the same "muted, not
   hidden" treatment a voided transaction gets elsewhere in this app. */
.todo-check{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer}
.todo-check input{width:19px;height:19px;flex:none;accent-color:var(--c-accent-fill);cursor:pointer}
.todo-done .card-row-title{text-decoration:line-through;color:var(--c-text-faint)}
.todo-done{opacity:.72}
.input{border:1px solid var(--c-line);border-radius:8px;padding:9px 11px;background:var(--c-surface);min-height:44px;width:100%}
/* Every .input (text/number/date/select) relied on the browser's own
   default focus ring -- functional, but the one interactive state in the
   whole system with no piece of this design language on it at all. Not
   gated to dark: a focus ring is an accessibility signal, not a
   decorative glow, so it stays identically legible in both themes,
   same distinction --shadow (universal) vs --glow-* (dark-only) already
   draws elsewhere. :focus-visible so a plain mouse click into a field
   doesn't ring it any more insistently than the browser default already
   would -- keyboard/programmatic focus is what this is really for. */
.input:focus-visible{outline:none;border-color:var(--c-accent-fill);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--c-accent-fill) 22%,transparent)}

/* ---- tables (desktop) / cards (mobile) — fix #2 ---- */
.desktop-only{display:block}
.mobile-only{display:none}
@media (max-width:780px){
  .desktop-only{display:none}
  .mobile-only{display:block}
}
.table-wrap{overflow-x:auto;border:1px solid var(--c-line);border-radius:var(--radius)}
/* Every scrollable container (the desktop table, the category pill row,
   dialogs and the More sheet once their content outgrows max-height)
   still drew the OS's own default scrollbar -- the one piece of chrome
   left that never picked up --c-line. Thin and line-colored in both
   engines; a scrollbar is UI chrome, not a glow candidate, so this is
   unconditional like the focus ring above, not gated to dark. */
.table-wrap, .cat-pill-row, .dialog, .sheet{scrollbar-width:thin;scrollbar-color:var(--c-line) transparent}
.table-wrap::-webkit-scrollbar, .cat-pill-row::-webkit-scrollbar, .dialog::-webkit-scrollbar, .sheet::-webkit-scrollbar{width:8px;height:8px}
.table-wrap::-webkit-scrollbar-track, .cat-pill-row::-webkit-scrollbar-track, .dialog::-webkit-scrollbar-track, .sheet::-webkit-scrollbar-track{background:transparent}
.table-wrap::-webkit-scrollbar-thumb, .cat-pill-row::-webkit-scrollbar-thumb, .dialog::-webkit-scrollbar-thumb, .sheet::-webkit-scrollbar-thumb{background:var(--c-line);border-radius:999px}
.table{width:100%;border-collapse:collapse;font-size:14.5px}
.table th{text-align:start;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--c-text-faint);padding:10px 12px;border-bottom:1px solid var(--c-line);white-space:nowrap}
.table td{padding:9px 12px;border-bottom:1px solid var(--c-line);white-space:nowrap}
.table td.num, .table th.num{text-align:end;font-variant-numeric:tabular-nums;font-weight:600}
.tag{display:inline-flex;font-size:11.5px;padding:2px 9px;border-radius:999px}
.tag-pos{background:var(--c-pos-bg);color:var(--c-pos)}
.tag-neg{background:var(--c-neg-bg);color:var(--c-neg)}
.tag-neu{background:var(--c-surface-3);color:var(--c-text-soft)}

.card-list{display:flex;flex-direction:column;gap:8px}
/* 35 (Transactions Recut): the date-section header UI.txDateGroupLabel()
   builds -- a plain sibling of .card-row inside the same flex .card-list
   (not a wrapper around groups of rows), so the list's own 8px gap already
   spaces it from what's above/below; :first-child drops the extra top
   padding since the very first header IS the list's first child. */
.tx-date-header{font-family:var(--font-head);font-size:12.5px;font-weight:600;color:var(--c-text-faint);
  padding:8px 2px 0;text-transform:uppercase;letter-spacing:.04em;
  display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.tx-date-header:first-child{padding-top:0}
/* "Ledger" redesign: the day's own net total, right-aligned opposite the
   date label -- text-transform/letter-spacing reset back to normal case so
   a real signed number doesn't get stretched like the all-caps date label
   next to it, and font-variant-numeric so amount columns stay tabular. */
.tx-date-net{font-variant-numeric:tabular-nums;text-transform:none;letter-spacing:normal;font-weight:600}
.card-row{border:1px solid var(--c-line);border-radius:10px;padding:12px 14px;background:var(--c-surface)}
.card-row.voided{opacity:.5}
/* ---- swipe-to-reveal (Edit/Delete) -- see initSwipeRows() in ui.js ----
   .swipe-row keeps the plain .card-row's own border/radius/left accent,
   but moves its padding down onto .swipe-content and clips overflow at
   this level, so the sliding content's square corners never poke out past
   the row's own rounded ones. .swipe-actions sits underneath, revealed as
   .swipe-content slides off to the inline-start (never actually moving
   itself -- it's already exactly where the content ends up uncovering). */
.card-row.swipe-row{padding:0;overflow:hidden;position:relative}
.swipe-actions{position:absolute;inset-block:0;inset-inline-end:0;display:flex;width:144px}
.swipe-act{flex:1;border:0;color:#fff;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit}
.swipe-edit{background:var(--c-accent-fill)}
.swipe-delete{background:var(--c-neg)}
.swipe-content{position:relative;background:var(--c-surface-opaque);padding:12px 14px;
  transition:transform .2s ease;touch-action:pan-y}
@media (prefers-reduced-motion:reduce){ .swipe-content{transition:none} }
/* Swipe is a touch gesture -- on a mouse+keyboard desktop the two-button
   panel would just sit there permanently reachable by nothing (no drag,
   and it's already redundant with the same Edit/Delete rowActions() always
   shows below), so hide the whole mechanism above the breakpoint where
   .mobile-only's own cards stop rendering at all. */
@media (min-width:781px){ .swipe-actions{display:none} }
.card-row-top{display:flex;align-items:flex-start;gap:10px}
.card-row-top>div:first-child{flex:1;min-width:0}
.card-row-title{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis}
/* Same categoryColor() the row's own left border already uses, just as a
   small filled badge in front of the description -- the border alone
   only reads as "some category" without a legend; the icon inside says
   which one without needing to look it up. A dark icon stroke (not white)
   is what stays legible across the whole categorical palette -- several
   of its 8 hues (amber, pink) are light enough that white would read as
   washed-out on those specifically, and a dark stroke reads fine on every
   one of them, light or saturated alike. */
.cat-badge{display:inline-flex;align-items:center;justify-content:center;flex:none;
  width:20px;height:20px;border-radius:50%;color:rgba(0,0,0,.72);margin-inline-end:6px;vertical-align:middle}
.card-row-sub{font-size:13px;color:var(--c-text-faint);margin-top:1px}
/* A name inline in a small sub-line (Installments Recut #50/#56) doesn't
   want .link-btn's own 44px tap target -- that's sized for a standalone
   action, not a word inside a sentence of plain text -- so this stays
   deliberately small, the same tradeoff any inline text link makes. */
.inline-link{background:none;border:0;padding:0;font:inherit;color:var(--c-accent-700);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.inline-link:hover{opacity:.8}
.card-row-amt{font-variant-numeric:tabular-nums;font-weight:600;font-size:16.5px;white-space:nowrap}
.card-row-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;color:var(--c-text-soft);margin-top:8px}
/* The one row that's the earliest-ever use of its own category (see
   Engine.firstCategoryUseIds()) -- a light way to notice a spending/
   income habit actually starting. Tinted with the accent color rather
   than the category's own (which .cat-badge/the row's own left-accent
   already carry) -- this badge is about the MOMENT, not the category
   identity, so it reads as its own distinct signal next to those. */
.first-cat-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:999px;
  background:color-mix(in srgb, var(--c-accent-fill) 14%, transparent);
  color:var(--c-accent-fill);font-size:12px;font-weight:600;white-space:nowrap}
.acc-swatch{width:11px;height:11px;border-radius:999px;flex:none;margin-top:3px}
/* 34 (Transactions Recut): one dot per real account behind a transaction
   row (see UI.txSign()'s accColors), inline before the account name in
   .card-row-meta -- a smaller, plain-inline sibling of .acc-swatch above
   rather than that class itself, since .acc-swatch's own margin-top:3px
   is tuned for Accounts' own flex row, not this inline-text context. */
.tx-acc-dot{display:inline-block;width:8px;height:8px;border-radius:999px;margin-inline-end:4px;vertical-align:middle}
.acc-sub{font-size:13px;color:var(--c-text-faint);margin-top:6px}
/* Person avatar/color — same idea as an account's color+card-face swatch,
   just a circle with an initial instead of a card gradient (a person isn't
   a physical card). .person-id wraps the avatar + name/sub as a single
   flex unit so it still lands as .card-row-top's first (flex:1) child. */
.person-id{display:flex;align-items:center;gap:10px;min-width:0}
/* Same bevel language as the card tiles' Holo Shine, lighter touch (no
   backdrop-filter/animated sheen -- a People list can run to dozens of
   rows, same "small/repeated element gets the light version" split
   .bar-fill draws against .chart-bar). color:#fff dropped in favor of
   inherit -- personAvatar() now always sets a real per-person inline
   color (cardTextColor()), which wins over either value regardless
   (inline beats an external rule with no !important either way), but
   inherit here is honest about the fact that this class no longer picks
   the color at all, instead of leaving a value that reads as live but
   is actually always overridden. */
.person-avatar{width:36px;height:36px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:inherit;font-weight:700;font-size:15px;
  border:1px solid rgba(255,255,255,.28);
  box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 -4px 8px -3px rgba(0,0,0,.4) inset}
.person-avatar.sm{width:26px;height:26px;font-size:12px}
.person-avatar.lg{width:52px;height:52px;font-size:22px}
.person-tag{display:inline-flex;align-items:center;gap:3px}

/* ---- People "Ledger" redesign: a status ring around the existing avatar
   (conic-gradient, so a settled person with no --ring-c set just shows the
   plain --c-line track -- no color implies no status to flag) instead of a
   badge stuck on top of it. Wraps .person-avatar rather than replacing it,
   so every existing rule above (including the .sm/.lg size variants) still
   applies unchanged -- this only adds the ring around whatever avatar
   already renders. */
.avatar-ring{display:inline-flex;border-radius:50%;padding:2.5px;flex:none;
  background:conic-gradient(var(--ring-c,var(--c-line)) 100%, var(--c-line) 0)}
.avatar-ring.sm{padding:2px}
.avatar-ring.lg{padding:3px}
/* Small uppercase label under a person's own net amount ("owes you" / "you
   owe" / "settled") -- same role catBar()'s own budget suffix plays
   elsewhere: the number alone already carries sign/color, this just names
   what it means without the reader doing the "positive = ?" translation
   themselves. */
.amt-tag{display:block;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--c-text-faint);font-weight:500;margin-top:2px}

/* ---- Priority strip: a horizontal-scroll ring-avatar row for whoever
   most needs a look right now (overdue, due soon, or simply the largest
   open balance) -- triage before the full list, the same "surface what
   needs attention first" instinct Dashboard's own Needs Attention and
   People's own urgency-sort already share, just given a glanceable visual
   form here instead of a card list. ---- */
/* display:none base + its own @media override below, not a bare
   display:flex relying on .mobile-only's own display:none to hide this at
   desktop widths -- real bug caught in review: two same-specificity class
   selectors (.priority-strip, .mobile-only) fighting over one element's
   display property resolve by SOURCE ORDER, not by which one "means" the
   element hidden -- and .priority-strip's own flex rule sits later in this
   file than .mobile-only's, so it silently won on every viewport, desktop
   included, defeating the .mobile-only class already sitting right next to
   it in the markup. Self-contained like this, .priority-strip never
   depends on winning a tie against another class for its own visibility. */
.priority-strip{display:none;gap:16px;overflow-x:auto;padding:2px 2px 6px}
@media (max-width:780px){ .priority-strip{display:flex} }
.priority-chip{flex:none;width:62px;text-align:center}
.priority-chip .avatar-ring{width:56px;height:56px;margin:0 auto}
.priority-chip .person-avatar{width:100%;height:100%;font-size:20px}
.priority-name{font-size:11px;margin-top:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--c-text-soft)}
.priority-amt{font-family:var(--font-head);font-size:11px;margin-top:1px;font-variant-numeric:tabular-nums}

.sched-list{display:flex;flex-direction:column;gap:4px;margin-top:8px;padding-top:8px;border-top:1px solid var(--c-line)}
.sched-row{display:flex;justify-content:space-between;font-size:13.5px;padding:4px 0;gap:8px}
.sched-row span{white-space:nowrap}
/* Same severity language as the Needs Attention alerts, at a lighter
   touch (a colored left border + the existing box-shadow glow tokens,
   no backdrop-filter) since a schedule can run to a dozen-plus rows --
   box-shadow is cheap, blur isn't, same reasoning the shared blur list
   elsewhere already applies. Paid gets the border only, no glow/pulse --
   that's "done, good," not something that needs to keep drawing the eye
   the way an actually-late row does. */
.sched-row.status-overdue{border-inline-start:3px solid var(--c-neg);padding-inline-start:8px;
  box-shadow:var(--glow-neg);animation:pulseGlowNeg 2.6s ease-in-out infinite}
.sched-row.status-overdue .sched-status{color:var(--c-neg)}
@media (prefers-reduced-motion: reduce){ .sched-row.status-overdue{animation:none} }
.sched-row.status-paid{border-inline-start:3px solid var(--c-pos);padding-inline-start:8px}
.sched-row.status-paid .sched-status{color:var(--c-pos)}
.sched-row.mine{font-weight:600}

.pill-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.pill{border:1px solid var(--c-line);background:var(--c-surface);border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer;min-height:44px}
.pill.on{background:var(--c-accent-fill);border-color:var(--c-accent-fill);color:#fff}
/* Tag chip -- JS (UI.tagStyle) sets only --tag-h (a 0-360 hue hashed from
   the tag's own text); lightness/saturation live here so dark mode can
   step them down the same way every other status/chip color in this app
   already does, instead of a fixed pastel fighting the dark palette. */
.tag-chip{background:hsl(var(--tag-h) 55% 92%);color:hsl(var(--tag-h) 40% 28%);border-color:transparent}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .tag-chip{background:hsl(var(--tag-h) 40% 22%);color:hsl(var(--tag-h) 65% 80%)}
}
:root[data-theme="dark"] .tag-chip{background:hsl(var(--tag-h) 40% 22%);color:hsl(var(--tag-h) 65% 80%)}
.proj-bar{height:8px;border-radius:999px;background:var(--c-surface-3);overflow:hidden;margin-top:14px}
.proj-fill{height:100%}

.chart-cols{display:flex;align-items:flex-end;gap:10px;height:120px;padding:0 4px 4px}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.chart-bar{width:70%;border-radius:6px 6px 0 0;min-height:4px;cursor:pointer}
/* role="button" on a plain div (see barChart()) needs its own visible
   focus state -- same treatment as .input:focus-visible above. */
.chart-bar:focus-visible{outline:2px solid var(--c-accent-fill);outline-offset:2px}
.chart-label{font-size:12px;color:var(--c-text-faint);margin-top:6px}

/* #chartTooltip is a fixed-position sibling of #root (see the HTML comment
   at its mount point) so UI.showChartTooltip() can place it over any chart
   without a render() ever touching it. Positioned via inline left/top set
   in JS; z-index sits above .dialog (51) since a chart can theoretically
   render inside a sheet/dialog context too. */
.chart-tooltip{position:fixed;z-index:55;pointer-events:none;opacity:0;transform:translateY(4px) scale(.94);
  transition:opacity .18s ease,transform .18s ease;background:#1a1714;color:#fff;
  font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:8px;white-space:nowrap;
  box-shadow:0 6px 16px -4px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.12)}
.chart-tooltip.show{opacity:1;transform:translateY(0) scale(1)}
@media (prefers-reduced-motion:reduce){.chart-tooltip{transition:opacity .01s linear}}

.rules-list{display:flex;flex-direction:column;gap:10px}
.rule-row{padding:10px 0;border-bottom:1px solid var(--c-line)}
.rule-k{font-weight:600;font-size:14.5px}
.rule-v{font-size:14px;color:var(--c-text-soft);margin-top:2px}
.audit-list{display:flex;flex-direction:column;gap:2px;font-size:14px}
.audit-row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--c-line);color:var(--c-text-soft)}

/* ---- primary nav — fix #1: 5 fixed tabs + More sheet ---- */
.primary-nav{position:fixed;inset-inline:0;bottom:0;z-index:40;display:flex;background:var(--c-surface);
  border-top:1px solid var(--c-line);box-shadow:0 -4px 16px rgba(0,0,0,.06);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;
  padding:7px 2px;border-radius:10px;color:var(--c-text-soft);min-height:52px;cursor:pointer;position:relative}
.navbtn span{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
/* Approved from the Next Wave preview -- a soft halo behind the active
   tab, so switching tabs reads as more than a text-color change without
   needing to track and animate a sliding indicator's pixel position
   across a variable-width, RTL-flippable flex row (real fragility for a
   cosmetic win). ::before sits behind the icon/label (z-index:-1 inside
   .navbtn's own stacking context from position:relative above), low
   enough opacity to read as a soft chip highlight rather than neon, so
   unlike --glow-1/--glow-neg/--glow-warn this one isn't dark-gated. */
.navbtn.on{color:var(--c-accent-fill)}
.navbtn.on::before{content:"";position:absolute;inset:2px 6px;border-radius:12px;z-index:-1;
  background:radial-gradient(65% 90% at 50% 28%, color-mix(in srgb,var(--c-accent-fill) 20%,transparent), transparent 75%)}

/* Vivid icons -- each section keeps its own fixed hue (drawn from the same
   aurora family as the rest of the glass system), instead of every icon
   sharing one flat currentColor, so the nav reads as vivid rather than a
   monochrome strip. .nav-ico wraps svgIcon()'s own <svg fill="none"
   stroke="currentColor">, so setting color here is enough -- no icon
   markup to touch, and it applies identically in the mobile bottom bar,
   the desktop sidebar and the More sheet grid since all three reuse the
   same wrapper. Each icon keeps its own color even on the active tab (the
   button/label around it still gets the usual on-state treatment) -- a
   colorless active icon would read as "this tab lost its color," not
   "selected."
   Two hue sets, not one -- these are the base (light-theme) values: darker,
   more saturated versions so they clear the ~3:1 graphical-object contrast
   floor against the light glass nav bar (~#f8f7f7 composited). Real bug
   caught in review: the first pass used one pale-neon set for both themes
   -- correct against the dark aurora background they were tuned for, but
   several (.nav-ico-goals' mint, .nav-ico-settings' pale slate) measured
   under 1.5:1 against a light surface, effectively invisible. Dark theme
   overrides every one of these below to the brighter, glow-friendly neon
   version -- same two-block pattern (@media + [data-theme]) every other
   themed token in this file already uses. Glow itself stays dark-only
   (--glow-1 is empty in light) so these read as neon at night and as
   plain saturated color by day, not a smudged shadow on a white surface. */
.nav-ico{display:inline-flex;filter:var(--glow-1)}
.nav-ico-dashboard{color:#0e7490}
.nav-ico-accounts{color:#6d28d9}
.nav-ico-transactions{color:#b45309}
.nav-ico-people{color:#be185d}
.nav-ico-installments{color:#0f766e}
.nav-ico-statements{color:#a16207}
.nav-ico-goals{color:#15803d}
.nav-ico-groups{color:#4338ca}
.nav-ico-ledgers{color:#be123c}
.nav-ico-investments{color:#0369a1}
.nav-ico-recurring{color:#c2410c}
.nav-ico-forecast{color:#a21caf}
.nav-ico-reports{color:#1d4ed8}
.nav-ico-cashflow{color:#047857}
.nav-ico-settings{color:#475569}
.nav-ico-more{color:#6d28d9}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .nav-ico-dashboard{color:#67e8f9}
  :root:not([data-theme="light"]) .nav-ico-accounts{color:#a78bfa}
  :root:not([data-theme="light"]) .nav-ico-transactions{color:#fbbf24}
  :root:not([data-theme="light"]) .nav-ico-people{color:#f472b6}
  :root:not([data-theme="light"]) .nav-ico-installments{color:#2dd4bf}
  :root:not([data-theme="light"]) .nav-ico-statements{color:#eab308}
  :root:not([data-theme="light"]) .nav-ico-goals{color:#86efac}
  :root:not([data-theme="light"]) .nav-ico-groups{color:#818cf8}
  :root:not([data-theme="light"]) .nav-ico-ledgers{color:#fb7185}
  :root:not([data-theme="light"]) .nav-ico-investments{color:#38bdf8}
  :root:not([data-theme="light"]) .nav-ico-recurring{color:#fb923c}
  :root:not([data-theme="light"]) .nav-ico-forecast{color:#e879f9}
  :root:not([data-theme="light"]) .nav-ico-reports{color:#60a5fa}
  :root:not([data-theme="light"]) .nav-ico-cashflow{color:#34d399}
  :root:not([data-theme="light"]) .nav-ico-settings{color:#cbd5e1}
  :root:not([data-theme="light"]) .nav-ico-more{color:#c4b5fd}
}
:root[data-theme="dark"] .nav-ico-dashboard{color:#67e8f9}
:root[data-theme="dark"] .nav-ico-accounts{color:#a78bfa}
:root[data-theme="dark"] .nav-ico-transactions{color:#fbbf24}
:root[data-theme="dark"] .nav-ico-people{color:#f472b6}
:root[data-theme="dark"] .nav-ico-installments{color:#2dd4bf}
:root[data-theme="dark"] .nav-ico-statements{color:#eab308}
:root[data-theme="dark"] .nav-ico-goals{color:#86efac}
:root[data-theme="dark"] .nav-ico-groups{color:#818cf8}
:root[data-theme="dark"] .nav-ico-ledgers{color:#fb7185}
:root[data-theme="dark"] .nav-ico-investments{color:#38bdf8}
:root[data-theme="dark"] .nav-ico-recurring{color:#fb923c}
:root[data-theme="dark"] .nav-ico-forecast{color:#e879f9}
:root[data-theme="dark"] .nav-ico-reports{color:#60a5fa}
:root[data-theme="dark"] .nav-ico-cashflow{color:#34d399}
:root[data-theme="dark"] .nav-ico-settings{color:#cbd5e1}
:root[data-theme="dark"] .nav-ico-more{color:#c4b5fd}
/* Quick-add sheet icons (expense/income/transfer) -- unlike the fixed-hue
   set above, these carry real meaning (the same pos/neg semantics as an
   amount's own tone-pos/tone-neg), so they take the theme-aware --c-pos/
   --c-neg tokens directly instead of a hardcoded hue pair, and need no
   separate dark-mode block. */
.nav-ico-expense{color:var(--c-neg)}
.nav-ico-income{color:var(--c-pos)}
.nav-ico-transfer{color:var(--c-accent-fill)}
@media (min-width:900px) and (pointer:fine){
  .shell{flex-direction:row;padding-bottom:0}
  .primary-nav{position:sticky;top:0;inset-inline:auto;bottom:auto;flex-direction:column;width:196px;flex:none;height:100vh;
    border-top:0;border-inline-end:1px solid var(--c-line);box-shadow:none;padding:14px 8px;gap:2px}
  .navbtn{flex:none;flex-direction:row;justify-content:flex-start;padding:9px 12px;gap:10px;min-height:44px}
  .navbtn span{font-size:14px}
  .navbtn.on{background:var(--c-accent-fill);color:#fff}
  /* The mobile bar's radial halo (::before, above) is redundant once .on
     already fills solid here -- turn it off rather than leave dead paint
     work behind an opaque background. */
  .navbtn.on::before{background:none}
  /* Real bug caught in review: .nav-ico-* sets color directly on the icon's
     own <span>, which is MORE specific than inherited color -- so on this
     solid active-tab fill, the icon kept its own fixed hue instead of
     picking up the white .navbtn.on{color:#fff} above, going near-
     invisible against a background chosen to contrast with white text, not
     with that icon's own color. .navbtn.on .nav-ico (3 classes) outranks
     any single .nav-ico-* class (1 class) regardless of source order, so
     this reliably wins. Selected-and-vivid isn't a real option here (the
     mobile bottom bar and the More sheet already carry "vivid" -- this is
     the one place a plain, unmistakable "selected" state matters more).
     Glow is switched off too, for the same reason: a bright icon on a
     bright fill doesn't need it and it just muddies the edge. */
  .navbtn.on .nav-ico{color:#fff;filter:none}
  .main-col .topbar,.main-col .metrics-row{position:sticky;top:0;z-index:30}
  .main-col .metrics-row{top:57px}
  .page{padding-bottom:40px}
}

/* ---- More sheet ---- */
.sheet-backdrop{position:fixed;inset:0;background:rgba(20,18,17,.4);z-index:45}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:46;background:var(--c-surface);border-radius:16px 16px 0 0;
  border:1px solid var(--c-line);border-bottom:0;
  padding:10px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.2);max-height:70vh;overflow:auto}
.sheet-handle{width:36px;height:4px;border-radius:999px;background:var(--c-line);margin:0 auto 12px}
.sheet-title{font-family:var(--font-head);font-size:16.5px;margin-bottom:12px}
.sheet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sheet-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:12px;
  border:1px solid var(--c-line);background:var(--c-surface-2);color:var(--c-text-soft);cursor:pointer;min-height:76px}
.sheet-item.on{color:var(--c-accent-fill);border-color:var(--c-accent-fill)}
.sheet-item span{font-size:12.5px;text-align:center}
/* 31 (Transactions Recut): a vertical list variant of the sheet's own
   items, for UI.renderTxActionSheet() -- a row of icon+label per action
   (Edit/reverse/Duplicate/Delete) rather than .sheet-grid's 3-across tile
   layout, which reads as "pick one of several destinations" and isn't
   right for "pick one thing to do to the row you were just looking at". */
.sheet-actions{display:flex;flex-direction:column;gap:2px}
.sheet-action{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:none;border:0;
  padding:11px 4px;border-radius:10px;font:inherit;font-size:15px;color:inherit;cursor:pointer;min-height:44px;
  /* "reverse"/"reversed" (see app.L() calls -- their EN default text is
     lowercase to match the existing plain-link convention this replaces),
     sitting next to "Edit"/"Duplicate"/"Delete" here, read inconsistent in
     a proper action-sheet list the way they didn't as small inline links.
     text-transform, not touching the JS strings or the Arabic ARW entries
     this reads through app.L(): capitalize() has no effect on Arabic
     script (no case concept) and is a no-op on the already-capitalized
     English labels. */
  text-transform:capitalize}
.sheet-action:disabled{color:var(--c-text-faint);cursor:default}
.sheet-action.danger{color:var(--c-neg)}
.sheet-action-ico{flex:none;display:flex;color:var(--c-text-faint)}
.sheet-action.danger .sheet-action-ico{color:var(--c-neg)}
@media (min-width:900px) and (pointer:fine){
  .sheet{inset-inline:auto;bottom:auto;top:60px;inset-inline-start:210px;width:280px;border-radius:12px;max-height:80vh}
}

/* ---- modal ---- */
.dialog{position:fixed;inset-inline:12px;top:50%;transform:translateY(-50%);z-index:51;background:var(--c-surface);
  border:1px solid var(--c-line);
  border-radius:14px;padding:20px;max-width:480px;margin-inline:auto;max-height:88vh;overflow:auto;box-shadow:var(--shadow)}
.dialog-title{font-family:var(--font-head);font-size:21px;margin-bottom:12px}
.dialog-err{background:var(--c-neg-bg);color:var(--c-neg);padding:9px 12px;border-radius:8px;font-size:14.5px;margin-bottom:10px}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* min-width:0 -- a grid/flex item's default min-width is auto (its own
   content's intrinsic size), not 0, so a field whose content can run
   wide (the category picker's un-wrapped pill row, its own overflow-x:
   auto is exactly why) would otherwise force this track -- and the whole
   dialog with it -- to grow to fit that content instead of actually
   scrolling inside .cat-pill-row's own box. Real bug caught after the
   category picker shipped: every category, however many the user has
   added, ended up laid out in one line stretching the whole entry form
   wide, .cat-pill-row's overflow-x:auto never getting the chance to
   kick in. Safe as a general rule for every field, not just this one --
   an .input/.select doesn't need its intrinsic width to win over its
   grid track either. */
.field{display:flex;flex-direction:column;gap:4px;font-size:14px;min-width:0}
.field.wide{grid-column:1 / -1}
.field-label{color:var(--c-text-soft)}
.field-hint{font-size:12.5px;color:var(--c-text-faint)}
/* Preset swatches -- every color field (account/card color, its new
   secondary color, a person's avatar color) gets this row in front of the
   plain native <input type="color"> that was already there, which stays
   and still works exactly as before -- clicking a swatch just sets that
   same input's value (UI.setColorField), so submit()'s FormData read is
   completely unaffected by which path set it. */
.swatch-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.swatch-btn{width:26px;height:26px;border-radius:7px;border:1px solid rgba(0,0,0,.12);cursor:pointer;padding:0;flex:none}
.swatch-btn:hover{transform:scale(1.08)}
/* Category icon picker (category_edit's own "icon" field, see ICON_PICKER
   in ui.js) -- same swatch-row shape as the color picker just above, a
   plain hidden input behind it holding the real value (UI.setIconField).
   Resting state is a neutral circle (not yet tinted to the category's own
   color -- that only ever shows once the category is actually drawn
   elsewhere, keeping this picker simple); .on marks which one is picked,
   since a hidden input's value alone shows nothing. */
.icon-swatch-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.icon-swatch{width:34px;height:34px;border-radius:50%;border:2px solid transparent;background:var(--c-surface-2);color:var(--c-text-soft);cursor:pointer;padding:0;flex:none;display:flex;align-items:center;justify-content:center}
.icon-swatch:hover{transform:scale(1.06)}
.icon-swatch.on{border-color:var(--c-accent);color:var(--c-accent);background:var(--c-surface-3)}
/* Vivid category picker -- a --pill-c custom property per button (each
   category's own categoryColor(), a CSS var reference like var(--cat-3))
   drives both the tinted background and the small color dot, same
   color-mix() trick the trend charts use so this needed no new per-hue
   tokens. Horizontal scroll, not wrap -- a user's own category list is
   unbounded (Settings lets them add more), unlike the fixed 24-swatch
   palette above. */
.cat-pill-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:4px;-webkit-overflow-scrolling:touch}
.cat-pill{flex:none;display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;
  border-radius:999px;padding:7px 13px;font-size:13px;min-height:36px;color:var(--c-text);
  border:1.5px solid color-mix(in srgb,var(--pill-c) 50%,transparent);
  background:color-mix(in srgb,var(--pill-c) 16%,transparent)}
.cat-pill::before{content:"";display:inline-block;width:8px;height:8px;border-radius:999px;background:var(--pill-c);flex:none}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
@media (max-width:480px){ .field-grid{grid-template-columns:1fr} }

/* Approved from the Next Wave preview -- was plain fading text; #savedFlash
   (the outer div JS toggles opacity on, unchanged) now just centers a real
   glass pill instead of being the visible thing itself, with a check icon
   and the same success-glow token .cc-stmt/.alert-card's family already
   established (empty in light -- a plain surface/border pill still reads
   fine there without the glow). */
/* #flashStack (the real element this mounts to, a sibling of #root -- see
   its own comment there) is now just a positioning column, always
   "visible": each .flash-pill inside it owns its own show/hide instead of
   the whole container fading as a single unit, so several queued in a
   row (UI.flash()) actually stack -- newest appended last, at the
   anchored bottom edge, earlier ones pushed upward as it grows. */
/* z-index:42, above .fab's 41 -- a real bug caught by the regression suite:
   the danger pill's max-width:min(92vw,380px) (below) spans wide enough on
   a narrow phone to reach the same bottom-end corner the FAB occupies, and
   .fab sat on top of it at the old z-index:20, physically blocking its own
   dismiss button. The plain auto-dismissing pills stay pointer-events:none
   (below) so raising this doesn't make them start blocking the FAB either
   -- only the danger pill re-enables pointer-events on itself, and that's
   exactly the one that must never be unreachable. */

.flash-pill-exit{opacity:0;transform:translateY(-6px) scale(.96)}

   re-enables pointer-events on itself specifically, since .flash's own

<script>// Personal CFO — core ledger engine, ported faithfully from the original app's

  // ---- app lock (Settings -> App lock) -------------------------------

    // on any open receivable outside a plan — not only an overdue one.
    n += Object.values(D.recv).filter((v) => v > 0).length;

    const stmtSoon = this.iso(this.addDays(new Date(), 7));

    // one nudge across every expense, same 90%-before-it's-over threshold
    // as a per-category budget.
    const overallBudget = this.state.data.overallBudget || 0;

    n += this.dueSoonTodos().length;

  // the stored data's shape changes in a way old code genuinely can't
  // read (not for every small addition -- new fields old code just
  // ignores are fine under the same key) -- and push the value it's
  // replacing onto the FRONT of legacyStorageKeys() below (newest first).

  // bug load() used to have before loadError existed: every existing

  // now migrateOrLoad() finds it under the old key instead and carries it
  // forward, the first time this build runs for them.

  // e.g. return ["pcfo.v7"]; the day storageKey() above becomes "pcfo.v8".
  legacyStorageKeys() { return []; }

  // stored yet -- raw is simply null) and someone whose real saved data
  // just failed to load (corrupted JSON, or localStorage itself throwing)
  // used to be treated identically -- both silently fell back to seed()'s
  // demo data, so an actual load failure looked exactly like a fresh
  // install, with no way to tell the difference and no chance to recover
  // the raw string before it's overwritten by the very next persist().

  // surfaces it (same pattern as saveError) rather than silently handing
  // back someone's real financial history as if it never existed.
  // Reads one stored key and, if it parses, returns the data -- otherwise
