<style>
:root{
  --c-bg:#f3f2f2; --c-surface:#ffffff; --c-surface-2:#f8f4f4; --c-surface-3:#eae7e7;
  /* P1 fix: was #7d7979, which measures 3.55–3.94:1 on white/bg — fails
     WCAG AA (4.5:1) for the small caption/label text it's used on
     everywhere ("AVAILABLE", "I OWE", dates). #5a5656 keeps the same warm
     neutral hue but clears AA with margin (7.2:1 on white, 6.5:1 on bg). */
  --c-text:#201e1d; --c-text-soft:#605d5d; --c-text-faint:#5a5656;
  --c-line:color-mix(in srgb, #201e1d 14%, transparent);
  --c-accent:#0088b0; --c-accent-700:#006786; --c-accent-800:#004961; --c-accent-900:#0a303e;
  /* P1 fix: solid-fill interactive elements (primary button, active nav,
     selected pill) use this instead of --c-accent directly — white text on
     #0088b0 measures 4.08:1 and fails AA for normal-size text; on #006786
     it's 6.4:1. Fixed across both themes since it's dark enough to hold up
     on either background. */
  --c-accent-fill:#006786;
  --c-accent2:#d6006c; --c-accent2-700:#aa0b56; --c-accent2-100:#fff1f4;
  --c-pos:#006786; --c-pos-bg:#e9f8ff; --c-neg:#aa0b56; --c-neg-bg:#fff1f4;
  --font-head:'Source Serif 4', Georgia, 'Noto Serif Arabic', serif;
  --font-body:'Source Serif 4', Georgia, 'Noto Serif Arabic', system-ui, sans-serif;
  --radius:10px; --shadow: 0 1px 2px rgba(32,30,29,.06), 0 6px 20px -10px rgba(32,30,29,.22);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --c-bg:#17191a; --c-surface:#202324; --c-surface-2:#262a2b; --c-surface-3:#2e3233;
    --c-text:#efeeec; --c-text-soft:#b7b3b0; --c-text-faint:#9a9694;
    --c-line:color-mix(in srgb, #efeeec 16%, transparent);
    --c-accent:#39b6db; --c-accent-700:#7fd0ea; --c-accent-800:#a8def0; --c-accent-900:#0a303e;
    --c-accent-fill:#006786;
    --c-accent2:#ff6fa8; --c-accent2-700:#ff9ac1; --c-accent2-100:#3a1523;
    --c-pos:#5fd0ee; --c-pos-bg:#12303a; --c-neg:#ff9ac1; --c-neg-bg:#3a1523;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px -10px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --c-bg:#17191a; --c-surface:#202324; --c-surface-2:#262a2b; --c-surface-3:#2e3233;
  --c-text:#efeeec; --c-text-soft:#b7b3b0; --c-text-faint:#9a9694;
  --c-line:color-mix(in srgb, #efeeec 16%, transparent);
  --c-accent:#39b6db; --c-accent-700:#7fd0ea; --c-accent-800:#a8def0; --c-accent-900:#0a303e;
  --c-accent-fill:#006786;
  --c-accent2:#ff6fa8; --c-accent2-700:#ff9ac1; --c-accent2-100:#3a1523;
  --c-pos:#5fd0ee; --c-pos-bg:#12303a; --c-neg:#ff9ac1; --c-neg-bg:#3a1523;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px -10px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
body{margin:0;background:var(--c-bg);color:var(--c-text);font-family:var(--font-body)}
#root{font-family:var(--font-body);color:var(--c-text);background:var(--c-bg);min-height:100vh}
.shell{display:flex;flex-direction:column;min-height:100vh;padding-bottom:70px}
.main-col{flex:1;min-width:0}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-head);font-weight:600;margin:0;text-wrap:balance}
.muted{color:var(--c-text-soft)}
.small{font-size:12.5px}
.tone-pos{color:var(--c-pos)}
.tone-neg{color:var(--c-neg)}
.tone-neu{color:var(--c-text)}
.muted-amt{color:var(--c-text-faint)}
:focus-visible{outline:2px solid var(--c-accent);outline-offset:2px}

/* ---- topbar ---- */
.topbar{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--c-line);
  position:sticky;top:0;z-index:30;background:color-mix(in srgb, var(--c-bg) 90%, transparent);backdrop-filter:blur(8px);
  flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px}
.brand-mark{width:30px;height:30px;border-radius:999px;background:var(--c-accent-fill);color:#fff;
  display:grid;place-items:center;font-family:var(--font-head);font-size:15px;flex:none}
.brand-name{font-family:var(--font-head);font-size:15.5px;line-height:1.1}
.brand-sub{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--c-text-faint)}
.topbar-tools{display:flex;align-items:center;gap:8px;margin-inline-start:auto;flex-wrap:wrap}

.seg{display:flex;border:1px solid var(--c-line);border-radius:999px;padding:2px;background:var(--c-surface-2)}
.seg-opt{position:relative;padding:5px 14px;border-radius:999px;font-size:12px;cursor:pointer;display:flex;align-items:center;min-height:44px;min-width:44px;justify-content:center}
.seg-opt input{position:absolute;opacity:0}
.seg-opt:has(input:checked){background:var(--c-accent-fill);color:#fff}

.btn{border:1px solid var(--c-line);border-radius:999px;padding:8px 15px;background:var(--c-surface-2);
  cursor:pointer;font-size:13px;min-height:44px;white-space:nowrap}
.btn.small{min-height:44px;padding:7px 13px;font-size:12.5px}
.btn.block{width:100%;margin-top:10px}
.btn-primary{background:var(--c-accent-fill);border-color:var(--c-accent-fill);color:#fff;font-weight:600}
.btn-secondary{background:var(--c-surface-2)}
.btn-ghost{background:transparent}
.btn-danger{background:var(--c-neg-bg);border-color:var(--c-neg);color:var(--c-neg)}
.btn-row{display:flex;gap:8px}
.btn-row.wrap{flex-wrap:wrap}

    };
    if (this.state.lang === "ar") {
      Object.keys(F).forEach(k => {
        const g = F[k]; g.title = this.ARW[g.title] || g.title;

  open(kind, pre) {

    const form = { date: this.today(), freq: "monthly", count: 12, down: 0, balloon: 0, type: kind === "recurring" ? "expense" : undefined, day: 1 };
    F.fields.forEach(f => { if (form[f.k] === undefined) form[f.k] = f.type === "select" ? (f.options[0] ? f.options[0].v : "") : (f.type === "number" ? "" : ""); });
    form.date = this.today();
    this.state.modal = kind; this.state.form = Object.assign(form, pre || {}); this.state.err = "";

  submit() {
    const k = this.state.modal, f = this.state.form, d = this.state.data, N = (x) => this.n(f[x]);
    const data = JSON.parse(JSON.stringify(d));
    const push = (o) => data.tx.push(Object.assign({ id: this.uid("t"), created: new Date().toISOString(), void: false }, o));
    const need = (cond, msg) => { if (!cond) { this.state.err = msg; return false; } return true; };
    let note = "";
    if (["income", "expense", "receivable", "payable", "receivable_payment", "debt_payment"].includes(k)) {
      if (!need(N("amount") > 0, "Amount must be greater than zero.")) return false;
      if (["receivable", "payable", "receivable_payment", "debt_payment"].includes(k) && !need(f.personId, "Pick a person.")) return false;
      push({ date: f.date, type: k, amount: N("amount"), accountId: f.accountId || null, fromId: null, toId: null, category: f.category || null, personId: f.personId || null, desc: f.desc || this.FORMS()[k].title, due: f.due || null });

      push({ date: f.date, type: "investment_buy", amount: N("invested"), accountId: f.accountId || null, category: f.type, desc: "Invested — " + f.name, investmentId: id });
      note = "Investment " + f.name;
    } else if (k === "invest_update") {
      const iv = data.investments.find(i => i.id === f.investmentId);
      if (!need(iv, "Pick an investment.")) return false;
      iv.value = N("value"); note = "Revalued " + iv.name + " to " + this.fmt(iv.value);
    } else if (k === "person") {
      if (!need(f.name, "Name is required.")) return false;
      data.people.push({ id: this.uid("p"), name: f.name, phone: f.phone || "", notes: f.notes || "" }); note = "Added person " + f.name;
    } else if (k === "person_edit") {
      if (!need(f.name, "Name is required.")) return false;
      const p = data.people.find(x => x.id === f.id);
      if (!need(p, "Pick a person.")) return false;
      p.name = f.name; p.phone = f.phone || ""; p.notes = f.notes || ""; note = "Updated person " + f.name;
    } else if (k === "account") {
      if (!need(f.name, "Name is required.")) return false;
      data.accounts.push({ id: this.uid("a"), name: f.name, type: f.type, bank: f.bank || "", limit: N("limit"), opening: N("opening"), color: f.type === "card" ? "#004961" : "#7d7979", active: true, desc: f.desc || "" });
      note = "Added account " + f.name;
    } else if (k === "account_edit") {
      if (!need(f.name, "Name is required.")) return false;
      const a = data.accounts.find(x => x.id === f.id);
      if (!need(a, "Pick an account.")) return false;
      a.name = f.name; a.bank = f.bank || ""; if (a.type === "card") a.limit = N("limit"); a.desc = f.desc || ""; note = "Updated account " + f.name;
    } else if (k === "card") {

      if (!need(N("limit") > 0, "A credit card needs a limit.")) return false;

      data.accounts.push({ id: this.uid("card"), name: f.name || "Credit card", type: "card", bank: f.bank || "", limit: N("limit"), opening: -Math.abs(N("opening")), color: "#004961", active: true, desc: f.desc || "" });
      note = "Added credit card " + (f.bank ? f.bank + " " : "") + (f.name || "");
    } else if (k === "group") {
      const amt = N("amount"), per = Math.round(N("periods")), turn = Math.round(N("myTurn"));

      if (!need(per >= 2, "A group needs at least two periods.")) return false;

      data.groups = (data.groups || []).concat([{ id: this.uid("g"), name: f.name || "Savings group", amount: amt, periods: per, myTurn: turn, freq: f.freq || "monthly", first: f.first || f.date, accountId: f.accountId }]);
      note = "Savings group " + (f.name || "") + " · " + this.fmt(amt) + " × " + per;
    } else if (k === "group_payment" || k === "group_payout") {
      if (!need(N("amount") > 0, "Amount must be greater than zero.")) return false;
      const g = (data.groups || []).find(x => x.id === f.groupId);

      if (k === "group_payment") { const st = this.groupState(g); if (!need(N("amount") <= st.remainingPay + 0.001, "That is more than the " + this.fmt(st.remainingPay) + " left to pay into this group.")) return false; }

      note = (k === "group_payment" ? "Gam3ya contribution " : "Gam3ya payout ") + this.fmt(N("amount")) + " · " + g.name;
    } else if (k === "recurring") {
      if (!need(f.name && this.n(f.amount) > 0, "Name and amount are required.")) return false;
      data.recurring.push({ id: this.uid("r"), name: f.name, type: f.type, amount: N("amount"), accountId: f.accountId, category: f.category, freq: f.freq, day: Math.max(1, Math.min(28, Math.round(N("day")) || 1)) });

    }
    this.state.modal = null; this.state.err = "";
    this.persist(data, note);

  }
  personHasRecords(id) {

  }
  reverse(id) {
    const data = JSON.parse(JSON.stringify(this.state.data));
    const t = data.tx.find(x => x.id === id); if (!t) return;

    t.void = true;
    data.tx.push(Object.assign({}, t, { id: this.uid("t"), void: false, reversalOf: id, type: "reversal_marker", amount: 0, desc: "Reversed: " + (t.desc || t.type), created: new Date().toISOString() }));

  }

    const data = JSON.parse(JSON.stringify(this.state.data));
    data.tx.push({ id: this.uid("t"), date: this.today(), type: r.type, amount: r.amount, accountId: r.accountId, category: r.category, personId: null, desc: r.name + " (recurring)", void: false, created: new Date().toISOString(), recurringId: r.id });
    this.persist(data, "Posted recurring " + r.name);
  }
}

<script>
/* Personal CFO — presentation layer (rebuilt).
   Fixes the 5 agreed P0 mobile issues only:
   1) primary nav (5 fixed tabs) + a "More" sheet, instead of a 12-item
      horizontally-scrolling strip with no affordance
   2) responsive card rows instead of a table with a second horizontal
      scrollbar, on every data-heavy tab
   3) no manifest/service-worker registration that silently fails
   4) Transactions is paginated (25 at a time) instead of rendering ~180
      rows into the DOM at once
   5) Dashboard shows the 5 headline numbers once, and "Needs attention"
      is promoted right under the hero instead of ~3 screens down
   Everything else (business logic, labels, even known P1 quirks like the
   Installments KPI only counting money owed *to* the user) is preserved
   as-is on purpose — those are separate, already-scoped follow-up items. */

function esc(s) {
  return String(s === undefined || s === null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function svgIcon(d, size) {
  size = size || 16;
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + d + '"></path></svg>';
}

const UI = {
  app: null,
  init(engine) {
    this.app = engine;
    this.app.load();
    window.addEventListener("resize", () => {});
    this.render();
  },

  // ---- generic actions ---------------------------------------------------
  setPage(p) { this.app.state.page = p; this.app.state.moreOpen = false; this.app.state.txVisible = 25; this.render(); window.scrollTo({ top: 0 }); },
  toggleMore() { this.app.state.moreOpen = !this.app.state.moreOpen; this.render(); },
  setLang(l) { this.app.state.lang = l; this.render(); },
  togglePrivacy() { this.app.state.privacy = !this.app.state.privacy; this.render(); },
  openModal(kind, pre) { this.app.open(kind, pre); this.render(); },
  closeModal() { this.app.state.modal = null; this.app.state.err = ""; this.render(); },
  submitModal() {
    const modalEl = document.getElementById("modalForm");
    if (modalEl) {
      const fd = new FormData(modalEl);
      for (const [k, v] of fd.entries()) this.app.state.form[k] = v;
    }
    const ok = this.app.submit();
    this.render();
    if (ok) this.flash();
  },
  flash() {
    const el = document.getElementById("savedFlash");
    if (!el) return;
    el.style.opacity = "1";
    clearTimeout(this._flashT);
    this._flashT = setTimeout(() => { el.style.opacity = "0"; }, 1800);
  },
  loadMoreTx() { this.app.state.txVisible += 25; this.render(true); },
  setFilter(k, v) { this.app.state.filt[k] = v; this.app.state.txVisible = 25; this.render(true); },
  reverseTx(id) { this.app.reverse(id); this.render(); },
  deletePersonC(id) {
    if (!this.app.personHasRecords(id) && confirm(this.app.L("Delete ") + this.app.personName(id) + "?")) { this.app.deletePerson(id); this.render(); }
  },
  postRecurringC(id) {
    const r = this.app.state.data.recurring.find(x => x.id === id); if (!r) return;
    this.app.postRecurring(r); this.render();
  },
  setHorizon(h) { this.app.state.horizon = Number(h); this.render(); },
  togglePlanRows(id) { this.app.state.openPlan = this.app.state.openPlan === id ? null : id; this.render(true); },
  exportJson() {
    const d = this.app.state.data;
    this.app.download("personal-cfo-backup.json", JSON.stringify(d, null, 2), "application/json");
  },
  exportCsv() {
    const d = this.app.state.data;
    const rows = [["date", "type", "amount", "account", "person", "category", "desc"]].concat(
      d.tx.map(t => [t.date, t.type, t.amount, this.app.accName(t.accountId), this.app.personName(t.personId), t.category || "", (t.desc || "").replace(/"/g, "'")])
    );
    const csv = rows.map(r => r.map(c => '"' + String(c) + '"').join(",")).join("\n");
    this.app.download("personal-cfo-transactions.csv", csv, "text/csv");
  },
  reseed() { if (confirm(this.app.L("Reload demo data? This replaces everything currently stored.", "تحميل البيانات التجريبية؟ ده هيستبدل كل البيانات المحفوظة حالياً."))) { this.app.persist(this.app.seed(), "Demo data reloaded"); this.render(); } },
  wipe() {
    if (confirm(this.app.L("Erase all data? This cannot be undone.", "حذف كل البيانات؟ الإجراء ده لا يمكن التراجع عنه."))) {
      const empty = { accounts: [], people: [], tx: [], plans: [], groups: [], investments: [], recurring: [], audit: [{ at: new Date().toISOString().slice(0, 16).replace("T", " "), what: "Wiped all data" }] };
      this.app.persist(empty, null); this.render();
    }
  },

  // ---- render: full pass, with focus-preservation for text inputs ------
  render(skipFocusRestore) {
    const active = document.activeElement;
    const savedId = active && active.id ? active.id : null;
    const savedSel = (savedId && active.selectionStart != null) ? [active.selectionStart, active.selectionEnd] : null;

    const root = document.getElementById("root");
    const S = this.app.state, t = this.app.T[S.lang];
    const dir = S.lang === "ar" ? "rtl" : "ltr";
    document.documentElement.setAttribute("dir", dir);
    document.documentElement.setAttribute("lang", S.lang);

    if (!S.data) { root.innerHTML = "<p>Loading…</p>"; return; }
    const D = this.app.derive();

    root.innerHTML =
      '<div class="shell">' +
        this.renderPrimaryNav(t) +
        '<div class="main-col">' +
          this.renderTopbar(D, t) +
          this.renderMetricsRow(D, t) +
          '<main class="page">' + this.renderPage(D, t) + "</main>" +
        "</div>" +
      "</div>" +
      this.renderMoreSheet(t) +
      this.renderModal(t) +
      '<div id="savedFlash" class="flash" role="status" aria-live="polite">' + esc(S.saved) + "</div>";

    if (savedId && !skipFocusRestore) {
      const el = document.getElementById(savedId);
      if (el) { el.focus(); if (savedSel) { try { el.setSelectionRange(savedSel[0], savedSel[1]); } catch (e) {} } }
    } else if (savedId && skipFocusRestore) {
      const el = document.getElementById(savedId);
      if (el) { el.focus(); if (savedSel) { try { el.setSelectionRange(savedSel[0], savedSel[1]); } catch (e) {} } }
    }
  },

      '<div class="topbar-tools">' +
        '<div class="seg">' + langs + "</div>" +

    ).join("") + "</div>";
  },
  renderPrimaryNav(t) {
    const S = this.app.state;
    const items = this.app.PRIMARY.map(id => {
      const path = this.app.NAV.find(n => n[0] === id)[1];
      const on = S.page === id;
      return '<button class="navbtn' + (on ? " on" : "") + '" aria-current="' + (on ? "page" : "false") + '" onclick="UI.setPage(\'' + id + '\')">' + svgIcon(path, 20) + '<span>' + esc(t[id]) + "</span></button>";
    }).join("");
    const moreOn = !this.app.PRIMARY.includes(S.page);
    return '<nav class="primary-nav" aria-label="' + esc(t.primaryNav) + '">' + items +
      '<button class="navbtn' + (moreOn ? " on" : "") + '" aria-current="' + (moreOn ? "page" : "false") + '" aria-expanded="' + (S.moreOpen ? "true" : "false") + '" onclick="UI.toggleMore()">' + svgIcon("M5 12h.01M12 12h.01M19 12h.01", 20) + '<span>' + esc(t.more) + "</span></button>" +
    "</nav>";

  renderMoreSheet(t) {

  renderPage(D, t) {
    const S = this.app.state;
    switch (S.page) {
      case "dashboard": return this.renderDashboard(D, t);

      case "transactions": return this.renderTransactions(D, t);
      case "people": return this.renderPeople(D, t);
      case "installments": return this.renderInstallments(D, t);
      case "groups": return this.renderGroups(D, t);
      case "ledgers": return this.renderLedgers(D, t);
      case "investments": return this.renderInvestments(D, t);
      case "recurring": return this.renderRecurring(D, t);

  // ---- Dashboard (fix #5: single summary pass, Needs Attention promoted) --
  renderDashboard(D, t) {
    const app = this.app, S = app.state;
    const hero =
      '<div class="hero-card">' +
        '<div class="hero-label">' + esc(t.availableBalance) + "</div>" +
        '<div class="hero-value">' + app.fmt(D.available) + "</div>" +
        '<div class="hero-note">' + esc(t.availableNote) + "</div>" +
        '<div class="hero-sub-row">' +
          '<div><div class="hero-sub-label">' + esc(t.netWorth) + '</div><div class="hero-sub-value">' + app.fmt(D.netWorth) + "</div></div>" +
          '<div><div class="hero-sub-label">' + esc(t.receivables) + '</div><div class="hero-sub-value tone-pos">' + app.fmt(D.recvTotal) + "</div></div>" +
          '<div><div class="hero-sub-label">' + esc(t.payables) + '</div><div class="hero-sub-value tone-neg">' + app.fmt(D.payTotal) + "</div></div>" +
        "</div>" +
      "</div>";

    // Needs attention — built the same way as the original (overdue plans,
    // largest open receivables, negative card balances) but rendered right
    // after the hero instead of ~3 screens down.
    // NOTE: app.fmt()/app.fmtS() return HTML (a <bdi> wrapper, for the RTL
    // sign-gluing fix) rather than plain text, so any free-text piece mixed
    // into `body` alongside a fmt() call must be escaped here at
    // construction time — the body is rendered raw below, not re-escaped,
    // or the <bdi> markup would show up as literal text instead of money.
    const alerts = [];
    D.plans.filter(p => p.overdue > 0).forEach(p => alerts.push({
      title: app.L(p.direction === "in" ? "Overdue collection · " : "Overdue payment · ") + app.personName(p.personId),
      body: p.overdue + app.L(" installment(s) past due — ") + app.fmt(p.overdueAmt) + app.L(" on ") + esc(p.title),
      cta: t.installments + " →", go: "installments"
    }));
    Object.entries(D.recv).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]).slice(0, 2).forEach(([k, v]) => alerts.push({
      title: app.L("Largest open receivable"), body: esc(app.personName(k)) + app.L(" owes ") + app.fmt(v) + app.L(" outside any plan."),
      cta: t.collect + " →", act: "UI.openModal('receivable_payment',{personId:'" + k + "'})"
    }));
    if (D.cards < 0) alerts.push({ title: app.L("Credit card balance"), body: app.fmt(Math.abs(D.cards)) + app.L(" outstanding — counted as a liability, not as available money."), cta: t.accounts + " →", go: "accounts" });

    const needsAttention = '<section class="dash-section">' +
      '<h2 class="section-title">' + esc(t.needsAttention) + "</h2>" +
      (alerts.length ? '<div class="alert-list">' + alerts.map(a =>
        '<div class="alert-card"><div class="alert-title">' + esc(a.title) + '</div><div class="alert-body">' + a.body + '</div>' +
        '<button class="alert-cta" onclick="' + (a.act || ("UI.setPage('" + a.go + "')")) + '">' + esc(a.cta) + "</button></div>"
      ).join("") + "</div>" : '<p class="muted">' + esc(app.L("Nothing needs attention right now.", "مفيش حاجة محتاجة انتباه دلوقتي.")) + "</p>") +
    "</section>";

    // Where my money is — position breakdown, single instance only.
    const positionTiles = [
      [t.cash, D.cash], [t.bank, D.bank], [t.wallets, D.wallets],
      [t.other, D.cards], [t.investmentsShort, D.invValue], [t.receivables, D.recvTotal],
      [t.payables, -D.payTotal], [t.totalAssets, D.assets], [t.netWorth, D.netWorth]
    ];
    const whereMoney = '<section class="dash-section">' +
      '<h2 class="section-title">' + esc(t.whereMoney) + "</h2>" +
      '<div class="tile-grid">' + positionTiles.map(([l, v], i) =>
        '<div class="pos-tile' + (i > 6 ? " alt" : "") + '"><div class="pos-label">' + esc(l) + '</div><div class="pos-value">' + app.fmt(v) + "</div></div>"
      ).join("") + "</div>" +
    "</section>";

    // Next 30 days
    const fc = app.forecast(30, D);
    const upcoming = fc.events.slice(0, 7);
    const next30 = '<section class="dash-section">' +
      '<div class="section-head"><h2 class="section-title">' + esc(t.upcoming30) + '</h2><button class="link-btn" onclick="UI.setPage(\'forecast\')">' + esc(t.seeForecast) + "</button></div>" +
      (upcoming.length ? '<div class="event-list">' + upcoming.map(e =>
        '<div class="event-row"><span class="event-dot ' + (e.amount > 0 ? "pos" : "neg") + '"></span><span class="event-title">' + esc(e.title) + '</span><span class="event-when">' + app.dshort(e.date) + '</span><span class="event-amt ' + (e.amount > 0 ? "tone-pos" : "tone-neg") + '">' + app.fmtS(e.amount) + "</span></div>"
      ).join("") + "</div>" : '<p class="muted">—</p>') +
    "</section>";

    // This month
    const today = app.today(), mStart = today.slice(0, 8) + "01";
    const monthTx = D.live.filter(x => x.date >= mStart);
    const monthIncome = monthTx.filter(x => ["income", "refund", "investment_return"].includes(x.type)).reduce((s, x) => s + x.amount, 0);
    const monthExpense = monthTx.filter(x => x.type === "expense").reduce((s, x) => s + x.amount, 0);
    const catMap = {}; monthTx.filter(x => x.type === "expense").forEach(x => catMap[x.category || "Other"] = (catMap[x.category || "Other"] || 0) + x.amount);
    const catArr = Object.entries(catMap).sort((a, b) => b[1] - a[1]);
    const maxCat = Math.max(1, ...catArr.map(c => c[1]));
    const thisMonth = '<section class="dash-section">' +
      '<h2 class="section-title">' + esc(t.thisMonth) + "</h2>" +
      '<div class="two-col">' +
        '<div class="stat-box"><div class="pos-label">' + esc(t.income) + '</div><div class="pos-value tone-pos">' + app.fmt(monthIncome) + "</div></div>" +
        '<div class="stat-box"><div class="pos-label">' + esc(t.expenses) + '</div><div class="pos-value tone-neg">' + app.fmt(monthExpense) + "</div></div>" +
      "</div>" +
      (catArr.length ? '<div class="bar-list">' + catArr.slice(0, 5).map(([name, v]) =>
        '<div class="bar-row"><span class="bar-name">' + esc(name) + '</span><div class="bar-track"><div class="bar-fill" style="width:' + Math.max(4, v / maxCat * 100) + '%"></div></div><span class="bar-val">' + app.fmt(v) + "</span></div>"
      ).join("") + "</div>" : "") +
    "</section>";

    return hero + needsAttention + whereMoney + next30 + thisMonth;
  },

  // ---- Accounts -------------------------------------------------------------
  renderAccounts(D, t) {
    const app = this.app, d = app.state.data;
    const typeLabel = { cash: app.L("Cash", "كاش"), bank: app.L("Bank", "بنك"), wallet: app.L("Smart wallet", "محفظة إلكترونية"), card: app.L("Credit card", "بطاقة ائتمان"), other: app.L("Other", "أخرى") };
    const accs = d.accounts.filter(a => a.active);
    const maxAbs = Math.max(1, ...accs.map(a => Math.abs(D.bal[a.id])));
    const rows = accs.map(a => {
      const bal = D.bal[a.id];
      const extra = a.type === "card" ? '<div class="acc-sub">' + app.L("Limit", "الحد") + " " + app.fmt(a.limit) + " · " + app.fmt(Math.max(0, a.limit + bal)) + app.L(" left", " متاح") + "</div>" : (a.bank ? '<div class="acc-sub">' + esc(a.bank) + "</div>" : "");
      return '<div class="card-row">' +
        '<div class="card-row-top"><span class="acc-swatch" style="background:' + a.color + '"></span><div><div class="card-row-title">' + esc(a.name) + '</div><div class="card-row-sub">' + typeLabel[a.type] + "</div></div>" +
        '<div class="card-row-amt ' + (bal < 0 ? "tone-neg" : "tone-pos") + '">' + app.fmt(bal) + "</div></div>" +
        '<div class="bar-track thin"><div class="bar-fill" style="width:' + Math.max(2, Math.abs(bal) / maxAbs * 100) + '%;background:' + (bal < 0 ? "var(--c-neg)" : a.color) + '"></div></div>' +
        extra +
      "</div>";
    }).join("");
    return this.tabHeader(t.accounts, accs.length + app.L(" accounts · transfers never hit income or expense", " حساب · التحويلات لا تُحسب إيراداً ولا مصروفاً"),
      [[t.aAccount, "UI.openModal('account')"], [t.aCard, "UI.openModal('card')"], [t.transfer, "UI.openModal('transfer')"]]) +
      '<div class="card-list">' + rows + "</div>";
  },

  // ---- Transactions (fix #2 cards, fix #4 pagination) -------------------
  renderTransactions(D, t) {
    const app = this.app, S = app.state, d = app.state.data;
    const typeLabels = S.lang === "ar"
      ? { income: "إيراد", expense: "مصروف", transfer: "تحويل", receivable: "سلفة لي", receivable_payment: "تحصيل", payable: "دين عليّ", debt_payment: "سداد", investment_buy: "استثمار", investment_return: "عائد استثمار", installment_sale: "بيع بالتقسيط", installment_payment: "دفعة قسط", gam3ya_payment: "قسط جمعية", gam3ya_payout: "قبض جمعية", refund: "مرتجع", adjustment: "تسوية", reversal_marker: "عكس قيد" }
      : { income: "Income", expense: "Expense", transfer: "Transfer", receivable: "Receivable", receivable_payment: "Collection", payable: "Debt", debt_payment: "Repayment", investment_buy: "Investment", investment_return: "Inv. return", installment_sale: "Inst. sale", installment_payment: "Inst. payment", gam3ya_payment: "Gam3ya in", gam3ya_payout: "Gam3ya payout", refund: "Refund", adjustment: "Adjustment", reversal_marker: "Reversal" };
    const presetStart = { today: 0, week: 7, month: 30, quarter: 90, year: 365 };
    let rows = d.tx.slice().sort((a, b) => a.date < b.date ? 1 : (a.date > b.date ? -1 : 0));
    const F = S.filt;
    if (F.type !== "all") rows = rows.filter(r => r.type === F.type);
    if (F.account !== "all") rows = rows.filter(r => r.accountId === F.account || r.fromId === F.account || r.toId === F.account);
    if (F.preset !== "all") { const from = app.iso(app.addDays(new Date(), -presetStart[F.preset])); rows = rows.filter(r => r.date >= from); }
    if (F.q.trim()) { const q = F.q.toLowerCase(); rows = rows.filter(r => [r.desc, r.category, typeLabels[r.type], app.personName(r.personId), app.accName(r.accountId), app.accName(r.fromId), app.accName(r.toId)].join(" ").toLowerCase().includes(q)); }
    const outTypes = ["expense", "debt_payment", "receivable", "investment_buy", "gam3ya_payment"];
    const inTypes = ["income", "receivable_payment", "payable", "installment_payment", "investment_return", "refund", "gam3ya_payout"];
    const total = rows.length;
    const visible = rows.slice(0, S.txVisible);
    const items = visible.map(r => {
      const isIn = inTypes.includes(r.type) && !(r.type === "installment_payment" && app.planDir(r.planId) === "out");
      const signed = (r.type === "transfer" || r.type === "reversal_marker") ? 0 : (isIn ? r.amount : -r.amount);
      const amtTxt = r.type === "reversal_marker" ? "—" : (signed === 0 ? app.fmt(r.amount) : app.fmtS(signed));
      const acc = r.type === "transfer" ? app.accName(r.fromId) + " → " + app.accName(r.toId) : (r.accountId ? app.accName(r.accountId) : "—");
      const tone = r.void ? "muted-amt" : (signed > 0 ? "tone-pos" : signed < 0 ? "tone-neg" : "");
      return { r, isIn, signed, amtTxt, acc, tone };
    });

    const table = '<div class="table-wrap desktop-only"><table class="table"><thead><tr>' +
      "<th>" + esc(t.date) + "</th><th>" + esc(t.type) + "</th><th>" + esc(t.details) + "</th><th>" + esc(t.person) + "</th><th>" + esc(t.account) + "</th><th class=\"num\">" + esc(t.amount) + "</th><th></th>" +
      "</tr></thead><tbody>" + items.map(({ r, isIn, amtTxt, acc, tone }) =>
        '<tr style="' + (r.void ? "opacity:.45;text-decoration:line-through" : "") + '">' +
          "<td>" + r.date + "</td>" +
          '<td><span class="tag ' + (isIn ? "tag-pos" : r.type === "transfer" ? "tag-neu" : "tag-neg") + '">' + esc(typeLabels[r.type] || r.type) + "</span></td>" +
          "<td>" + esc(r.desc || "—") + "</td>" +
          "<td>" + esc(r.personId ? app.personName(r.personId) : "—") + "</td>" +
          "<td>" + esc(acc) + "</td>" +
          '<td class="num ' + tone + '">' + amtTxt + "</td>" +
          '<td><button class="link-btn small" onclick="UI.reverseTx(\'' + r.id + '\')" ' + (r.void ? "disabled" : "") + ">" + esc(r.void ? app.L("reversed") : app.L("reverse")) + "</button></td>" +
        "</tr>"
      ).join("") + "</tbody></table></div>";

    const cards = '<div class="card-list mobile-only">' + items.map(({ r, isIn, amtTxt, acc, tone }) =>
      '<div class="card-row' + (r.void ? " voided" : "") + '">' +
        '<div class="card-row-top"><div><div class="card-row-title">' + esc(r.desc || "—") + '</div><div class="card-row-sub">' + r.date + " · " + esc(typeLabels[r.type] || r.type) + "</div></div>" +
        '<div class="card-row-amt ' + tone + '">' + amtTxt + "</div></div>" +
        '<div class="card-row-meta">' +
          (r.personId ? '<span>' + esc(app.personName(r.personId)) + "</span>" : "") +
          '<span>' + esc(acc) + "</span>" +
        "</div>" +
        '<button class="link-btn small" onclick="UI.reverseTx(\'' + r.id + '\')" ' + (r.void ? "disabled" : "") + ">" + esc(r.void ? app.L("reversed") : app.L("reverse")) + "</button>" +
      "</div>"
    ).join("") + "</div>";

    const loadMore = total > S.txVisible ? '<button class="btn btn-secondary block" onclick="UI.loadMoreTx()">' + esc(t.loadMore) + " (" + (total - S.txVisible) + ")</button>" : "";

    const typeOptions = ["all"].concat(Object.keys(typeLabels)).map(k => '<option value="' + k + '"' + (F.type === k ? " selected" : "") + ">" + (k === "all" ? esc(app.L("All types")) : esc(typeLabels[k])) + "</option>").join("");
    const accOptions = ["all"].concat(d.accounts.map(a => a.id)).map(id => '<option value="' + id + '"' + (F.account === id ? " selected" : "") + ">" + (id === "all" ? esc(app.L("All accounts")) : esc(app.accName(id))) + "</option>").join("");
    const presetOptions = [["all", app.L("All time")], ["today", app.L("Today")], ["week", app.L("Last 7 days")], ["month", app.L("Last 30 days")], ["quarter", app.L("Last 90 days")], ["year", app.L("Last 12 months")]]
      .map(([k, l]) => '<option value="' + k + '"' + (F.preset === k ? " selected" : "") + ">" + esc(l) + "</option>").join("");

    const filters = '<div class="filter-row">' +
      '<input id="txSearch" class="input" type="search" placeholder="' + esc(t.search) + '" value="' + esc(F.q) + '" oninput="UI.setFilter(\'q\', this.value)">' +
      '<select class="input" onchange="UI.setFilter(\'type\', this.value)">' + typeOptions + "</select>" +
      '<select class="input" onchange="UI.setFilter(\'account\', this.value)">' + accOptions + "</select>" +
      '<select class="input" onchange="UI.setFilter(\'preset\', this.value)">' + presetOptions + "</select>" +
    "</div>";

    return this.tabHeader(t.transactions, total + app.L(" records match your filters", " حركة مطابقة للفلاتر"),
      [[t.aIncome, "UI.openModal('income')"], [t.aTransfer, "UI.openModal('transfer')"]]) +
      filters + (total ? table + cards + loadMore : '<p class="muted">' + esc(t.noMatches) + "</p>");
  },

  // ---- People ----------------------------------------------------------------
  renderPeople(D, t) {
    const app = this.app, d = app.state.data;
    const rows = d.people.map(p => {
      const planIn = D.plans.filter(x => x.personId === p.id && x.direction === "in").reduce((s, x) => s + x.remaining, 0);
      const planOut = D.plans.filter(x => x.personId === p.id && x.direction === "out").reduce((s, x) => s + x.remaining, 0);
      const r = Math.max(0, D.recv[p.id] || 0) + planIn, y = Math.max(0, D.pay[p.id] || 0) + planOut;
      const canDelete = !app.personHasRecords(p.id);
      return { p, r, y, net: r - y, canDelete };
    }).sort((a, b) => Math.abs(b.net) - Math.abs(a.net));

    const table = '<div class="table-wrap desktop-only"><table class="table"><thead><tr>' +
      "<th>" + esc(t.name) + "</th><th>" + esc(t.phone) + "</th><th class=\"num\">" + esc(t.owesMe) + "</th><th class=\"num\">" + esc(t.iOwe) + "</th><th class=\"num\">" + esc(t.net) + "</th><th></th>" +
      "</tr></thead><tbody>" + rows.map(({ p, r, y, net, canDelete }) =>
        "<tr><td>" + esc(p.name) + "</td><td>" + esc(p.phone || "—") + '</td><td class="num tone-pos">' + app.fmt(r) + '</td><td class="num tone-neg">' + app.fmt(y) + '</td><td class="num ' + (net >= 0 ? "tone-pos" : "tone-neg") + '">' + app.fmt(net) + "</td>" +
        '<td><button class="link-btn small" onclick="UI.setPage(\'transactions\');UI.setFilter(\'q\',\'' + esc(p.name).replace(/'/g, "\\'") + '\')">' + esc(t.viewTx) + "</button></td></tr>"
      ).join("") + "</tbody></table></div>";

    const cards = '<div class="card-list mobile-only">' + rows.map(({ p, r, y, net }) =>
      '<div class="card-row"><div class="card-row-top"><div><div class="card-row-title">' + esc(p.name) + '</div><div class="card-row-sub">' + esc(p.phone || "—") + "</div></div>" +
      '<div class="card-row-amt ' + (net >= 0 ? "tone-pos" : "tone-neg") + '">' + app.fmt(net) + "</div></div>" +
      '<div class="card-row-meta"><span>' + esc(t.owesMe) + ": " + app.fmt(r) + '</span><span>' + esc(t.iOwe) + ": " + app.fmt(y) + "</span></div>" +
      '<button class="link-btn small" onclick="UI.setPage(\'transactions\');UI.setFilter(\'q\',\'' + esc(p.name).replace(/'/g, "\\'") + '\')">' + esc(t.viewTx) + "</button></div>"
    ).join("") + "</div>";

    return this.tabHeader(t.people, d.people.length + app.L(" people · balances computed from the ledger", " شخص · الأرصدة محسوبة من السجل"), [[t.aPerson, "UI.openModal('person')"]]) + table + cards;
  },

  // ---- Installments (P1 KPI quirk intentionally preserved) -----------------
  renderInstallments(D, t) {
    const app = this.app;
    // P1 fix: the KPI strip used to only cover plans "owed to me" and quietly
    // dropped any "I owe" plan from every number, including Overdue — now
    // both directions get their own honestly-labeled row.
    const inPlans = D.plans.filter(p => p.direction === "in");
    const outPlans = D.plans.filter(p => p.direction === "out");
    const kpiGroup = (plans, totalTone, dueLabel) => {
      const kpis = [
        [app.L("Total"), app.fmt(plans.reduce((s, p) => s + p.total, 0)), "neu"],
        [dueLabel, app.fmt(plans.reduce((s, p) => s + p.collected, 0)), "pos"],
        [t.remaining, app.fmt(plans.reduce((s, p) => s + p.remaining, 0)), totalTone],
        [app.L("Overdue"), app.fmt(plans.reduce((s, p) => s + p.overdueAmt, 0)), "neg"]
      ];
      return '<div class="tile-grid four">' + kpis.map(([l, v, tone]) => '<div class="pos-tile"><div class="pos-label">' + esc(l) + '</div><div class="pos-value tone-' + tone + '">' + v + "</div></div>").join("") + "</div>";
    };
    const due = app.duesThisMonth(D);
    const dueBanner = '<div class="due-banner"><div class="pos-label">' + esc(app.L("Due this month (installments + gam3eya)", "المطلوب مني الشهر ده (أقساط + جمعيات)")) + '</div><div class="hero-sub-value tone-neg" style="font-size:22px">' + app.fmt(due.total) + "</div></div>";
    const kpiRow = dueBanner +
      '<h2 class="section-title">' + esc(t.receivables) + " · " + app.fmt(inPlans.reduce((s, p) => s + p.remaining, 0)) + "</h2>" + kpiGroup(inPlans, "neg", t.collected) +
      '<h2 class="section-title">' + esc(t.payables) + " · " + app.fmt(outPlans.reduce((s, p) => s + p.remaining, 0)) + "</h2>" + kpiGroup(outPlans, "neg", t.paid);

    const planCards = D.plans.map(p => {
      const open = app.state.openPlan === p.id;
      const rowsHtml = p.rows.map(r => '<div class="sched-row status-' + r.status + '"><span>#' + r.no + " · " + r.due + '</span><span>' + app.fmt(r.amount) + '</span><span class="sched-status">' + esc(app.L(r.status === "paid" ? "Fully settled" : r.status === "overdue" ? "Overdue" : r.status === "partial" ? "On schedule" : "Open")) + "</span></div>").join("");
      return '<div class="card-row">' +
        '<div class="card-row-top"><div><div class="card-row-title">' + esc(p.title) + '</div><div class="card-row-sub">' + esc(app.personName(p.personId)) + " · " + esc(app.L(p.direction === "in" ? "Owed to me" : "I owe")) + "</div></div>" +
        '<div class="card-row-amt ' + (p.direction === "in" ? "tone-pos" : "tone-neg") + '">' + app.fmt(p.remaining) + "</div></div>" +
        '<div class="card-row-meta"><span>' + esc(t.collected) + ": " + app.fmt(p.collected) + " / " + app.fmt(p.total) + '</span>' +
        (p.overdue > 0 ? '<span class="tone-neg">' + esc(app.L("Overdue: ")) + p.overdue + "</span>" : '<span>' + esc(app.L("No overdue")) + "</span>") + "</div>" +
        '<button class="link-btn small" onclick="UI.togglePlanRows(\'' + p.id + '\')">' + esc(app.L(open ? "Hide schedule" : "Show schedule")) + "</button>" +
        (open ? '<div class="sched-list">' + rowsHtml + "</div>" : "") +
        '<button class="btn btn-secondary small" onclick="UI.openModal(\'installment_payment\',{planId:\'' + p.id + '\'})">' + esc(t.recordPayment) + "</button>" +
      "</div>";
    }).join("");

    return this.tabHeader(t.installments, D.plans.length + app.L(" plans · allocation handles partial, early and balloon payments", " خطة · التوزيع يعالج الدفعات الجزئية والمبكرة والدفعة الأخيرة"),
      [[t.aSale, "UI.openModal('sale')"], [t.aPurchasePlan, "UI.openModal('purchase')"]]) + kpiRow + '<div class="card-list">' + planCards + "</div>";
  },

  // ---- Savings groups (gam3eya) -----------------------------------------
  renderGroups(D, t) {
    const app = this.app;
    const cards = D.groups.map(g => {
      const open = app.state.openPlan === g.id;
      const rowsHtml = g.rows.map(r => '<div class="sched-row status-' + r.status + (r.mine ? " mine" : "") + '"><span>#' + r.no + " · " + r.due + (r.mine ? " · " + esc(app.L("My turn")) : "") + '</span><span>' + app.fmt(r.amount) + '</span></div>').join("");
      return '<div class="card-row">' +
        '<div class="card-row-top"><div><div class="card-row-title">' + esc(g.name) + '</div><div class="card-row-sub">' + esc(app.L("Turn ") + g.group.myTurn + app.L(" of ") + g.periods) + "</div></div>" +
        '<div class="card-row-amt ' + (g.net >= 0 ? "tone-pos" : "tone-neg") + '">' + app.fmt(g.net) + "</div></div>" +
        '<div class="card-row-meta"><span>' + esc(t.paidIn) + ": " + app.fmt(g.paidTotal) + '</span><span>' + esc(app.L("My payout")) + ": " + app.fmt(g.payout) + "</span></div>" +
        '<div class="card-row-meta"><span>' + esc(g.taken ? app.L("Payout collected") : app.L("Payout not collected yet")) + '</span>' + (g.overdue > 0 ? '<span class="tone-neg">' + esc(app.L("Overdue: ")) + g.overdue + "</span>" : "") + "</div>" +
        '<button class="link-btn small" onclick="UI.togglePlanRows(\'' + g.id + '\')">' + esc(app.L(open ? "Hide schedule" : "Show schedule")) + "</button>" +
        (open ? '<div class="sched-list">' + rowsHtml + "</div>" : "") +
        '<div class="btn-row"><button class="btn btn-secondary small" onclick="UI.openModal(\'group_payment\',{groupId:\'' + g.id + '\'})">' + esc(t.gContribute) + '</button><button class="btn btn-secondary small" onclick="UI.openModal(\'group_payout\',{groupId:\'' + g.id + '\'})">' + esc(t.gCollect) + "</button></div>" +
      "</div>";
    }).join("");
    const due = app.duesThisMonth(D);
    const dueBanner = '<div class="due-banner"><div class="pos-label">' + esc(app.L("Due this month (installments + gam3eya)", "المطلوب مني الشهر ده (أقساط + جمعيات)")) + '</div><div class="hero-sub-value tone-neg" style="font-size:22px">' + app.fmt(due.total) + "</div></div>";
    return this.tabHeader(t.groups, app.L("Contributions out, one payout in at your turn", "أقساط تدفعها، ودفعة واحدة تقبضها في دورك"), [[t.aGroup, "UI.openModal('group')"]]) + dueBanner + '<div class="card-list">' + cards + "</div>";
  },

  // ---- Receivables & Payables (ledger view over the same person data) ----
  renderLedgers(D, t) {
    const app = this.app, d = app.state.data;
    const withNet = d.people.map(p => {
      const planIn = D.plans.filter(x => x.personId === p.id && x.direction === "in").reduce((s, x) => s + x.remaining, 0);
      const planOut = D.plans.filter(x => x.personId === p.id && x.direction === "out").reduce((s, x) => s + x.remaining, 0);
      return { p, r: Math.max(0, D.recv[p.id] || 0) + planIn, y: Math.max(0, D.pay[p.id] || 0) + planOut };
    });
    const owedToMe = withNet.filter(x => x.r > 0).sort((a, b) => b.r - a.r);
    const iOwe = withNet.filter(x => x.y > 0).sort((a, b) => b.y - a.y);
    const list = (arr, key, tone) => '<div class="card-list">' + (arr.length ? arr.map(x =>
      '<div class="card-row"><div class="card-row-top"><div class="card-row-title">' + esc(x.p.name) + '</div><div class="card-row-amt tone-' + tone + '">' + app.fmt(x[key]) + "</div></div></div>"
    ).join("") : '<p class="muted">' + esc(app.L("Fully settled")) + "</p>") + "</div>";
    return this.tabHeader(t.ledgers, app.L("Open positions by person and by plan"), [[t.aReceivable, "UI.openModal('receivable')"], [t.aDebt, "UI.openModal('payable')"]]) +
      '<h2 class="section-title">' + esc(t.receivables) + " · " + app.fmt(D.recvTotal) + "</h2>" + list(owedToMe, "r", "pos") +
      '<h2 class="section-title" style="margin-top:20px">' + esc(t.payables) + " · " + app.fmt(D.payTotal) + "</h2>" + list(iOwe, "y", "neg");
  },

  // ---- Investments -----------------------------------------------------------
  renderInvestments(D, t) {
    const app = this.app, d = app.state.data;
    const cards = d.investments.map(v => {
      const pnl = v.value - v.invested;
      return '<div class="card-row"><div class="card-row-top"><div><div class="card-row-title">' + esc(v.name) + '</div><div class="card-row-sub">' + esc(v.type) + "</div></div>" +
        '<div class="card-row-amt">' + app.fmt(v.value) + "</div></div>" +
        '<div class="card-row-meta"><span>' + esc(t.invested) + ": " + app.fmt(v.invested) + '</span><span class="' + (pnl >= 0 ? "tone-pos" : "tone-neg") + '">' + esc(t.pnl) + ": " + app.fmtS(pnl) + "</span></div>" +
        '<button class="btn btn-secondary small" onclick="UI.openModal(\'invest_update\',{investmentId:\'' + v.id + '\'})">' + esc(t.updateValue) + "</button></div>";
    }).join("");
    return this.tabHeader(t.investments, D.invValue.toFixed ? (app.fmt(D.invValue) + " · " + esc(t.pnl) + " " + app.fmtS(D.invValue - D.invCost)) : "", [[t.aInvest, "UI.openModal('investment')"]]) + '<div class="card-list">' + cards + "</div>";
  },

  // ---- Recurring ----------------------------------------------------------
  renderRecurring(D, t) {
    const app = this.app, d = app.state.data;
    const freqLabel = { daily: app.L("Daily"), weekly: app.L("Weekly"), monthly: app.L("Monthly"), quarterly: app.L("Quarterly"), yearly: app.L("Yearly") };
    const cards = d.recurring.map(r => {
      const next = app.nextOccurrence(r, new Date());
      return '<div class="card-row"><div class="card-row-top"><div><div class="card-row-title">' + esc(r.name) + '</div><div class="card-row-sub">' + freqLabel[r.freq] + " · " + esc(t.nextDate) + " " + app.dshort(next) + "</div></div>" +
        '<div class="card-row-amt ' + (r.type === "income" ? "tone-pos" : "tone-neg") + '">' + app.fmtS(r.type === "income" ? r.amount : -r.amount) + "</div></div>" +
        '<button class="btn btn-secondary small" onclick="UI.postRecurringC(\'' + r.id + '\')">' + esc(t.postNow) + "</button></div>";
    }).join("");
    const monthlyIncome = d.recurring.filter(r => r.type === "income" && r.freq === "monthly").reduce((s, r) => s + r.amount, 0);
    const monthlyExpense = d.recurring.filter(r => r.type === "expense" && r.freq === "monthly").reduce((s, r) => s + r.amount, 0);
    return this.tabHeader(t.recurring, app.L("Monthly rules: ") + app.fmt(monthlyIncome) + app.L(" in, ") + app.fmt(monthlyExpense) + app.L(" out"), [[t.aRecurring, "UI.openModal('recurring')"]]) +
      '<p class="muted small">' + esc(t.recurNote) + '</p><div class="card-list">' + cards + "</div>";
  },

  // ---- Forecast ------------------------------------------------------------
  renderForecast(D, t) {
    const app = this.app, S = app.state;
    const fc = app.forecast(S.horizon, D);
    const horizons = ["7", "30", "90", "180", "365"];
    const pills = horizons.map(h => '<button class="pill' + (S.horizon == h ? " on" : "") + '" onclick="UI.setHorizon(' + h + ')">' + h + esc(app.L(" days", " يوم")) + "</button>").join("");
    const maxAbs = Math.max(Math.abs(D.available), Math.abs(fc.projected), 1);
    const track = '<div class="proj-bar"><div class="proj-fill" style="width:' + Math.min(100, Math.abs(fc.projected) / maxAbs * 100) + '%;background:' + (fc.projected >= 0 ? "var(--c-pos)" : "var(--c-neg)") + '"></div></div>';
    const events = fc.events.slice(0, 40).map(e => '<div class="event-row"><span class="event-dot ' + (e.amount > 0 ? "pos" : "neg") + '"></span><span class="event-title">' + esc(e.title) + '</span><span class="event-when">' + app.dshort(e.date) + '</span><span class="event-amt ' + (e.amount > 0 ? "tone-pos" : "tone-neg") + '">' + app.fmtS(e.amount) + "</span></div>").join("");
    return this.tabHeader(t.forecast, app.L("If nothing changes, this is your runway"), []) +
      '<div class="pill-row">' + pills + "</div>" +
      '<div class="hero-card alt"><div class="hero-label">' + esc(t.timeline) + '</div><div class="hero-value">' + app.fmt(fc.projected) + "</div>" + track +
      '<div class="two-col" style="margin-top:14px"><div class="stat-box"><div class="pos-label">' + esc(app.L("Available today")) + '</div><div class="pos-value">' + app.fmt(D.available) + "</div></div>" +
      '<div class="stat-box"><div class="pos-label">' + esc(app.L("Expected inflows")) + '</div><div class="pos-value tone-pos">' + app.fmt(fc.inflow) + "</div></div></div></div>" +
      '<h2 class="section-title">' + esc(app.L("Expected outflows")) + " " + app.fmt(Math.abs(fc.outflow)) + '</h2><div class="event-list">' + (events || '<p class="muted">—</p>') + "</div>";
  },

  // ---- Reports (uses derive(asOf) to build a real 6-month trend) --------
  renderReports(D, t) {
    const app = this.app;
    const months = [];
    for (let i = 5; i >= 0; i--) {
      const end = app.addMonths(new Date(), -i); end.setDate(28);
      const cutoff = app.iso(end);
      const Dm = app.derive(cutoff);
      months.push({ label: end.toLocaleDateString(app.state.lang === "ar" ? "ar-EG" : "en-GB", { month: "short" }), netWorth: Dm.netWorth });
    }
    const maxNW = Math.max(1, ...months.map(m => Math.abs(m.netWorth)));
    const nwChart = '<div class="chart-cols">' + months.map(m => '<div class="chart-col"><div class="chart-bar" style="height:' + Math.max(4, Math.abs(m.netWorth) / maxNW * 100) + '%;background:' + (m.netWorth >= 0 ? "var(--c-pos)" : "var(--c-neg)") + '"></div><div class="chart-label">' + esc(m.label) + "</div></div>").join("") + "</div>";

    const catMap = {}; D.live.filter(x => x.type === "expense").forEach(x => catMap[x.category || "Other"] = (catMap[x.category || "Other"] || 0) + x.amount);
    const catArr = Object.entries(catMap).sort((a, b) => b[1] - a[1]).slice(0, 8);
    const maxCat = Math.max(1, ...catArr.map(c => c[1]));

    const srcMap = {}; D.live.filter(x => ["income", "refund", "investment_return"].includes(x.type)).forEach(x => srcMap[x.category || "Other"] = (srcMap[x.category || "Other"] || 0) + x.amount);
    const srcArr = Object.entries(srcMap).sort((a, b) => b[1] - a[1]).slice(0, 8);
    const maxSrc = Math.max(1, ...srcArr.map(c => c[1]));

    const barList = (arr, max, tone) => '<div class="bar-list">' + arr.map(([name, v]) => '<div class="bar-row"><span class="bar-name">' + esc(name) + '</span><div class="bar-track"><div class="bar-fill ' + tone + '" style="width:' + Math.max(4, v / max * 100) + '%"></div></div><span class="bar-val">' + app.fmt(v) + "</span></div>").join("") + "</div>";

    return this.tabHeader(t.reports, app.L("Six-month history plus aging and category analysis"), []) +
      '<h2 class="section-title">' + esc(t.netWorthTrend) + "</h2>" + nwChart +
      '<h2 class="section-title">' + esc(t.byCategory) + "</h2>" + (catArr.length ? barList(catArr, maxCat, "neg-fill") : '<p class="muted">—</p>') +
      '<h2 class="section-title">' + esc(t.bySource) + "</h2>" + (srcArr.length ? barList(srcArr, maxSrc, "pos-fill") : '<p class="muted">—</p>');
  },

  // ---- Settings --------------------------------------------------------------
  renderSettings(D, t) {
    const app = this.app, d = app.state.data;
    const rules = [
      { k: app.L("Receivables & assets"), v: app.L("Money owed to you counts as an asset toward net worth by default.") },
      { k: app.L("Installment allocation"), v: app.L("payments fill schedule rows oldest first; a short payment leaves the row partial, an overpayment rolls into the next rows.") },
      { k: app.L("Reversals"), v: app.L("nothing is deleted — a void flag plus a reversal marker keeps the audit trail intact.") },
      { k: app.L("Savings groups (gam3ya)"), v: app.L("contributions are cash out, the payout is cash in; your position is paid-in minus collected — an asset before your turn, a liability after it.") },
      { k: app.L("Opening positions"), v: app.L("receivables and debts carried in from before the system move no cash.") },
      { k: app.L("Forecast"), v: app.L("recurring rules plus unpaid installment rows, applied to today's available balance.") }
    ];
    return this.tabHeader(t.settings, app.L("Backup, restore and the calculation rules in force"), []) +
      '<section class="dash-section"><h2 class="section-title">' + esc(t.dataBackup) + '</h2><p class="muted small">' + esc(t.backupNote) + '</p>' +
      '<div class="btn-row wrap"><button class="btn btn-secondary" onclick="UI.exportJson()">' + esc(t.exportJson) + '</button><button class="btn btn-secondary" onclick="UI.exportCsv()">' + esc(t.exportCsv) + "</button></div></section>" +
      '<section class="dash-section"><h2 class="section-title">' + esc(t.rules) + '</h2><div class="rules-list">' + rules.map(r => '<div class="rule-row"><div class="rule-k">' + esc(r.k) + '</div><div class="rule-v">' + esc(r.v) + "</div></div>").join("") + "</div></section>" +
      '<section class="dash-section"><h2 class="section-title">' + esc(t.auditTrail) + '</h2><div class="audit-list">' + (d.audit || []).slice(0, 20).map(a => '<div class="audit-row"><span>' + esc(a.at) + '</span><span>' + esc(a.what) + "</span></div>").join("") + "</div></section>" +
      '<section class="dash-section"><h2 class="section-title tone-neg">' + esc(t.dangerZone) + '</h2><div class="btn-row wrap"><button class="btn btn-secondary" onclick="UI.reseed()">' + esc(t.reseed) + '</button><button class="btn btn-danger" onclick="UI.wipe()">' + esc(t.wipe) + "</button></div></section>";
  },

  // ---- shared bits -------------------------------------------------------
  // `sub` is trusted, pre-composed HTML — every call site builds it from
  // counts, app.L() static phrases, and/or app.fmt()/fmtS() (which return a
  // <bdi> wrapper, not plain text). None currently splice in raw free-text
  // user data; if a future call site does, esc() that piece before handing
  // it to tabHeader — escaping the whole `sub` here would turn Investments'
  // and Recurring's fmt()-based subtitles back into literal "<bdi>..." text.
  tabHeader(title, sub, actions) {
    return '<div class="tab-head"><div><h1 class="tab-title">' + esc(title) + '</h1><div class="tab-sub">' + sub + "</div></div>" +
      (actions && actions.length ? '<div class="btn-row wrap">' + actions.map(([l, act]) => '<button class="btn btn-secondary small" onclick="' + act + '">' + esc(l) + "</button>").join("") + "</div>" : "") +
    "</div>";
  },

  // ---- modal ---------------------------------------------------------------
  renderModal(t) {
    const app = this.app, S = app.state;
    if (!S.modal) return "";
    const F = app.FORMS()[S.modal];
    if (!F) return "";
    const form = S.form;
    const field = (f) => {
      const val = form[f.k] !== undefined ? form[f.k] : "";
      let input;
      if (f.type === "select") {
        input = '<select class="input" id="f_' + f.k + '" name="' + f.k + '">' + f.options.map(o => '<option value="' + esc(o.v) + '"' + (String(val) === String(o.v) ? " selected" : "") + ">" + esc(o.l) + "</option>").join("") + "</select>";
      } else {
        input = '<input class="input" id="f_' + f.k + '" name="' + f.k + '" type="' + f.type + '" value="' + esc(val) + '">';
      }
      return '<label class="field' + (f.wide ? " wide" : "") + '"><span class="field-label">' + esc(f.label) + "</span>" + input + (f.hint ? '<span class="field-hint">' + esc(f.hint) + "</span>" : "") + "</label>";
    };
    return '<div class="sheet-backdrop" onclick="UI.closeModal()"></div>' +
      '<div class="dialog" role="dialog" aria-label="' + esc(F.title) + '">' +
        '<div class="dialog-title">' + esc(F.title) + "</div>" +
        (S.err ? '<div class="dialog-err" role="alert" aria-live="assertive">' + esc(S.err) + "</div>" : "") +
        '<form id="modalForm" class="field-grid" onsubmit="event.preventDefault();UI.submitModal()">' + F.fields.map(field).join("") + "</form>" +
        '<div class="dialog-actions"><button class="btn btn-secondary" onclick="UI.closeModal()">' + esc(t.cancel) + '</button><button class="btn btn-primary" onclick="UI.submitModal()">' + esc(t.save) + "</button></div>" +
      "</div>";
  }
};

</script>
<script>
window.addEventListener("DOMContentLoaded", function () {
  var engine = new Engine({ defaultHorizon: "30", receivablesAreAssets: true, privacyDefault: false });
  window.UI = UI;
  window.APP = engine;
  UI.init(engine);
});
</script>
